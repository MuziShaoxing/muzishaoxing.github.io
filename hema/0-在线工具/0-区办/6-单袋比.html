<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>单袋比 · 领用分析</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>

    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-soft: #f0fdfa;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --warning-bg: #fff7ed;
            --warning-border: #fdba74;
            --danger-text: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --duplicate-bg: #eff6ff;
            --duplicate-border: #3b82f6;
            --pill-bg: #dc2626;
            --pill-border: #b91c1c;
            --pill-text: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px 32px;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
            line-height: 1.5;
        }

        .global-header {
            max-width: 1300px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 16px 22px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .global-header .app-title {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .global-header .app-title .emoji { font-size: 1.5rem; }
        .global-header .version-pill {
            font-size: 0.65rem;
            background: #e0f2fe;
            color: #0369a1;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid #bae6fd;
        }
        .global-header .meta-info {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .global-header .meta-info .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .app-shell {
            max-width: 1300px;
            width: 100%;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .sidebar {
            flex: 0 0 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 20px;
            align-self: flex-start;
        }

        .sidebar-panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px 20px 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 7px;
            letter-spacing: -0.2px;
        }
        .panel-title .icon-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .icon-circle.required { background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; }
        .icon-circle.optional { background: #f0fdfa; color: #0d9488; border: 1.5px solid #99f6e4; }
        .badge-required { font-size: 0.6rem; background: #fef2f2; color: #dc2626; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
        .badge-optional { font-size: 0.6rem; background: #f0fdfa; color: #0d9488; padding: 2px 8px; border-radius: 20px; font-weight: 500; }

        .upload-zone {
            background: #fafbfc;
            border: 2px dashed #d1d5db;
            border-radius: var(--radius-md);
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }
        .upload-zone:hover { border-color: var(--accent); background: #f5fdfb; }
        .upload-zone input { display: none; }
        .upload-zone .upload-icon { font-size: 1.6rem; display: block; margin-bottom: 2px; }
        .upload-zone .upload-label { font-weight: 600; font-size: 0.8rem; color: #374151; }
        .upload-zone .upload-hint { font-size: 0.65rem; color: #9ca3af; margin-top: 1px; }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            width: 100%;
            justify-content: center;
        }
        .status-chip.idle { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; }
        .status-chip.success { background: #f0fdfa; color: #0f766e; border: 1px solid #99f6e4; }
        .status-chip.warning { background: #fefce8; color: #a16207; border: 1px solid #fde047; }
        .status-chip.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        .btn-paste {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            padding: 7px 15px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            color: #475569;
            transition: all var(--transition);
        }
        .btn-paste:hover { border-color: var(--accent); color: var(--accent); background: #fafdfc; }

        .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #475569; cursor: pointer; }
        .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

        .select-row {
            background: #f8fafc;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
        }
        .select-row select {
            width: 100%;
            padding: 7px 10px;
            border: 1.5px solid #d1d5db;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            background: white;
            cursor: pointer;
        }
        .select-row select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
        .select-row select:disabled { opacity: 0.5; cursor: not-allowed; background: #f1f5f9; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 20px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(13,148,136,0.3); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-primary:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-outline { background: white; border: 1.5px solid #d1d5db; color: #475569; }
        .btn-outline:hover { border-color: #94a3b8; background: #f8fafc; }
        .btn-ghost { background: transparent; border: 1.5px solid transparent; color: #64748b; padding: 6px 12px; font-size: 0.72rem; }
        .btn-ghost:hover { background: #f1f5f9; color: #475569; }

        .warn-text {
            font-size: 0.68rem;
            color: #dc2626;
            background: #fef2f2;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            display: none;
            text-align: center;
        }
        .warn-text.visible { display: block; }
        .info-text {
            font-size: 0.68rem;
            color: #0f766e;
            background: #f0fdfa;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #99f6e4;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }
        .info-text.visible { display: flex; }
        .hint-text { font-size: 0.7rem; color: #64748b; text-align: center; font-style: italic; }

        .main-area { flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

        .action-bar {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .param-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
        }
        .param-inline label { font-weight: 600; font-size: 0.8rem; color: #374151; }
        .param-inline input {
            width: 70px;
            padding: 6px 10px;
            border: 1.5px solid #d1d5db;
            border-radius: 20px;
            text-align: center;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .stats-strip { display: flex; flex-wrap: wrap; gap: 10px; }
        .stat-tile {
            flex: 1 1 80px;
            min-width: 70px;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 8px 4px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: default;
        }
        .stat-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-tile .tile-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-tile .tile-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.2;
        }
        .tile-value.green { color: #059669; } .tile-value.red { color: #dc2626; } .tile-value.teal { color: #0d9488; }
        .stat-tile.accent-tile { border-left: 3px solid var(--accent); }

        .table-container {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 520px;
            flex: 1 1 auto;
        }
        .table-header-fixed {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            flex-shrink: 0;
        }
        .table-header-fixed th {
            font-weight: 700;
            text-align: center;
            padding: 11px 6px;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            white-space: nowrap;
            border-right: 1px solid #e2e8f0;
            cursor: pointer;
            user-select: none;
            color: #475569;
        }
        .table-header-fixed th:hover { background: #eef2f7; }
        .table-header-fixed th:last-child { border-right: none; }
        .table-header-fixed th:first-child { text-align: right; padding-right: 14px; }
        .table-header-fixed th:last-child { text-align: left; padding-left: 14px; }

        .table-scroll-body {
            overflow: auto;
            flex: 1 1 auto;
            min-height: 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .table-scroll-body::-webkit-scrollbar {
            display: none;
        }
        .table-scroll-body.grabbing {
            cursor: grabbing;
        }

        .data-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .data-table td {
            padding: 9px 6px;
            border-bottom: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .data-table td:last-child { border-right: none; }
        .data-table td:first-child {
            text-align: right;
            padding-right: 14px;
            font-weight: 600;
            color: #1e293b;
            white-space: normal;
            overflow-wrap: break-word;
        }
        .data-table td:last-child { text-align: left; padding-left: 14px; white-space: nowrap; }
        .data-table td:nth-child(2),
        .data-table td:nth-child(3),
        .data-table td:nth-child(4),
        .data-table td:nth-child(5) { text-align: center; white-space: nowrap; }
        tbody tr:nth-child(odd) { background-color: #fafcfd; }
        tbody tr:nth-child(even) { background-color: #ffffff; }
        tbody tr:hover { background-color: #f0fdfa !important; }

        .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
        .cell-warn-highlight {
            background-color: var(--warning-bg) !important;
            border-left: 4px solid var(--warning-border) !important;
            font-weight: 700;
        }
        .cell-over-limit {
            color: #dc2626 !important;
            font-weight: 700;
        }
        .cell-duplicate {
            background-color: var(--duplicate-bg) !important;
            border-left: 4px solid var(--duplicate-border) !important;
        }
        .duplicate-name { font-size: 0.7em; color: #1e40af; display: block; font-weight: 400; }
        .duplicate-id { font-weight: 700; font-size: 1.1em; }
        .delivery-pill {
            display: inline-block;
            border: 0.12em solid var(--pill-border);
            border-radius: 0.8em;
            padding: 0.1em 0.5em;
            background-color: var(--pill-bg);
            color: var(--pill-text);
            font-weight: 600;
            font-size: inherit;
            line-height: 1.3;
            vertical-align: middle;
        }
        .empty-state td { text-align: center !important; color: #94a3b8; padding: 40px 10px !important; font-size: 0.85rem; }

        .legend-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.75rem;
            color: #475569;
            padding: 10px 0 4px;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
        }

        .btn-share { background: #f0fdfa; border: 1.5px solid #99f6e4; color: #0f766e; }
        .btn-share:hover { background: #e6fffa; border-color: #5eead4; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15,23,42,0.45);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: white;
            border-radius: var(--radius-xl);
            padding: 22px 20px;
            width: 620px;
            max-width: 93vw;
            max-height: 85vh;
            overflow: auto;
            box-shadow: var(--shadow-lg);
        }
        .modal-box textarea { width: 100%; padding: 12px; border-radius: var(--radius-md); border: 2px solid #d1d5db; font-family: monospace; font-size: 0.72rem; resize: vertical; background: #fafbfc; }
        .modal-box textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.08); }
        .modal-meta { font-size: 0.7rem; color: #64748b; display: flex; justify-content: space-between; }
        .preview-table-wrap { max-height: 260px; overflow: auto; background: #f8fafc; border-radius: var(--radius-sm); padding: 8px; border: 1px solid #e2e8f0; }
        .mini-table { width: 100%; font-size: 0.68rem; border-collapse: collapse; background: white; }
        .mini-table th { padding: 5px 4px; background: #f1f5f9; text-align: center; border: 1px solid #e2e8f0; font-weight: 600; }
        .mini-table td { padding: 4px; text-align: center; border: 1px solid #f1f5f9; }
        .mini-table td:first-child { text-align: left; font-weight: 500; }
        .mini-table tr:nth-child(odd) { background: #fafcfd; }

        @media (max-width: 860px) {
            body { padding: 12px 10px 16px; }
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
            .global-header .app-title { font-size: 1.15rem; }
            .stat-tile { flex: 0 0 calc(33% - 8px); padding: 6px 4px; }
            .stat-tile .tile-value { font-size: 1.4rem; }
            .table-container { max-height: calc(100vh - 220px); }
            .table-header-fixed th,
            .data-table td { font-size: 0.55rem; padding: 5px 2px; }
            .table-header-fixed th { font-size: 0.5rem; }
            .data-table { min-width: 100% !important; }
            .btn { padding: 8px 14px; font-size: 0.72rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .action-bar>* { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .stat-tile { flex: 0 0 calc(50% - 6px); }
            .stat-tile .tile-value { font-size: 1.2rem; }
            .global-header { padding: 12px 14px; }
            .global-header .app-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header class="global-header">
        <span class="app-title"><span class="emoji">🛵</span>骑手单袋比 · 领用分析</span>
        <span class="version-pill">V9.12 重铸版</span>
        <div class="meta-info">
            <span id="metaOrders">单量: —</span>
            <span class="dot"></span>
            <span id="metaApply">申请: —</span>
        </div>
    </header>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-panel">
                <div class="panel-title" style="justify-content: space-between;">
                    <span style="display: flex; align-items: center; gap: 7px;">
                        <span class="icon-circle required">📦</span> 骑手单量 <span class="badge-required">必须</span>
                    </span>
                    <button class="btn btn-outline" id="btnClear" style="padding: 6px 14px; font-size: 0.7rem;">🗑️ 清空</button>
                </div>
                <div class="upload-zone" id="zoneOrders">
                    <input type="file" id="inputOrders" accept=".xlsx,.xls,.csv">
                    <span class="upload-icon">📎</span>
                    <span class="upload-label">上传「配送员履约明细表」</span>
                </div>
                <div id="chipOrders" class="status-chip idle">⏳ 等待上传</div>
            </div>
            <div class="sidebar-panel">
                <div class="panel-title"><span class="icon-circle required">📋</span> 当月申请数量 <span class="badge-required">必须</span></div>
                <div class="upload-zone" id="zoneApply">
                    <input type="file" id="inputApply" accept=".xlsx,.xls,.csv">
                    <span class="upload-icon">📎</span>
                    <span class="upload-label">上传「骑手单袋比明细」</span>
                </div>
                <div id="chipApply" class="status-chip idle">⏳ 等待上传</div>
                <div class="select-row"><select id="selectRange" disabled><option>请先上传申请表格</option></select></div>
                <div id="warnRange" class="warn-text">⚠️ 统计范围不匹配</div>
                <div id="infoRange" class="info-text"></div>
            </div>
            <div class="sidebar-panel">
                <div class="panel-title"><span class="icon-circle optional">📝</span> 当日申请数据 <span class="badge-optional">可选</span></div>
                <button class="btn-paste" id="btnPaste">📋 粘贴数据（每组11行）</button>
                <label class="checkbox-row"><input type="checkbox" id="chkExcludeRejected" checked>🚫 剔除审批「拒绝」的记录</label>
                <div id="chipToday" class="status-chip idle">⚪ 尚未粘贴</div>
                <div id="rejectNote" class="warn-text"></div>
            </div>
        </aside>

        <main class="main-area">
            <div class="action-bar">
                <div class="param-inline"><label for="inputPeak">单袋比系数</label><input type="number" id="inputPeak" value="1.2" step="0.1" min="0"></div>
                <button class="btn btn-primary" id="btnRun" disabled>🚀 生成报表</button>
                <button class="btn btn-share" id="btnShare">📄 分享报告</button>
                <span class="hint-text" id="hintStatus" style="margin-left:auto;">请先完成数据上传</span>
            </div>
            <div class="stats-strip" id="statsStrip" style="display:none;">
                <div class="stat-tile accent-tile"><div class="tile-label">📦 总需补袋数</div><div class="tile-value green" id="valTotalNeed">0</div></div>
                <div class="stat-tile"><div class="tile-label">⚠️ 总超标袋数</div><div class="tile-value red" id="valTotalOver">0</div></div>
                <div class="stat-tile"><div class="tile-label">👥 需补骑手</div><div class="tile-value teal" id="valNeedRiders">0</div></div>
                <div class="stat-tile"><div class="tile-label">🚨 超标骑手</div><div class="tile-value red" id="valOverRiders">0</div></div>
                <div class="stat-tile"><div class="tile-label">📈 当月单袋比</div><div class="tile-value teal" id="valHistRatio">0.00</div></div>
                <div class="stat-tile"><div class="tile-label">🔄 当前单袋比</div><div class="tile-value teal" id="valCurrRatio">0.00</div></div>
            </div>
            <div class="table-container">
                <table class="table-header-fixed">
                    <colgroup><col style="width:21%;"><col style="width:14%;"><col style="width:14%;"><col style="width:14%;"><col style="width:12%;"><col style="width:25%;"></colgroup>
                    <thead><tr>
                        <th data-sort-col="name">骑手</th><th data-sort-col="orders">总单量</th><th data-sort-col="history">当月申请</th>
                        <th data-sort-col="today">今日申请</th><th data-sort-col="ratio">单袋比</th><th data-sort-col="diff">差异</th>
                    </tr></thead>
                </table>
                <div class="table-scroll-body" id="tableScrollBody">
                    <table class="data-table">
                        <colgroup><col style="width:21%;"><col style="width:14%;"><col style="width:14%;"><col style="width:14%;"><col style="width:12%;"><col style="width:25%;"></colgroup>
                        <tbody id="tableBody"><tr class="empty-state"><td colspan="6">👆 请在左侧上传数据并选择正确的统计范围</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="legend-strip">
                <span class="legend-item"><span class="cell-warn-highlight" style="padding:2px 8px;">需补>50</span></span>
                <span class="legend-item"><span class="cell-over-limit">差量<0</span></span>
                <span class="legend-item"><span class="cell-duplicate" style="padding:2px 8px;">重名提醒</span></span>
                <span class="legend-item"><span class="delivery-pill">履约单量</span></span>
            </div>
        </main>
    </div>

    <script>
        (function() {
            const state = {
                deliveryMap: new Map(),
                applyRaw: [],
                applyRanges: new Set(),
                applyDates: new Set(),
                filteredApplyMap: new Map(),
                applyNamesSet: new Set(),
                todayMap: new Map(),
                todayStats: { total: 0, rejected: 0, valid: 0 },
                selectedRange: '',
                isRangeValid: false,
                finalRiders: [],
                sortColumn: 'diff',
                sortDirection: 'desc',
            };

            const $ = id => document.getElementById(id);
            const zoneOrders = $('zoneOrders'),
                inputOrders = $('inputOrders'),
                chipOrders = $('chipOrders');
            const zoneApply = $('zoneApply'),
                inputApply = $('inputApply'),
                chipApply = $('chipApply');
            const selectRange = $('selectRange'),
                warnRange = $('warnRange'),
                infoRange = $('infoRange');
            const btnPaste = $('btnPaste'),
                chkExcludeRejected = $('chkExcludeRejected'),
                chipToday = $('chipToday'),
                rejectNote = $('rejectNote');
            const inputPeak = $('inputPeak'),
                btnRun = $('btnRun'),
                btnClear = $('btnClear'),
                hintStatus = $('hintStatus');
            const metaOrders = $('metaOrders'),
                metaApply = $('metaApply');
            const statsStrip = $('statsStrip'),
                valTotalNeed = $('valTotalNeed'),
                valTotalOver = $('valTotalOver'),
                valNeedRiders = $('valNeedRiders'),
                valOverRiders = $('valOverRiders'),
                valHistRatio = $('valHistRatio'),
                valCurrRatio = $('valCurrRatio');
            const btnShare = $('btnShare'),
                tableBody = $('tableBody');
            const tableScrollBody = $('tableScrollBody');

            const getLatestDate = s => s?.size ? [...s].sort().pop() : '';
            const formatDate = d => d?.length === 8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : d;
            const expectedRange = d => d?.length === 8 ? `${d.slice(0,4)}${d.slice(4,6)}01~${d}` : '';
            const escapeHtml = str => { const d = document.createElement('div');
                d.textContent = str; return d.innerHTML; };

            function filterApplyByRange(range) {
                state.filteredApplyMap.clear();
                state.applyNamesSet.clear();
                if (!range || !state.applyRaw.length) return;
                const exp = expectedRange(getLatestDate(state.applyDates));
                const map = new Map();
                state.applyRaw.forEach(r => {
                    if (r.range === range || r.range === exp) {
                        const key = `${r.id}||${r.name}`;
                        const existing = map.get(key);
                        if (existing) {
                            existing.o2oOrders += r.o2oOrders;
                            existing.applyQty += r.applyQty;
                        } else {
                            map.set(key, { id: r.id, name: r.name, o2oOrders: r.o2oOrders, applyQty: r
                                    .applyQty });
                        }
                    }
                });
                state.filteredApplyMap = map;
                state.applyNamesSet = new Set([...map.values()].map(v => v.name));
            }

            function updateRangeSelect() {
                if (!state.applyRanges.size) {
                    selectRange.disabled = true;
                    selectRange.innerHTML = '<option>请先上传申请表格</option>';
                    state.isRangeValid = false;
                    warnRange.classList.remove('visible');
                    infoRange.classList.remove('visible');
                    return;
                }
                selectRange.disabled = false;
                const exp = expectedRange(getLatestDate(state.applyDates));
                let html = '',
                    hasValid = false;
                [...state.applyRanges].sort().forEach(r => {
                    const ok = r === exp;
                    if (ok) hasValid = true;
                    html +=
                        `<option value="${escapeHtml(r)}" ${ok?'selected':''}>${escapeHtml(r)} ${ok?'✓ 有效':'✗ 无效'}</option>`;
                });
                selectRange.innerHTML = html;
                if (hasValid) {
                    state.selectedRange = exp;
                    state.isRangeValid = true;
                    warnRange.classList.remove('visible');
                    infoRange.classList.add('visible');
                    infoRange.innerHTML =
                        `✅ 有效统计范围: ${escapeHtml(exp)}<br>最新日期: ${escapeHtml(formatDate(getLatestDate(state.applyDates)))}`;
                    filterApplyByRange(exp);
                } else {
                    state.selectedRange = selectRange.value;
                    state.isRangeValid = false;
                    warnRange.classList.add('visible');
                    warnRange.textContent = `⚠️ 统计范围不匹配！期望: ${exp}`;
                    infoRange.classList.remove('visible');
                    state.filteredApplyMap.clear();
                }
                refreshAllChips();
            }

            function refreshAllChips() {
                if (state.deliveryMap.size) {
                    const t = [...state.deliveryMap.values()].reduce((a, b) => a + b, 0);
                    chipOrders.className = 'status-chip success';
                    chipOrders.textContent = `✅ 已加载 ${state.deliveryMap.size} 人 · 总单量 ${t.toFixed(0)}`;
                    metaOrders.textContent = `单量: ${state.deliveryMap.size}人 / ${t.toFixed(0)}单`;
                } else {
                    chipOrders.className = 'status-chip idle';
                    chipOrders.textContent = '⏳ 等待上传';
                    metaOrders.textContent = '单量: —';
                }
                if (state.filteredApplyMap.size && state.isRangeValid) {
                    const t = [...state.filteredApplyMap.values()].reduce((a, b) => a + b.applyQty, 0);
                    chipApply.className = 'status-chip success';
                    chipApply.textContent = `✅ 当月申请总数 ${t.toFixed(0)} · ${state.filteredApplyMap.size}人`;
                    metaApply.textContent = `申请: ${state.filteredApplyMap.size}人 / ${t.toFixed(0)}件`;
                } else if (!state.applyRanges.size) {
                    chipApply.className = 'status-chip idle';
                    chipApply.textContent = '⏳ 等待上传';
                    metaApply.textContent = '申请: —';
                } else {
                    chipApply.className = 'status-chip warning';
                    chipApply.textContent = '⚠️ 范围无效，请检查';
                    metaApply.textContent = '申请: —';
                }
                if (state.todayMap.size) {
                    let txt =
                        `✅ 当日申请 ${state.todayMap.size}人 · 总数 ${[...state.todayMap.values()].reduce((a,b)=>a+b.qty,0).toFixed(0)}`;
                    if (chkExcludeRejected.checked && state.todayStats.rejected) txt +=
                        ` (已剔除拒绝 ${state.todayStats.rejected})`;
                    chipToday.className = 'status-chip success';
                    chipToday.textContent = txt;
                    if (chkExcludeRejected.checked && state.todayStats.rejected) {
                        rejectNote.classList.add('visible');
                        rejectNote.textContent = `🚫 已剔除 ${state.todayStats.rejected} 条拒绝记录`;
                    } else rejectNote.classList.remove('visible');
                } else {
                    chipToday.className = 'status-chip idle';
                    chipToday.textContent = '⚪ 尚未粘贴';
                    rejectNote.classList.remove('visible');
                }
                updateRunButton();
            }

            function updateRunButton() {
                const ok = state.filteredApplyMap.size && state.isRangeValid;
                btnRun.disabled = !ok;
                hintStatus.textContent = !ok ? (state.filteredApplyMap.size ? '⚠️ 请选择正确的统计范围' :
                    '⏳ 请先完成数据上传') : '✅ 数据就绪';
            }

            function parseDeliveryFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        if (rows.length < 2) reject(new Error('至少两行数据'));
                        const h = rows[1].map(c => String(c || '').trim());
                        let ni = -1,
                            qi = -1;
                        h.forEach((c, i) => { if (c === '配送员名字') ni = i; if (c === '总签收单量') qi = i; });
                        if (ni === -1 || qi === -1) reject(new Error('缺少"配送员名字"或"总签收单量"列'));
                        const map = new Map();
                        for (let i = 2; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r) continue;
                            const n = String(r[ni] || '').trim();
                            if (!n) continue;
                            map.set(n, (map.get(n) || 0) + (parseFloat(r[qi]) || 0));
                        }
                        resolve(map);
                    };
                    reader.onerror = () => reject(new Error('读取失败'));
                    reader.readAsArrayBuffer(file);
                });
            }

            function parseApplyFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                        if (!rows.length) reject(new Error('空表格'));
                        const h = rows[0].map(c => String(c || '').trim());
                        let di = -1,
                            ri = -1,
                            idi = -1,
                            ni = -1,
                            qi = -1,
                            oi = -1;
                        h.forEach((c, i) => {
                            if (c === '统计日期') di = i;
                            if (c === '统计范围') ri = i;
                            if (c === '骑手id') idi = i;
                            if (c === '骑手姓名') ni = i;
                            if (c === '确认申领商品数量') qi = i;
                            if (c === 'o2o签收单量') oi = i;
                        });
                        if (ni === -1 || qi === -1 || idi === -1 || oi === -1)
                            reject(new Error('缺少必要列(骑手id/骑手姓名/确认申领商品数量/o2o签收单量)'));
                        const ranges = new Set(),
                            dates = new Set(),
                            raw = [];
                        for (let i = 1; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r) continue;
                            const id = String(r[idi] || '').trim();
                            const name = String(r[ni] || '').trim();
                            if (!name) continue;
                            const qty = parseFloat(r[qi]) || 0;
                            const o2o = parseFloat(r[oi]) || 0;
                            const range = ri !== -1 && r[ri] ? String(r[ri]).trim() : '';
                            const date = di !== -1 && r[di] ? String(r[di]).trim() : '';
                            raw.push({ id, name, o2oOrders: o2o, applyQty: qty, range, date });
                            if (range) ranges.add(range);
                            if (date) dates.add(date);
                        }
                        resolve({ raw, ranges, dates });
                    };
                    reader.onerror = () => reject(new Error('读取失败'));
                    reader.readAsArrayBuffer(file);
                });
            }

            function parseDailyPaste(text, exclude) {
                const lines = text.split(/\r?\n/).filter(l => l.trim());
                const map = new Map();
                let total = 0,
                    rej = 0,
                    valid = 0;
                const details = [];
                
                // 查找包含"配送"和"袋"的行作为中心点（第6行，索引5）
                const centers = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.includes('配送') && line.includes('袋')) {
                        centers.push(i);
                    }
                }
                
                for (const centerIdx of centers) {
                    // 中心点前5行 + 中心行 + 后5行 = 11行
                    const startIdx = centerIdx - 5;
                    const endIdx = centerIdx + 5;
                    
                    // 检查是否有足够的行数（前后各5行）
                    if (startIdx < 0 || endIdx >= lines.length) continue;
                    
                    total++;
                    const g = lines.slice(startIdx, endIdx + 1);
                    
                    // 解析数据：第3行=工号(索引2) / 第4行=姓名(索引3) / 第7行=数量(索引6) / 第8行=状态(索引7)
                    const id = g[2]?.trim() || '';
                    const name = g[3]?.trim() || '';
                    const qty = parseFloat(g[6]);
                    const status = g[7]?.trim() || '';
                    
                    if (exclude && status === '拒绝') {
                        rej++;
                        details.push({ id, name, qty, status, valid: false });
                        continue;
                    }
                    if (name && !isNaN(qty) && qty > 0) {
                        const key = `${id}||${name}`;
                        const entry = map.get(key);
                        if (entry) entry.qty += qty;
                        else map.set(key, { id, name, qty });
                        valid++;
                        details.push({ id, name, qty, status, valid: true });
                    }
                }
                return { map, total, rejected: rej, valid, details };
            }

            function buildFinalRiders() {
                const finalMap = new Map();
                for (const [key, val] of state.filteredApplyMap) {
                    finalMap.set(key, {
                        key,
                        id: val.id,
                        name: val.name,
                        totalOrders: val.o2oOrders,
                        historyApply: val.applyQty,
                        todayApply: 0,
                        source: 'apply',
                    });
                }
                for (const [key, val] of state.todayMap) {
                    const rider = finalMap.get(key);
                    if (rider) {
                        rider.todayApply = val.qty;
                    } else {
                        const name = val.name;
                        const inApplyNames = state.applyNamesSet.has(name);
                        let totalOrders = 0;
                        if (!inApplyNames && state.deliveryMap.has(name)) {
                            totalOrders = state.deliveryMap.get(name);
                        }
                        finalMap.set(key, {
                            key,
                            id: val.id,
                            name,
                            totalOrders,
                            historyApply: 0,
                            todayApply: val.qty,
                            source: totalOrders > 0 ? 'delivery' : 'today',
                        });
                    }
                }
                const existingNames = new Set([...finalMap.values()].map(r => r.name));
                for (const [name, orders] of state.deliveryMap) {
                    if (!state.applyNamesSet.has(name) && !existingNames.has(name)) {
                        const key = `||${name}`;
                        finalMap.set(key, {
                            key,
                            id: '',
                            name,
                            totalOrders: orders,
                            historyApply: 0,
                            todayApply: 0,
                            source: 'delivery',
                        });
                        existingNames.add(name);
                    }
                }
                const nameCount = new Map();
                for (const rider of finalMap.values()) {
                    nameCount.set(rider.name, (nameCount.get(rider.name) || 0) + 1);
                }
                for (const rider of finalMap.values()) {
                    rider.duplicate = nameCount.get(rider.name) > 1;
                }
                state.finalRiders = [...finalMap.values()];
            }

            function sortTableData(data, col, dir) {
                return [...data].sort((a, b) => {
                    if (col === 'name') return dir === 'asc' ? a.name.localeCompare(b.name, 'zh') : b.name
                        .localeCompare(a.name, 'zh');
                    const av = a[col] || 0,
                        bv = b[col] || 0;
                    return dir === 'asc' ? av - bv : bv - av;
                });
            }

            function syncColumnWidths() {
                const headerTable = document.querySelector('.table-header-fixed');
                const scrollBody = document.querySelector('.table-scroll-body');
                if (!headerTable || !scrollBody) return;
                headerTable.style.width = scrollBody.clientWidth + 'px';
            }

            function renderTable() {
                if (!state.isRangeValid) { alert('统计范围不匹配'); return; }
                buildFinalRiders();
                const p = parseFloat(inputPeak.value) || 1.2;
                let data = state.finalRiders.map(r => ({
                    key: r.key,
                    name: r.name,
                    id: r.id,
                    orders: r.totalOrders,
                    history: r.historyApply,
                    today: r.todayApply,
                    ratio: r.totalOrders ? (r.historyApply + r.todayApply) / r.totalOrders : 0,
                    diff: r.totalOrders * p - r.historyApply - r.todayApply,
                    duplicate: r.duplicate,
                    source: r.source,
                }));
                data = sortTableData(data, state.sortColumn, state.sortDirection);
                let html = '';
                data.forEach(r => {
                    const d = r.diff,
                        intDiff = d > 0 ? Math.floor(d) : Math.ceil(d);
                    const diffStr = intDiff > 0 ? `需补:${intDiff}` : (intDiff < 0 ? `超标:${Math.abs(intDiff)}` :
                        '0');
                    const cellClass = d < 0 ? 'cell-over-limit' : (intDiff > 50 ? 'cell-warn-highlight' : '');
                    const nameCellClass = r.duplicate ? ' cell-duplicate' : '';
                    const nameDisplay = r.duplicate ?
                        `<span class="duplicate-id">${escapeHtml(r.id)}</span><span class="duplicate-name">${escapeHtml(r.name)}</span>` :
                        escapeHtml(r.name);
                    const ordersContent = r.source === 'delivery' ?
                        `<span class="delivery-pill">${r.orders.toFixed(0)}</span>` :
                        r.orders.toFixed(0);
                    html +=
                        `<tr><td class="${nameCellClass}">${nameDisplay}</td><td class="mono">${ordersContent}</td><td class="mono">${r.history.toFixed(0)}</td><td class="mono">${r.today.toFixed(0)}</td><td class="mono">${r.orders?r.ratio.toFixed(2):'—'}</td><td class="mono ${cellClass}">${diffStr}</td></tr>`;
                });
                tableBody.innerHTML = html || '<tr class="empty-state"><td colspan="6">无数据</td></tr>';
                updateStatsCards(data);
                requestAnimationFrame(syncColumnWidths);
            }

            function updateStatsCards(data) {
                if (!data || !data.length) { statsStrip.style.display = 'none'; return; }
                let tn = 0,
                    to = 0,
                    nr = 0,
                    oR = 0,
                    so = 0,
                    sh = 0,
                    st = 0;
                data.forEach(r => {
                    so += r.orders;
                    sh += r.history;
                    st += r.today;
                    if (r.diff > 0) { tn += r.diff;
                        nr++; } else if (r.diff < 0) { to += Math.abs(r.diff);
                        oR++; }
                });
                valTotalNeed.textContent = Math.floor(tn);
                valTotalOver.textContent = Math.floor(to);
                valNeedRiders.textContent = nr;
                valOverRiders.textContent = oR;
                valHistRatio.textContent = (so ? sh / so : 0).toFixed(2);
                valCurrRatio.textContent = (so ? (sh + st) / so : 0).toFixed(2);
                statsStrip.style.display = 'flex';
            }

            function generateShareReport() {
                if (!state.finalRiders.length) { alert('请先生成报表'); return; }
                const now = new Date().toLocaleString('zh-CN', { hour12: false });
                const peakVal = (parseFloat(inputPeak.value) || 1.2).toFixed(2);
                const data = state.finalRiders.map(r => ({
                    ...r,
                    ratio: r.totalOrders ? (r.historyApply + r.todayApply) / r.totalOrders : 0,
                    diff: r.totalOrders * parseFloat(peakVal) - r.historyApply - r.todayApply,
                }));
                const sorted = [...data].sort((a, b) => b.diff - a.diff);
                let rowsHtml = '';
                sorted.forEach(r => {
                    const d = r.diff,
                        intDiff = d > 0 ? Math.floor(d) : Math.ceil(d);
                    const diffStr = intDiff > 0 ? `需补:${intDiff}` : (intDiff < 0 ? `超标:${Math.abs(intDiff)}` :
                        '0');
                    const nameCellStyle = r.duplicate ?
                        ' style="background-color:#eff6ff;border-left:4px solid #3b82f6;"' : '';
                    const nameDisplay = r.duplicate ?
                        `<span style="font-weight:700;">${escapeHtml(r.id)}</span><br><span style="font-size:0.7em;color:#1e40af;">${escapeHtml(r.name)}</span>` :
                        escapeHtml(r.name);
                    const ordersContent = r.source === 'delivery' ?
                        `<span style="display:inline-block;border:0.12em solid #b91c1c;border-radius:0.8em;padding:0.1em 0.5em;background-color:#dc2626;color:white;font-weight:600;font-size:inherit;line-height:1.3;">${r.totalOrders.toFixed(0)}</span>` :
                        r.totalOrders.toFixed(0);
                    rowsHtml +=
                        `<tr><td${nameCellStyle}>${nameDisplay}</td><td class="mono">${ordersContent}</td><td class="mono">${r.historyApply.toFixed(0)}</td><td class="mono">${r.todayApply.toFixed(0)}</td><td class="mono">${r.totalOrders?r.ratio.toFixed(2):'—'}</td><td class="mono ${d<0?'cell-over-limit':(intDiff>50?'cell-warn-highlight':'')}">${diffStr}</td></tr>`;
                });
                const reportHtml = `<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>单袋比领用报告</title><style>:root{--bg:#f9fafb;--surface:#fff;--text:#1e293b;--text-secondary:#64748b;--accent:#0d9488;--border:#e2e8f0;--warning-bg:#fff7ed;--warning-border:#fdba74;--danger-text:#dc2626;--duplicate-bg:#eff6ff;--duplicate-border:#3b82f6;--pill-bg:#dc2626;--pill-border:#b91c1c;--pill-text:#ffffff;--shadow-md:0 4px 16px rgba(0,0,0,0.06);--radius-lg:20px;--radius-md:14px;}*{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg);font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;height:100vh;padding:20px 16px 20px;overflow:hidden;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none!important;}.report-wrapper{max-width:1100px;width:100%;height:100%;display:flex;flex-direction:column;gap:14px;}.report-wrapper h2{font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:6px;}.meta-line{font-size:0.78rem;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}.stats-strip{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex-shrink:0;}.stat-tile{flex:0 0 calc(16.666% - 10px);min-width:70px;background:var(--surface);border-radius:var(--radius-md);padding:8px 4px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.04);border:1px solid var(--border);}.stat-tile .tile-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);}.stat-tile .tile-value{font-size:2rem;font-weight:700;font-family:'JetBrains Mono',monospace;}.tile-value.green{color:#059669;}.tile-value.red{color:#dc2626;}.tile-value.teal{color:#0d9488;}.table-container{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}.table-header-fixed{width:100%;table-layout:fixed;border-collapse:collapse;background:#f8fafc;border-bottom:2px solid #e2e8f0;flex-shrink:0;}.table-header-fixed th{font-weight:700;text-align:center;padding:11px 6px;font-size:0.75rem;white-space:nowrap;border-right:1px solid #e2e8f0;color:#475569;}.table-header-fixed th:last-child{border-right:none;}.table-header-fixed th:first-child{text-align:right;padding-right:14px;}.table-header-fixed th:last-child{text-align:left;padding-left:14px;}.table-scroll-body{overflow:auto;flex:1 1 auto;min-height:0;cursor:grab;user-select:none;-webkit-user-select:none;-ms-overflow-style:none;scrollbar-width:none;}.table-scroll-body::-webkit-scrollbar{display:none;}.table-scroll-body.grabbing{cursor:grabbing;}.data-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:0.8rem;min-width:700px;}.data-table td{padding:9px 6px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f1f5f9;vertical-align:middle;}.data-table td:last-child{border-right:none;}.data-table td:first-child{text-align:right;padding-right:14px;font-weight:600;white-space:normal;overflow-wrap:break-word;}.data-table td:last-child{text-align:left;padding-left:14px;white-space:nowrap;}.data-table td:nth-child(2),.data-table td:nth-child(3),.data-table td:nth-child(4),.data-table td:nth-child(5){text-align:center;white-space:nowrap;}tbody tr:nth-child(odd){background:#fafcfd;}tbody tr:nth-child(even){background:#fff;}.mono{font-family:'JetBrains Mono',monospace;font-weight:500;}.cell-warn-highlight{background-color:#fff7ed!important;border-left:4px solid #fdba74!important;font-weight:700;}.cell-over-limit{color:#dc2626!important;font-weight:700;}.cell-duplicate{background-color:#eff6ff!important;border-left:4px solid #3b82f6!important;}.delivery-pill{display:inline-block;border:0.12em solid #b91c1c;border-radius:0.8em;padding:0.1em 0.5em;background-color:#dc2626;color:white;font-weight:600;font-size:inherit;line-height:1.3;vertical-align:middle;}.legend-strip{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:24px;font-size:0.75rem;color:#475569;padding:10px 0 4px;flex-shrink:0;}.legend-item{display:inline-flex;align-items:center;}@media(max-width:768px){.stat-tile{flex:0 0 calc(25% - 10px);}.stat-tile .tile-value{font-size:1.4rem;}.table-header-fixed th,.data-table td{font-size:0.62rem;padding:5px 2px;}.data-table{min-width:100%!important;}}@media(max-width:480px){.stat-tile{flex:0 0 calc(50% - 8px);}.stat-tile .tile-value{font-size:1.2rem;}}</style></head><body><div class="report-wrapper"><h2>🛵 骑手单袋比领用报告</h2><div class="meta-line"><span>生成时间：<strong>${now}</strong></span><span>单袋比系数：<strong>${peakVal}</strong></span></div><div class="stats-strip"><div class="stat-tile"><div class="tile-label">📦 总需补袋数</div><div class="tile-value green">${valTotalNeed.textContent}</div></div><div class="stat-tile"><div class="tile-label">⚠️ 总超标袋数</div><div class="tile-value red">${valTotalOver.textContent}</div></div><div class="stat-tile"><div class="tile-label">👥 需补骑手</div><div class="tile-value teal">${valNeedRiders.textContent}</div></div><div class="stat-tile"><div class="tile-label">🚨 超标骑手</div><div class="tile-value red">${valOverRiders.textContent}</div></div><div class="stat-tile"><div class="tile-label">📈 当月单袋比</div><div class="tile-value teal">${valHistRatio.textContent}</div></div><div class="stat-tile"><div class="tile-label">🔄 当前单袋比</div><div class="tile-value teal">${valCurrRatio.textContent}</div></div></div><div class="table-container"><table class="table-header-fixed"><colgroup><col style="width:21%;"><col style="width:14%;"><col style="width:14%;"><col style="width:14%;"><col style="width:12%;"><col style="width:25%;"></colgroup><thead><tr><th>骑手</th><th>总单量</th><th>当月申请</th><th>今日申请</th><th>单袋比</th><th>差异</th></tr></thead></table><div class="table-scroll-body" id="reportScrollBody"><table class="data-table"><colgroup><col style="width:21%;"><col style="width:14%;"><col style="width:14%;"><col style="width:14%;"><col style="width:12%;"><col style="width:25%;"></colgroup><tbody>${rowsHtml}</tbody></table></div></div><div class="legend-strip"><span class="legend-item"><span style="background-color:#fff7ed;border-left:4px solid #fdba74;padding:2px 8px;">需补>50</span></span><span class="legend-item"><span class="cell-over-limit">差量<0</span></span><span class="legend-item"><span style="background-color:#eff6ff;border-left:4px solid #3b82f6;padding:2px 8px;">重名提醒</span></span><span class="legend-item"><span class="delivery-pill">履约单量</span></span></div></div><script>document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());(function(){var el=document.getElementById('reportScrollBody');if(!el)return;var isDown=false,startX,startY,scrollLeft,scrollTop;el.addEventListener('mousedown',function(e){isDown=true;el.classList.add('grabbing');startX=e.pageX-el.offsetLeft;startY=e.pageY-el.offsetTop;scrollLeft=el.scrollLeft;scrollTop=el.scrollTop;});el.addEventListener('mouseleave',function(){isDown=false;el.classList.remove('grabbing');});el.addEventListener('mouseup',function(){isDown=false;el.classList.remove('grabbing');});el.addEventListener('mousemove',function(e){if(!isDown)return;e.preventDefault();var x=e.pageX-el.offsetLeft;var y=e.pageY-el.offsetTop;var walkX=(x-startX)*1.5;var walkY=(y-startY)*1.5;el.scrollLeft=scrollLeft-walkX;el.scrollTop=scrollTop-walkY;});})();<\/script></body></html>`;
                const blob = new Blob([reportHtml], { type: 'text/html' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `单袋比报告-${new Date().toISOString().slice(0,10)}.html`;
                a.click();
            }

            // 表格拖拽滚动功能
            function initDragScroll(el) {
                if (!el) return;
                let isDown = false,
                    startX, startY, scrollLeft, scrollTop;
                el.addEventListener('mousedown', function(e) {
                    isDown = true;
                    el.classList.add('grabbing');
                    startX = e.pageX - el.offsetLeft;
                    startY = e.pageY - el.offsetTop;
                    scrollLeft = el.scrollLeft;
                    scrollTop = el.scrollTop;
                });
                el.addEventListener('mouseleave', function() {
                    isDown = false;
                    el.classList.remove('grabbing');
                });
                el.addEventListener('mouseup', function() {
                    isDown = false;
                    el.classList.remove('grabbing');
                });
                el.addEventListener('mousemove', function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - el.offsetLeft;
                    const y = e.pageY - el.offsetTop;
                    const walkX = (x - startX) * 1.5;
                    const walkY = (y - startY) * 1.5;
                    el.scrollLeft = scrollLeft - walkX;
                    el.scrollTop = scrollTop - walkY;
                });
            }

            // 初始化主表格拖拽滚动
            initDragScroll(tableScrollBody);

            inputOrders.addEventListener('change', async e => {
                const f = e.target.files[0];
                if (!f) return;
                try { state.deliveryMap = await parseDeliveryFile(f);
                    refreshAllChips(); if (state.finalRiders.length) renderTable(); } catch (er) { alert(er
                        .message); }
                inputOrders.value = '';
            });
            inputApply.addEventListener('change', async e => {
                const f = e.target.files[0];
                if (!f) return;
                try {
                    const res = await parseApplyFile(f);
                    state.applyRaw = res.raw;
                    state.applyRanges = res.ranges;
                    state.applyDates = res.dates;
                    updateRangeSelect();
                    refreshAllChips();
                    if (state.finalRiders.length) renderTable();
                } catch (er) { alert(er.message); }
                inputApply.value = '';
            });
            zoneOrders.addEventListener('click', () => inputOrders.click());
            zoneApply.addEventListener('click', () => inputApply.click());
            selectRange.addEventListener('change', () => {
                const sel = selectRange.value,
                    exp = expectedRange(getLatestDate(state.applyDates));
                state.selectedRange = sel;
                state.isRangeValid = sel === exp;
                if (state.isRangeValid) {
                    warnRange.classList.remove('visible');
                    infoRange.classList.add('visible');
                    infoRange.innerHTML =
                        `✅ 有效统计范围: ${escapeHtml(exp)}<br>最新日期: ${escapeHtml(formatDate(getLatestDate(state.applyDates)))}`;
                    filterApplyByRange(sel);
                } else {
                    warnRange.classList.add('visible');
                    infoRange.classList.remove('visible');
                    state.filteredApplyMap.clear();
                }
                refreshAllChips();
                if (state.isRangeValid && state.finalRiders.length) renderTable();
                else {
                    tableBody.innerHTML =
                        '<tr class="empty-state"><td colspan="6">⚠️ 请选择正确的统计范围</td></tr>';
                    statsStrip.style.display = 'none';
                    state.finalRiders = [];
                }
            });
            btnPaste.addEventListener('click', () => {
                document.querySelector('.modal-overlay')?.remove();
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML =
                    `<div class="modal-box"><h3>粘贴当日申请数据</h3><p style="font-size:0.7rem;">自动查找包含"配送&袋"的行作为中心，上下各5行组成11行一组进行解析<br>第3行=工号 / 第4行=姓名 / 第7行=数量 / 第8行=状态（不足11行的组将自动剔除）</p><textarea id="pasteTextarea" rows="10"></textarea><div class="modal-meta"><span>📊 <strong id="modalLineCount">0</strong>行 / <strong id="modalGroupCount">0</strong>组</span></div><label class="checkbox-row"><input type="checkbox" id="modalExcludeChk" ${chkExcludeRejected.checked?'checked':''}>剔除拒绝</label><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;"><button class="btn btn-ghost" id="modalCancel">取消</button><button class="btn btn-outline" id="modalPreview">预览</button><button class="btn btn-primary" id="modalConfirm">导入</button></div><div id="modalPreviewArea" style="display:none;margin-top:8px;"><div class="preview-table-wrap" id="modalPreviewContent"></div></div></div>`;
                document.body.appendChild(overlay);
                const ta = document.getElementById('pasteTextarea'),
                    lc = document.getElementById('modalLineCount'),
                    gc = document.getElementById('modalGroupCount');
                const chk = document.getElementById('modalExcludeChk'),
                    prevArea = document.getElementById('modalPreviewArea'),
                    prevContent = document.getElementById('modalPreviewContent');
                let parsed = null;
                const upd = () => { const l = ta.value.split(/\r?\n/).filter(l => l.trim());
                    lc.textContent = l.length;
                    gc.textContent = Math.floor(l.length / 11); };
                ta.addEventListener('input', upd);
                ta.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    if (!pastedText) return;
                    const start = ta.selectionStart;
                    const end = ta.selectionEnd;
                    const currentText = ta.value;
                    ta.value = currentText.slice(0, start) + pastedText + currentText.slice(end);
                    if (!pastedText.endsWith('\n')) {
                        ta.value += '\n';
                    }
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                    ta.dispatchEvent(new Event('input', { bubbles: true }));
                });
                upd();
                document.getElementById('modalCancel').onclick = () => overlay.remove();
                document.getElementById('modalPreview').onclick = () => {
                    parsed = parseDailyPaste(ta.value, chk.checked);
                    const { total, rejected, valid, details } = parsed;
                    let html =
                        `<div style="font-size:0.7rem;">📊 总组数:${total} | 有效:${valid}`;
                    if (chk.checked && rejected) html +=
                        ` | <span style="color:#dc2626;">已剔除拒绝:${rejected}</span>`;
                    html +=
                        '</div><table class="mini-table"><thead><tr><th>工号</th><th>姓名</th><th>数量</th><th>状态</th></tr></thead><tbody>';
                    const vd = details.filter(d => d.valid);
                    if (!vd.length) html += '<tr><td colspan="4">暂无有效数据</td></tr>';
                    else {
                        const sm = new Map();
                        vd.forEach(d => sm.set(`${d.id}||${d.name}`, (sm.get(`${d.id}||${d.name}`) || 0) + (d
                            .qty || 0)));
                        let tq = 0;
                        [...sm.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([key, q]) => {
                            const [id, name] = key.split('||');
                            html +=
                                `<tr><td>${escapeHtml(id)}</td><td>${escapeHtml(name)}</td><td class="mono">${q}</td><td>有效</td></tr>`;
                            tq += q;
                        });
                        html +=
                            `<tr><td colspan="2"><strong>合计</strong></td><td class="mono"><strong>${tq}</strong></td><td></td></tr>`;
                    }
                    if (chk.checked && rejected) {
                        const rd = details.filter(d => !d.valid);
                        if (rd.length) {
                            html +=
                                '<tr><td colspan="4" style="color:#dc2626;">已剔除的拒绝记录:</td></tr>';
                            rd.forEach(d => { html +=
                                    `<tr style="color:#94a3b8;"><td>${escapeHtml(d.id||'—')}</td><td>${escapeHtml(d.name||'—')}</td><td>${d.qty||0}</td><td>拒绝</td></tr>`; });
                        }
                    }
                    html += '</tbody></table>';
                    prevContent.innerHTML = html;
                    prevArea.style.display = 'block';
                };
                document.getElementById('modalConfirm').onclick = () => {
                    if (!parsed) parsed = parseDailyPaste(ta.value, chk.checked);
                    if (!parsed.map.size) { alert('无有效数据'); return; }
                    state.todayMap = parsed.map;
                    state.todayStats = { total: parsed.total, rejected: parsed.rejected, valid: parsed.valid };
                    chkExcludeRejected.checked = chk.checked;
                    refreshAllChips();
                    if (state.finalRiders.length) renderTable();
                    overlay.remove();
                };
                overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            });
            btnRun.addEventListener('click', renderTable);
            btnClear.addEventListener('click', () => {
                state.deliveryMap.clear();
                state.applyRaw = [];
                state.applyRanges.clear();
                state.applyDates.clear();
                state.filteredApplyMap.clear();
                state.applyNamesSet.clear();
                state.todayMap.clear();
                state.todayStats = { total: 0, rejected: 0, valid: 0 };
                state.finalRiders = [];
                state.isRangeValid = false;
                selectRange.disabled = true;
                selectRange.innerHTML = '<option>请先上传申请表格</option>';
                tableBody.innerHTML =
                    '<tr class="empty-state"><td colspan="6">👆 请在左侧上传数据并选择正确的统计范围</td></tr>';
                statsStrip.style.display = 'none';
                refreshAllChips();
                inputPeak.value = '1.2';
                chkExcludeRejected.checked = true;
                chipOrders.className = 'status-chip idle';
                chipOrders.textContent = '⏳ 等待上传';
                chipApply.className = 'status-chip idle';
                chipApply.textContent = '⏳ 等待上传';
                chipToday.className = 'status-chip idle';
                chipToday.textContent = '⚪ 尚未粘贴';
                metaOrders.textContent = '单量: —';
                metaApply.textContent = '申请: —';
                hintStatus.textContent = '请先完成数据上传';
            });
            document.querySelectorAll('.table-header-fixed th[data-sort-col]').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.dataset.sortCol;
                    if (!col) return;
                    if (state.sortColumn === col) state.sortDirection = state.sortDirection === 'asc' ?
                        'desc' : 'asc';
                    else { state.sortColumn = col;
                        state.sortDirection = 'desc'; }
                    if (state.finalRiders.length) renderTable();
                });
            });
            btnShare.addEventListener('click', generateShareReport);
            window.addEventListener('resize', () => { if (state.finalRiders.length) requestAnimationFrame(
                    syncColumnWidths); });
            inputPeak.value = '1.2';
            chkExcludeRejected.checked = true;
            selectRange.disabled = true;
            refreshAllChips();
            hintStatus.textContent = '请先完成数据上传';
        })();
    </script>
</body>
</html>
