<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Excel通讯录转换 · 电脑手机通用</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Microsoft YaHei', sans-serif; background: linear-gradient(145deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px 8px; }
        .container { max-width: 1600px; margin: 0 auto; background: #ffffff; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%); color: white; padding: 24px 30px 20px; text-align: center; }
        .header h1 { font-size: 40px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header .subtitle { font-size: 22px; opacity: 0.95; margin-bottom: 16px; }
        .features { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; }
        .feature-item { display: flex; align-items: center; gap: 6px; font-size: 18px; background: rgba(255,255,255,0.15); padding: 6px 18px; border-radius: 24px; white-space: nowrap; }
        .content { padding: 16px; }
        .top-three-panels { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .panel { background: #f8f9fa; border-radius: 14px; padding: 14px; border: 1px solid #e9ecef; }
        .panel-upload { flex: 1.56; min-width: 260px; }
        .panel-files { flex: 0.54; min-width: 150px; }
        .panel-mapping { flex: 1; min-width: 300px; }
        .panel-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .panel-title .badge { background: #4a90e2; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
        .upload-area { border: 2px dashed #ccc; border-radius: 16px; padding: 18px 14px; text-align: center; background: white; }
        .upload-icon { font-size: 48px; margin-bottom: 8px; }
        .upload-text { font-size: 18px; color: #555; margin-bottom: 4px; font-weight: 500; }
        .upload-hint { font-size: 14px; color: #999; margin-bottom: 16px; }
        .upload-buttons { display: flex; gap: 12px; justify-content: center; }
        .file-count { color: #4a90e2; font-weight: 600; font-size: 13px; }
        .file-items-container { max-height: 250px; overflow-y: auto; overflow-x: hidden; border: 1px solid #e9ecef; border-radius: 8px; background: white; -webkit-overflow-scrolling: touch; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: white; border-bottom: 1px solid #f0f0f0; }
        .file-item:last-child { border-bottom: none; }
        .file-name { color: #333; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .file-remove { color: #dc3545; font-size: 14px; padding: 2px 4px; cursor: pointer; flex-shrink: 0; margin-left: 6px; transition: color 0.2s; }
        .file-remove:hover { color: #a71d2a; }
        .empty-files-msg { text-align: center; padding: 20px 8px; color: #999; font-size: 12px; background: white; border-radius: 8px; border: 1px solid #e9ecef; }
        .mapping-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .mapping-item { display: flex; align-items: center; gap: 6px; }
        .mapping-item label { font-weight: 500; color: #555; font-size: 14px; }
        .mapping-item input { width: 56px; padding: 6px 4px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-transform: uppercase; text-align: center; font-weight: 500; -webkit-appearance: none; transition: border-color 0.2s; }
        .mapping-item input:focus { outline: none; border-color: #4a90e2; }
        .default-hint-left { color: #888; font-size: 12px; margin-bottom: 4px; }
        .divider { border-top: 1px solid #e9ecef; margin: 10px 0; }
        .checkbox-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .checkbox-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .chip-checkbox { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #f0f4f8; border-radius: 30px; cursor: pointer; transition: all 0.2s; border: 1.5px solid transparent; font-size: 14px; font-weight: 500; color: #555; user-select: none; }
        .chip-checkbox:hover { background: #e4ecf5; }
        .chip-checkbox input { display: none; }
        .chip-checkbox .check-icon { width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; background: white; }
        .chip-checkbox input:checked + .check-icon { background: #4a90e2; border-color: #4a90e2; }
        .chip-checkbox input:checked + .check-icon::after { content: "✓"; color: white; font-size: 13px; font-weight: bold; }
        .chip-checkbox input:checked ~ span:last-child { color: #4a90e2; }
        .separator-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; background: transparent; border-radius: 8px; }
        .separator-ghost label { font-size: 14px; font-weight: 500; color: #666; }
        .separator-ghost input { width: 55px; padding: 6px 4px; border: none; border-bottom: 2px solid #ddd; font-size: 14px; text-align: center; background: transparent; transition: border-color 0.2s; }
        .separator-ghost input:focus { outline: none; border-bottom-color: #4a90e2; }
        .btn { padding: 10px 18px; border: none; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; -webkit-appearance: none; touch-action: manipulation; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%); color: white; box-shadow: 0 2px 6px rgba(74,144,226,0.3); }
        .btn-primary:disabled { background: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-success { background: linear-gradient(135deg, #28a745 0%, #20a038 100%); color: white; box-shadow: 0 2px 6px rgba(40,167,69,0.3); }
        .btn-success:disabled { background: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-outline { background: white; color: #555; border: 1px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn-small { padding: 6px 10px; font-size: 12px; }
        .btn-folder { background: white; color: #4a90e2; border: 1px solid #4a90e2; }
        .btn-folder:hover { background: #f0f7ff; }
        .btn-block { width: 100%; }
        .preview-section { margin-top: 10px; }
        .preview-header { display: flex; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 12px; }
        .preview-title { font-size: 16px; font-weight: 600; color: #333; display: flex; align-items: center; }
        .preview-stats-center { padding: 6px 12px; font-size: 15px; color: #4a90e2; flex: 1; text-align: center; min-width: 200px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .table-container { max-height: 350px; overflow: auto; border: 1px solid #e9ecef; border-radius: 10px; background: white; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }
        th { background: #f8f9fa; padding: 10px 5px; text-align: center; font-weight: 600; color: #555; border-bottom: 2px solid #e9ecef; position: sticky; top: 0; z-index: 10; white-space: nowrap; font-size: 13px; }
        td { padding: 9px 5px; border-bottom: 1px solid #f0f0f0; color: #333; font-size: 13px; text-align: center; }
        .extra-col { display: none; }
        .empty-table-msg { text-align: center; padding: 30px; color: #999; font-size: 14px; }
        .status-bar { margin-top: 12px; padding: 8px 14px; background: #f8f9fa; border-radius: 24px; color: #666; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .loading { display: none; align-items: center; gap: 6px; margin-left: auto; }
        .loading.show { display: flex; }
        .spinner { width: 16px; height: 16px; border: 2px solid #e9ecef; border-top-color: #4a90e2; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 自定义确认弹窗 - 居中显示 */
        .confirm-dialog-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .confirm-dialog {
            background: white;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s;
        }
        .confirm-dialog-icon { font-size: 48px; margin-bottom: 12px; }
        .confirm-dialog-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #333; }
        .confirm-dialog-message { font-size: 15px; color: #666; margin-bottom: 24px; }
        .confirm-dialog-buttons { display: flex; gap: 12px; justify-content: center; }
        .confirm-dialog-buttons .btn { min-width: 100px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* 更多映射弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 20px; padding: 24px; max-width: 750px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .field-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .field-row label { width: 70px; font-weight: 500; }
        .field-row select, .field-row input { padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
        .field-row select { flex: 1; }
        .field-row input { width: 90px; }

        @media (max-width: 768px) {
            .btn-folder, .feature-item:nth-child(3) { display: none !important; }
            .upload-buttons { justify-content: center; }
            .top-three-panels { flex-direction: column; gap: 10px; }
            .panel-upload, .panel-files, .panel-mapping { min-width: auto; }
            .file-items-container { max-height: 250px; overflow-x: hidden; }
            .checkbox-row { gap: 8px; }
            .chip-checkbox { padding: 6px 10px; font-size: 12px; gap: 4px; }
            .chip-checkbox .check-icon { width: 16px; height: 16px; }
            .separator-ghost { padding: 4px 6px; }
            .separator-ghost label { font-size: 12px; }
            .separator-ghost input { width: 45px; padding: 4px 2px; font-size: 12px; }
            .preview-header { flex-direction: column; align-items: stretch; }
            .header h1 { font-size: 28px; }
            .header .subtitle { font-size: 16px; }
            .feature-item { font-size: 12px; padding: 3px 10px; }
            .table-container { max-height: 300px; }
            table { font-size: 11px; }
            th, td { padding: 6px 3px; font-size: 11px; }
            .mapping-item label { font-size: 12px; }
            .mapping-item input { width: 45px; padding: 4px 2px; font-size: 12px; }
            .panel-title { font-size: 14px; }
            .upload-icon { font-size: 36px; }
            .upload-text { font-size: 14px; }
            .upload-hint { font-size: 11px; }
            .btn { padding: 8px 14px; font-size: 14px; }
            .extra-col { display: none !important; }
            .preview-stats-center { white-space: normal; }
        }

        @media (min-width: 769px) {
            body { padding: 16px; }
            .header { padding: 28px 36px 22px; }
            .header h1 { font-size: 52px; }
            .header .subtitle { font-size: 30px; }
            .feature-item { font-size: 22px; padding: 10px 26px; }
            .content { padding: 20px; }
            .panel { padding: 18px; }
            .panel-mapping { min-width: 360px; }
            .panel-title { font-size: 20px; }
            .panel-title .badge { width: 32px; height: 32px; font-size: 16px; }
            .upload-icon { font-size: 64px; }
            .upload-text { font-size: 24px; }
            .upload-hint { font-size: 18px; }
            .btn { padding: 14px 28px; font-size: 20px; }
            .file-items-container { max-height: 250px; }
            .file-name { font-size: 15px; }
            .file-count { font-size: 16px; }
            .mapping-item label { font-size: 18px; }
            .mapping-item input { width: 72px; padding: 8px 6px; font-size: 18px; }
            .default-hint-left { font-size: 14px; }
            .chip-checkbox { padding: 10px 18px; font-size: 18px; gap: 8px; }
            .chip-checkbox .check-icon { width: 24px; height: 24px; }
            .separator-ghost label { font-size: 18px; }
            .separator-ghost input { width: 65px; padding: 6px 4px; font-size: 16px; }
            .table-container { max-height: 450px; }
            table { font-size: 16px; }
            th, td { padding: 10px 6px; font-size: 16px; }
            .preview-title { font-size: 20px; }
            .preview-stats-center { font-size: 20px; padding: 10px 18px; }
            .status-bar { font-size: 16px; padding: 10px 18px; }
            .empty-table-msg { font-size: 18px; padding: 40px; }
            .extra-col { display: table-cell !important; }
        }
        @supports (padding: max(0px)) {
            body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><span>📇</span> Excel转通讯录 <span>📇</span></h1>
        <div class="subtitle">Excel 秒变 vCard · 电脑手机通用</div>
        <div class="features">
            <span class="feature-item">🔒 本地处理</span>
            <span class="feature-item">⚡ 无限数量</span>
            <span class="feature-item">📂 支持文件夹</span>
            <span class="feature-item">🆓 免费</span>
        </div>
    </div>

    <div class="content">
        <div class="top-three-panels">
            <div class="panel panel-upload">
                <div class="panel-title"><span class="badge">1</span> 选择文件</div>
                <div class="upload-area">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击按钮选择文件或文件夹</div>
                    <div class="upload-hint">支持 .xlsx / .xls 格式，可多选</div>
                    <div class="upload-buttons">
                        <button class="btn btn-outline" id="selectFilesBtn"><span>📄</span> 选择文件</button>
                        <button class="btn btn-folder" id="selectFolderBtn"><span>📂</span> 选择文件夹</button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls" multiple style="display:none;">
                <input type="file" id="folderInput" webkitdirectory multiple style="display:none;">
            </div>
            <div class="panel panel-files">
                <div class="panel-title"><span class="badge">📋</span> 已选 <span class="file-count" id="fileCount">(0)</span>
                    <button class="btn btn-outline btn-small" id="resetBtn" style="margin-left:auto; padding:4px 8px; font-size:11px;">🔄 重置</button>
                </div>
                <div class="file-items-container" id="fileItems"><div id="emptyFilesMsg" class="empty-files-msg" style="border:none; padding:25px 8px;">暂无</div></div>
            </div>
            <div class="panel panel-mapping">
                <div class="panel-title"><span class="badge">2</span> 列映射与过滤</div>
                <div class="mapping-row">
                    <div class="mapping-item"><label>姓名</label><input type="text" id="nameCol" value="AD" maxlength="3"></div>
                    <div class="mapping-item"><label>电话</label><input type="text" id="phoneCol" value="AE" maxlength="3"></div>
                    <div class="mapping-item"><label>公司</label><input type="text" id="companyCol" value="AF" maxlength="3"></div>
                </div>
                <div class="default-hint-left">默认 AD / AE / AF · 姓名必填</div>
                <div class="divider"></div>
                <div class="checkbox-grid">
                    <div class="checkbox-row">
                        <label class="chip-checkbox"><input type="checkbox" id="skipFirstRow" checked><span class="check-icon"></span><span>跳过标题</span></label>
                        <label class="chip-checkbox"><input type="checkbox" id="phoneCheck" checked><span class="check-icon"></span><span>号码检测（11位）</span></label>
                    </div>
                    <div class="checkbox-row">
                        <label class="chip-checkbox"><input type="checkbox" id="mergeDuplicates" checked><span class="check-icon"></span><span>合并同名</span></label>
                        <label class="chip-checkbox"><input type="checkbox" id="moreMappingCheck"><span class="check-icon"></span><span>更多映射</span></label>
                        <div class="separator-ghost"><label>分隔：</label><input type="text" id="separator" value="; " maxlength="3"></div>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" id="loadBtn" disabled><span>📂</span> 加载并预览</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <div class="preview-title"><span class="badge" style="display:inline-flex; margin-right:8px; width:24px; height:24px; font-size:13px; background:#4a90e2; color:white; border-radius:50%; align-items:center; justify-content:center;">3</span> 数据预览</div>
                <div class="preview-stats-center" id="previewStats">未加载数据</div>
                <button class="btn btn-success" id="exportBtn" disabled><span>⬇️</span> 导出 vCard</button>
            </div>
            <div class="table-container">
                <table id="previewTable">
                    <thead id="tableHeader">
                        <tr><th>#</th><th>姓名</th><th>电话</th><th>公司</th></tr>
                    </thead>
                    <tbody id="tableBody"><tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusIcon">💡</span> <span id="statusText">等待选择文件...</span>
            <div class="loading" id="loading"><div class="spinner"></div><span>处理中</span></div>
        </div>
    </div>
</div>

<!-- 自定义确认弹窗 -->
<div class="confirm-dialog-overlay" id="confirmDialog">
    <div class="confirm-dialog">
        <div class="confirm-dialog-icon" id="confirmIcon">⚠️</div>
        <div class="confirm-dialog-title" id="confirmTitle">确认操作</div>
        <div class="confirm-dialog-message" id="confirmMessage">确定要执行此操作吗？</div>
        <div class="confirm-dialog-buttons">
            <button class="btn btn-outline" id="confirmCancelBtn">取消</button>
            <button class="btn btn-primary" id="confirmOkBtn">确定</button>
        </div>
    </div>
</div>

<!-- 更多映射弹窗 -->
<div class="modal-overlay" id="moreMappingModal">
    <div class="modal-content">
        <div class="modal-title"><span>📇 更多字段映射</span><span style="font-size:14px; color:#888; margin-left:auto;">勾选增加标题</span></div>
        <div style="margin-bottom:16px;"><button class="btn btn-outline" id="autoDetectBtn" style="padding:8px 16px;">🔍 自动检测映射</button></div>
        <div id="modalMappingList"></div>
        <div style="margin-top:20px; display:flex; gap:12px; justify-content:flex-end;">
            <button class="btn btn-outline" id="modalCancelBtn" style="padding:8px 20px;">取消</button>
            <button class="btn btn-primary" id="modalConfirmBtn" style="padding:8px 20px;">确定</button>
        </div>
    </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script>
(function(){
    'use strict';
    // ==================== DOM 元素 ====================
    const fileInput = document.getElementById('fileInput'), folderInput = document.getElementById('folderInput');
    const selectFilesBtn = document.getElementById('selectFilesBtn'), selectFolderBtn = document.getElementById('selectFolderBtn');
    const fileItems = document.getElementById('fileItems'), fileCount = document.getElementById('fileCount');
    const resetBtn = document.getElementById('resetBtn'), loadBtn = document.getElementById('loadBtn'), exportBtn = document.getElementById('exportBtn');
    const tableHeader = document.getElementById('tableHeader'), tableBody = document.getElementById('tableBody');
    const previewStats = document.getElementById('previewStats'), statusText = document.getElementById('statusText'), statusIcon = document.getElementById('statusIcon'), loading = document.getElementById('loading');
    const nameColInput = document.getElementById('nameCol'), phoneColInput = document.getElementById('phoneCol'), companyColInput = document.getElementById('companyCol');
    const skipFirstRow = document.getElementById('skipFirstRow'), phoneCheck = document.getElementById('phoneCheck'), mergeDuplicates = document.getElementById('mergeDuplicates');
    const separatorInput = document.getElementById('separator');
    const moreMappingCheck = document.getElementById('moreMappingCheck');
    const modal = document.getElementById('moreMappingModal'), modalList = document.getElementById('modalMappingList');
    const modalCancel = document.getElementById('modalCancelBtn'), modalConfirm = document.getElementById('modalConfirmBtn'), autoDetectBtn = document.getElementById('autoDetectBtn');

    // 确认弹窗元素
    const confirmDialog = document.getElementById('confirmDialog');
    const confirmIcon = document.getElementById('confirmIcon');
    const confirmTitle = document.getElementById('confirmTitle');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmCancelBtn = document.getElementById('confirmCancelBtn');
    const confirmOkBtn = document.getElementById('confirmOkBtn');

    // ==================== 状态变量 ====================
    let selectedFiles = [], processedContacts = [];
    let invalidPhoneCount = 0, skippedFilesCount = 0;
    let pendingConfirmCallback = null;
    
    // 更多映射字段配置
    const extraFieldConfig = [
        { key: 'address', label: '地址', vcard: 'ADR' },
        { key: 'email', label: '邮箱', vcard: 'EMAIL' },
        { key: 'note', label: '备注', vcard: 'NOTE' },
        { key: 'birthday', label: '生日', vcard: 'BDAY' },
        { key: 'title', label: '职位', vcard: 'TITLE' },
        { key: 'url', label: '网址', vcard: 'URL' },
        { key: 'fax', label: '传真', vcard: 'TEL;TYPE=FAX' }
    ];
    let extraMapping = Object.fromEntries(extraFieldConfig.map(f => [f.key, '']));
    let moreMappingEnabled = false;

    // ==================== 工具函数 ====================
    function truncateFileName(fileName, maxLen = 25) {
        if (fileName.length <= maxLen) return fileName;
        const lastDot = fileName.lastIndexOf('.');
        if (lastDot === -1) return fileName.slice(0, maxLen - 3) + '...';
        const name = fileName.slice(0, lastDot);
        const ext = fileName.slice(lastDot);
        const available = maxLen - ext.length;
        if (available <= 5) return name.slice(0, available - 3) + '...' + ext;
        const headLen = Math.floor(available * 0.5);
        return name.slice(0, headLen) + '*' + name.slice(-3) + ext;
    }

    function colToIdx(letter) {
        let result = 0;
        const upper = letter.toUpperCase();
        for (let i = 0; i < upper.length; i++) {
            result = result * 26 + (upper.charCodeAt(i) - 64);
        }
        return result - 1;
    }

    function idxToColLetter(index) {
        let result = '';
        let n = index;
        while (n >= 0) {
            result = String.fromCharCode(65 + (n % 26)) + result;
            n = Math.floor(n / 26) - 1;
        }
        return result;
    }

    function cleanPhone(v) {
        if (v == null || v === '') return '';
        let s = String(v).trim();
        if (s === 'nan' || s === 'NaN') return '';
        if (s.includes('.')) {
            const n = parseFloat(s);
            if (!isNaN(n) && Number.isInteger(n)) s = String(Math.floor(n));
        }
        return s;
    }
    function cleanText(v) {
        if (v == null || v === '') return '';
        const s = String(v).trim();
        return (s === 'nan' || s === 'NaN') ? '' : s;
    }

    function isValidPhone(p) {
        if (!p) return false;
        const d = String(p).replace(/\s/g, '');
        return /^\d{11}$/.test(d);
    }

    function detectColumn(headers, keywords) {
        for (let i = 0; i < headers.length; i++) {
            const h = String(headers[i] || '').toLowerCase();
            if (keywords.some(kw => h.includes(kw))) {
                return idxToColLetter(i);
            }
        }
        return '';
    }

    function updateStatus(icon, text) { statusIcon.textContent = icon; statusText.textContent = text; }
    function setLoading(l) { loading.classList.toggle('show', l); }
    function updateButtonStates() { loadBtn.disabled = !selectedFiles.length; exportBtn.disabled = !processedContacts.length; }

    function escapeHtml(t) {
        if (!t) return '';
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    // 自定义确认弹窗
    function showConfirmDialog(options) {
        const { icon = '⚠️', title = '确认操作', message = '确定要执行此操作吗？', onConfirm } = options;
        confirmIcon.textContent = icon;
        confirmTitle.textContent = title;
        confirmMessage.textContent = message;
        pendingConfirmCallback = onConfirm;
        confirmDialog.style.display = 'flex';
    }

    function hideConfirmDialog() {
        confirmDialog.style.display = 'none';
        pendingConfirmCallback = null;
    }

    // ==================== 重置功能 ====================
    function resetToInitialState() {
        selectedFiles = [];
        processedContacts = [];
        extraMapping = Object.fromEntries(extraFieldConfig.map(f => [f.key, '']));
        moreMappingEnabled = false;
        moreMappingCheck.checked = false;
        
        // 恢复默认列映射
        nameColInput.value = 'AD';
        phoneColInput.value = 'AE';
        companyColInput.value = 'AF';
        
        // 恢复复选框默认状态
        skipFirstRow.checked = true;
        phoneCheck.checked = true;
        mergeDuplicates.checked = true;
        separatorInput.value = '; ';
        
        renderFileList();
        renderEmptyTable();
        previewStats.textContent = '未加载数据';
        updateStatus('💡', '等待选择文件...');
        updateButtonStates();
    }

    // ==================== 文件处理 ====================
    function addFiles(files) {
        let added = 0;
        files.forEach(f => {
            if (!selectedFiles.some(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified)) {
                selectedFiles.push(f);
                added++;
            }
        });
        if (added) { renderFileList(); updateStatus('📁', `已添加 ${added} 个文件`); }
        updateButtonStates();
    }

    function renderFileList() {
        fileCount.textContent = `(${selectedFiles.length})`;
        if (!selectedFiles.length) {
            fileItems.innerHTML = '<div class="empty-files-msg" style="border:none; padding:25px 8px;">暂无</div>';
            return;
        }
        let html = '';
        [...selectedFiles].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN')).forEach(f => {
            const idx = selectedFiles.findIndex(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified);
            html += `<div class="file-item"><span class="file-name" title="${f.name}">📄 ${truncateFileName(f.name, 25)}</span><span class="file-remove" data-index="${idx}">✕</span></div>`;
        });
        fileItems.innerHTML = html;
        fileItems.querySelectorAll('.file-remove').forEach(b => b.addEventListener('click', function(e) {
            e.stopPropagation();
            const idx = parseInt(this.dataset.index);
            if (!isNaN(idx)) {
                selectedFiles.splice(idx, 1);
                renderFileList();
                updateButtonStates();
                updateStatus(selectedFiles.length ? '📁' : '💡', selectedFiles.length ? `已选择 ${selectedFiles.length} 个文件` : '等待选择文件...');
            }
        }));
    }

    // ==================== 表格渲染 ====================
    function renderEmptyTable() {
        tableHeader.innerHTML = '<tr><th>#</th><th>姓名</th><th>电话</th><th>公司</th></tr>';
        tableBody.innerHTML = '<tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看</td></tr>';
    }

    function renderPreviewTable() {
        let headerHtml = '<tr><th>#</th><th>姓名</th><th>电话</th><th>公司</th>';
        if (moreMappingEnabled) {
            extraFieldConfig.forEach(f => { headerHtml += `<th class="extra-col">${f.label}</th>`; });
        }
        headerHtml += '</tr>';
        tableHeader.innerHTML = headerHtml;

        if (!processedContacts.length) {
            const colspan = 4 + (moreMappingEnabled ? extraFieldConfig.length : 0);
            tableBody.innerHTML = `<tr><td colspan="${colspan}" class="empty-table-msg">点击"加载并预览"查看</td></tr>`;
            return;
        }

        const preview = processedContacts.slice(0, 500);
        let html = '';
        preview.forEach((c, i) => {
            html += `<tr><td>${i + 1}</td><td>${escapeHtml(c.name) || '-'}</td><td>${escapeHtml(c.phone) || '-'}</td><td>${escapeHtml(c.company) || '-'}</td>`;
            if (moreMappingEnabled) {
                extraFieldConfig.forEach(f => { html += `<td class="extra-col">${escapeHtml(c[f.key]) || '-'}</td>`; });
            }
            html += '</tr>';
        });
        tableBody.innerHTML = html;

        if (processedContacts.length > 500) {
            updateStatus('📋', `预览前500条，共${processedContacts.length}条`);
        }
    }

    // ==================== 弹窗逻辑 ====================
    function buildModalFromHeaders(headers) {
        const options = headers.map((h, i) => ({
            letter: idxToColLetter(i),
            name: h
        }));
        let html = '';
        extraFieldConfig.forEach(f => {
            const cur = extraMapping[f.key] || '';
            let optsHtml = '<option value="">-- 不映射 --</option>';
            options.forEach(o => {
                optsHtml += `<option value="${o.letter}" ${o.letter === cur ? 'selected' : ''}>${o.letter} (${o.name})</option>`;
            });
            html += `<div class="field-row"><label>${f.label}：</label><select id="extra_${f.key}">${optsHtml}</select><input type="text" id="extra_${f.key}_manual" placeholder="手动" value="${cur}" maxlength="3"></div>`;
        });
        modalList.innerHTML = html;
    }

    function openModal() {
        if (!selectedFiles.length) {
            alert('请先选择文件');
            moreMappingCheck.checked = false;
            return;
        }
        const file = selectedFiles[0];
        const reader = new FileReader();
        reader.onload = e => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (rows.length) buildModalFromHeaders(rows[0]);
            modal.style.display = 'flex';
        };
        reader.readAsArrayBuffer(file);
    }

    async function autoDetectMapping() {
        if (!selectedFiles.length) { alert('请先选择文件'); return; }
        const file = selectedFiles[0];
        try {
            const data = await readExcel(file);
            if (!data.length) return;
            const headers = data[0];
            
            const nameLetter = detectColumn(headers, ['姓名', '名字', 'name', '联系人']);
            const phoneLetter = detectColumn(headers, ['电话', '手机', 'phone', 'tel', 'mobile']);
            const companyLetter = detectColumn(headers, ['公司', '单位', 'company', 'org']);
            if (nameLetter) nameColInput.value = nameLetter;
            if (phoneLetter) phoneColInput.value = phoneLetter;
            if (companyLetter) companyColInput.value = companyLetter;

            const mapping = {};
            const keywordMap = {
                address: ['地址', 'address', 'addr'],
                email: ['邮箱', 'email', 'mail'],
                note: ['备注', 'note', 'remark'],
                birthday: ['生日', 'birthday', 'bday'],
                title: ['职位', 'title', 'job'],
                url: ['网址', 'url', 'website'],
                fax: ['传真', 'fax']
            };
            extraFieldConfig.forEach(f => {
                const letter = detectColumn(headers, keywordMap[f.key] || []);
                if (letter) mapping[f.key] = letter;
            });
            extraMapping = { ...extraMapping, ...mapping };
            
            if (modal.style.display === 'flex') buildModalFromHeaders(headers);
            updateStatus('🔍', '自动检测完成！');
            setTimeout(() => updateStatus('📁', `已选择 ${selectedFiles.length} 个文件`), 2000);
        } catch (e) {
            alert('读取文件失败');
        }
    }

    function saveModalMapping() {
        extraFieldConfig.forEach(f => {
            const sel = document.getElementById(`extra_${f.key}`);
            const man = document.getElementById(`extra_${f.key}_manual`);
            extraMapping[f.key] = man.value.trim().toUpperCase() || sel.value;
        });
        modal.style.display = 'none';
        moreMappingEnabled = true;
    }

    // ==================== 核心功能 ====================
    async function readExcel(f) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }));
                } catch (er) { rej(er); }
            };
            r.onerror = rej;
            r.readAsArrayBuffer(f);
        });
    }

    function mergeContacts(data) {
        const m = new Map();
        const sep = separatorInput.value || '; ';
        data.forEach(({ name, phone, company, ...extra }) => {
            if (!m.has(name)) m.set(name, { phones: new Set(), company: '', extra: {} });
            const d = m.get(name);
            if (phone) d.phones.add(phone);
            if (company && !d.company) d.company = company;
            Object.entries(extra).forEach(([k, v]) => { if (v && !d.extra[k]) d.extra[k] = v; });
        });
        return Array.from(m, ([name, { phones, company, extra }]) => ({
            name, phone: [...phones].sort().join(sep), company, ...extra
        }));
    }

    async function loadAndPreview() {
        if (!selectedFiles.length) return updateStatus('⚠️', '请先选择文件');
        const nameL = nameColInput.value.trim().toUpperCase();
        const phoneL = phoneColInput.value.trim().toUpperCase();
        if (!nameL || !phoneL) return updateStatus('⚠️', '请设置姓名和电话列');

        setLoading(true);
        updateStatus('📂', '读取中...');
        invalidPhoneCount = 0;
        skippedFilesCount = 0;

        try {
            const nIdx = colToIdx(nameL);
            const pIdx = colToIdx(phoneL);
            const cIdx = companyColInput.value.trim() ? colToIdx(companyColInput.value.trim().toUpperCase()) : -1;
            let raw = [];

            for (let i = 0; i < selectedFiles.length; i++) {
                const f = selectedFiles[i];
                updateStatus('📂', `${i + 1}/${selectedFiles.length} ${f.name}`);
                try {
                    const data = await readExcel(f);
                    if (!data.length) { skippedFilesCount++; continue; }
                    
                    const start = skipFirstRow.checked ? 1 : 0;
                    for (let r = start; r < data.length; r++) {
                        const row = data[r];
                        if (nIdx >= row.length || pIdx >= row.length) continue;
                        
                        const name = cleanText(row[nIdx]);
                        if (!name) continue;
                        
                        let phone = cleanPhone(row[pIdx]);
                        const company = cIdx >= 0 && cIdx < row.length ? cleanText(row[cIdx]) : '';
                        
                        if (phoneCheck.checked && !isValidPhone(phone)) { invalidPhoneCount++; continue; }
                        
                        const extra = {};
                        if (moreMappingEnabled) {
                            extraFieldConfig.forEach(f => {
                                const letter = extraMapping[f.key];
                                if (letter) {
                                    try {
                                        const idx = colToIdx(letter);
                                        if (idx < row.length) extra[f.key] = cleanText(row[idx]);
                                    } catch (e) {}
                                }
                            });
                        }
                        raw.push({ name, phone, company, ...extra });
                    }
                } catch (e) { skippedFilesCount++; }
            }

            if (!raw.length) {
                updateStatus('⚠️', '无有效数据');
                previewStats.textContent = '未读取到数据';
                renderEmptyTable();
                processedContacts = [];
                setLoading(false);
                updateButtonStates();
                return;
            }

            updateStatus('🔄', '合并中...');
            processedContacts = mergeDuplicates.checked ? mergeContacts(raw) : raw;

            const cnt = processedContacts.length;
            let statsText = `📊 有效 ${raw.length} 条`;
            const details = [];
            if (skipFirstRow.checked) details.push('跳过标题');
            if (phoneCheck.checked && invalidPhoneCount) details.push(`号码异常${invalidPhoneCount}`);
            if (details.length) statsText += ` (${details.join('·')})`;
            statsText += mergeDuplicates.checked ? ` → ${cnt}人` : ` → ${cnt}人`;
            if (skippedFilesCount) statsText += ` · 跳过${skippedFilesCount}文件`;
            previewStats.textContent = statsText;

            renderPreviewTable();
            updateStatus('✅', `完成，共 ${cnt} 人`);
            setLoading(false);
            updateButtonStates();
        } catch (e) {
            console.error('加载失败:', e);
            updateStatus('❌', '加载失败');
            previewStats.textContent = '加载失败';
            setLoading(false);
            processedContacts = [];
            renderEmptyTable();
            updateButtonStates();
        }
    }

    function exportVCard() {
        if (!processedContacts.length) return updateStatus('⚠️', '无数据');
        const sep = separatorInput.value || '; ';
        let content = '';
        processedContacts.forEach((c, i) => {
            let card = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
            card += `FN:${c.name.trim()}\r\nN:;${c.name.trim()};;;\r\n`;
            if (c.company) card += `ORG:${c.company.trim()}\r\n`;
            if (c.phone) {
                c.phone.split(sep).map(p => p.trim()).filter(p => p).forEach(p => card += `TEL:${p}\r\n`);
            }
            if (moreMappingEnabled) {
                extraFieldConfig.forEach(f => {
                    const val = c[f.key];
                    if (val) {
                        if (f.vcard === 'ADR') card += `ADR:;;${val};;;;\r\n`;
                        else card += `${f.vcard}:${val}\r\n`;
                    }
                });
            }
            card += 'END:VCARD';
            content += card + (i < processedContacts.length - 1 ? '\r\n' : '');
        });

        const now = new Date();
        const timeStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}-${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
        const name = `通讯录导出_${timeStr}.vcf`;
        const blob = new Blob([content], { type: 'text/vcard;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 100);
        updateStatus('✅', `导出成功！${processedContacts.length}人`);
    }

    // ==================== 事件绑定 ====================
    function initEvents() {
        selectFilesBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.value = ''; fileInput.click(); });
        selectFolderBtn.addEventListener('click', e => { e.stopPropagation(); folderInput.value = ''; folderInput.click(); });
        fileInput.addEventListener('change', function() { if (this.files.length) addFiles(Array.from(this.files)); });
        folderInput.addEventListener('change', function() {
            const files = Array.from(this.files).filter(f => f.name.match(/\.(xlsx|xls)$/i));
            files.length ? addFiles(files) : updateStatus('⚠️', '文件夹中无 Excel 文件');
        });
        
        resetBtn.addEventListener('click', () => {
            showConfirmDialog({
                icon: '🔄',
                title: '重置确认',
                message: '确定要重置所有设置吗？所有已选文件和映射配置将被清空。',
                onConfirm: () => {
                    resetToInitialState();
                    hideConfirmDialog();
                }
            });
        });
        
        loadBtn.addEventListener('click', loadAndPreview);
        exportBtn.addEventListener('click', exportVCard);
        [nameColInput, phoneColInput, companyColInput].forEach(i => i.addEventListener('input', e => e.target.value = e.target.value.toUpperCase()));
        
        moreMappingCheck.addEventListener('change', function() {
            if (this.checked) { openModal(); moreMappingEnabled = true; }
            else { moreMappingEnabled = false; }
        });
        modalCancel.addEventListener('click', () => {
            modal.style.display = 'none';
            moreMappingCheck.checked = false;
            moreMappingEnabled = false;
        });
        modalConfirm.addEventListener('click', saveModalMapping);
        autoDetectBtn.addEventListener('click', autoDetectMapping);
        modal.addEventListener('click', e => {
            if (e.target === modal) {
                modal.style.display = 'none';
                moreMappingCheck.checked = false;
                moreMappingEnabled = false;
            }
        });

        // 确认弹窗事件
        confirmCancelBtn.addEventListener('click', hideConfirmDialog);
        confirmOkBtn.addEventListener('click', () => {
            if (pendingConfirmCallback) pendingConfirmCallback();
            hideConfirmDialog();
        });
        confirmDialog.addEventListener('click', e => {
            if (e.target === confirmDialog) hideConfirmDialog();
        });
    }

    initEvents();
})();
</script>
