<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, viewport-fit=cover">
    <title>问单速查 · 数据分析</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        :root {
            --bg: #f0f2f7;
            --card-bg: #ffffff;
            --primary: #5568f5;
            --primary-hover: #4052d9;
            --primary-light: #eef0ff;
            --text: #1e1e2e;
            --text-secondary: #5c5c78;
            --text-muted: #8b8ba8;
            --border: #e6e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.18);
            --radius-lg: 14px;
            --radius: 10px;
            --radius-xs: 5px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --tag-bg: #eef1ff;
            --tag-active-bg: #5568f5;
            --warning: #e67e22;
            --cold: #0ea5b9;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:15px; -webkit-text-size-adjust:100%; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { max-width: 1700px; margin: 0 auto; padding: 16px 20px 32px; }

        .page-header {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            flex-wrap: wrap; padding: 12px 0 6px; margin-bottom: 14px; position: relative;
        }
        .page-header h1 { font-size: 1.5rem; font-weight: 750; color: #1a1a2e; }

        .header-menu-btn {
            background: #fff; border: 1.5px solid #d8dce8; border-radius: 22px;
            padding: 7px 16px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: #4a4a65; transition: all var(--transition);
        }
        .header-menu-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

        .header-menu-dropdown {
            position: absolute; top: calc(100% + 10px); right: 0; background: #fff;
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl); z-index: 200; display: none; min-width: 170px; padding: 6px 0;
        }
        .header-menu-dropdown.show { display: block; animation: fadeInDown 0.18s ease; }
        @keyframes fadeInDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        .header-menu-dropdown button {
            display: block; width: 100%; padding: 11px 20px; border: none; background: none;
            text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 500; color: var(--text-secondary);
        }
        .header-menu-dropdown button:hover { background: #f5f6fc; color: var(--primary); }

        /* 统计面板 - 新布局 */
        .stats-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: stretch;
            box-shadow: var(--shadow-sm);
        }
        .stats-left, .stats-right {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; background: #fafbfd; border-radius: var(--radius); border: 1px solid #eef0f6;
            padding: 12px 8px; min-width: 80px;
        }
        .stats-label { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stats-value { font-weight: 750; font-size: 1.9rem; color: #1a1a2e; }
        .store-type-tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 12px; font-size: 0.65rem;
            font-weight: 600; margin-left: 6px; vertical-align: middle;
        }
        .store-type-tag.shengxian { background: #e0f2fe; color: #0369a1; }
        .store-type-tag.qianzhicang { background: #fef3c7; color: #92400e; }

        /* 问单达成展示区 */
        .achievement-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 18px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }
        .achievement-title {
            font-size: 0.75rem; font-weight: 700; color: #1a1a2e;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
        }
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        @media (max-width: 1200px) {
            .achievement-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .achievement-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .achievement-item {
            background: #fafbfd; border: 1px solid #eef0f6; border-radius: var(--radius);
            padding: 10px 8px; text-align: center;
            transition: all var(--transition);
        }
        .achievement-item:hover { background: #f5f7ff; border-color: #dde3ff; }
        .achievement-item-name {
            font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .achievement-item-value {
            font-size: 0.9rem; font-weight: 700;
        }
        .achievement-item-value.normal { color: var(--success); }
        .achievement-item-value.warning { color: var(--warning); }
        .achievement-item-value.danger { color: var(--danger); }
        .achievement-item-value.zero { color: #b0b0c0; }
        .achievement-item-limit {
            font-size: 0.6rem; color: var(--text-muted); margin-top: 4px;
        }

        /* ========== 责任分析面板 ========== */
        .responsibility-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 18px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: visible;
        }

        /* 表格外层容器 - 限制宽度防止溢出 */
        .table-fit-container {
            width: 100%;
            max-width: 100%;
            overflow: visible;
        }

        .responsibility-table {
            width: 100% !important;
            min-width: 0 !important;
            table-layout: fixed;              /* 关键：固定布局，严格按百分比分配列宽 */
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        /* 列宽严格按照百分比分配（6列） */
        .responsibility-table th:nth-child(1),
        .responsibility-table td:nth-child(1) { width: 30%; }  /* 问题原因名称 */

        .responsibility-table th:nth-child(2),
        .responsibility-table td:nth-child(2) { width: 10%; }  /* 总计 */

        .responsibility-table th:nth-child(3),
        .responsibility-table td:nth-child(3) { width: 10%; }  /* 无责 */

        .responsibility-table th:nth-child(4),
        .responsibility-table td:nth-child(4) { width: 10%; }  /* 有责 */

        .responsibility-table th:nth-child(5),
        .responsibility-table td:nth-child(5) { width: 10%; }  /* 有责率 */

        .responsibility-table th:nth-child(6),
        .responsibility-table td:nth-child(6) { width: 30%; }  /* 核实原因 */

        /* 表头样式微调 */
        .responsibility-table th {
            padding: 10px 8px;
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #6b6b88;
            border-bottom: 2px solid #e2e5ee;
            background: #f8f9fd;
            word-break: break-word;
        }

        /* 单元格样式 */
        .responsibility-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #f0f2f7;
            text-align: center;
            color: #3a3a58;
            font-size: 0.85rem;
            vertical-align: middle;
            word-break: break-word;
        }

        /* 核实原因输入框宽度自适应单元格，不溢出 */
        .responsibility-input {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1.5px solid #d8dce8;
            font-size: 0.8rem;
            background: #fff;
            color: #3a3a55;
            box-sizing: border-box;
            transition: 0.2s;
            font-family: inherit;
        }

        .responsibility-input:focus {
            border-color: #5568f5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(85, 104, 245, 0.1);
        }
        .responsibility-input.placeholder-default {
            color: #a0a0b8;
            font-style: italic;
        }
        .responsibility-input.user-value {
            color: #1a1a2e;
            font-weight: 700;
        }

        /* 移动端适配：适当缩小内边距，但列宽比例不变 */
        @media (max-width: 780px) {
            .responsibility-panel {
                padding: 12px;
            }
            .responsibility-table th,
            .responsibility-table td {
                padding: 6px 5px;
                font-size: 0.75rem;
            }
            .responsibility-input {
                padding: 5px 4px;
                font-size: 0.7rem;
            }
        }

        .cell-textarea {
            padding: 4px 6px; border-radius: var(--radius-xs); border: 1.5px solid #d8dce8;
            font-size: 0.82rem; background: #fff; color: #3a3a55; font-family: inherit; line-height: 1.4;
        }
        .cell-textarea:focus { border-color: var(--primary); outline: none; }

        /* 筛选栏 - 新布局 */
        .filter-bar {
            position: relative;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 14px 18px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
        }
        .filter-left { flex: 1; min-width: 240px; }
        .filter-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; }
        .filter-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .filter-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .filter-label-row label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

        .bubble-container { display: flex; flex-wrap: wrap; gap: 7px; }
        .bubble-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            background: var(--tag-bg);
            color: #4f6ef7;
            border: 1.5px solid transparent;
            transition: all var(--transition);
            font-weight: 550;
        }
        .bubble-tag:hover { background: #dde3ff; border-color: #c5ceff; }
        .bubble-tag.active { background: var(--tag-active-bg); color: #fff; border-color: var(--tag-active-bg); box-shadow: 0 3px 12px rgba(85,104,245,0.28); }
        .bubble-all { background: #f5f5f8; color: #666; border: 1.5px dashed #d0d5e5; }
        .bubble-all.active { background: #5c5c78; color: #fff; border-color: #5c5c78; }
        .bubble-all.has-selection { background: var(--warning); color: #fff; border-color: var(--warning); border-style: solid; }
        .bubble-count-inline { font-size: 0.65rem; opacity: 0.78; }

        /* 移动端气泡两列 */
        @media (max-width: 768px) {
            .bubble-tag {
                flex: 0 0 calc(50% - 7px);
                justify-content: center;
            }
        }

        .view-switch-bubble {
            display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 22px;
            font-size: 0.75rem; cursor: pointer; background: #f5f5f8; color: #5c5c78;
            border: 1.5px solid #d8dce8; font-weight: 600; transition: all var(--transition);
        }
        .view-switch-bubble:hover { border-color: #b0b8d0; background: #eef0f8; }
        .active-default { background: var(--primary); color: #fff; border-color: var(--primary); pointer-events: none; }
        .active-bad { background: var(--warning); color: #fff; border-color: var(--warning); pointer-events: none; }
        .active-cold { background: var(--cold); color: #fff; border-color: var(--cold); pointer-events: none; }
        .active-logistics { background: #8b5cf6; color: #fff; border-color: #8b5cf6; pointer-events: none; }
        .view-badge { font-size: 0.62rem; background: rgba(255,255,255,0.28); padding: 2px 8px; border-radius: 10px; font-weight: 650; }

        .copy-all-btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 22px;
            font-size: 0.75rem; cursor: pointer; background: #10b981; color: #fff;
            border: 1.5px solid #10b981; font-weight: 600; transition: all var(--transition);
        }
        .copy-all-btn:hover { background: #059669; border-color: #059669; }

        /* 导出选择面板 */
        .export-select-panel {
            background: #fff; border-radius: 16px; padding: 24px; max-width: 480px; width: 92%;
            box-shadow: 0 26px 70px rgba(0,0,0,0.28); animation: slideUp 0.3s ease;
        }
        .export-select-title {
            font-size: 1.1rem; font-weight: 750; color: #1a1a2e; margin-bottom: 16px; text-align: center;
        }
        .export-checkbox-list {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px;
        }
        .export-checkbox-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border-radius: 10px; border: 1.5px solid #e6e8f0; cursor: pointer;
            transition: all var(--transition); font-size: 0.85rem; font-weight: 550; color: #3a3a58;
        }
        .export-checkbox-item:hover { border-color: var(--primary); background: #f5f7ff; }
        .export-checkbox-item.checked { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
        .export-checkbox-item input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer;
        }
        .export-select-footer {
            display: flex; justify-content: flex-end; gap: 10px; padding-top: 14px; border-top: 1px solid #f0f2f7;
        }

        .table-wrapper {
            background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow);
            border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column;
        }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 1200px; table-layout: auto; }
        table thead { background: #f8f9fd; position: sticky; top: 0; z-index: 10; }
        table thead th {
            padding: 10px 7px; text-align: center; font-weight: 700; font-size: 0.65rem;
            text-transform: uppercase; color: #6b6b88; border-bottom: 2px solid #e2e5ee;
            white-space: nowrap; background: #f8f9fd;
        }
        table tbody td {
            padding: 8px 7px; border-bottom: 1px solid #f0f2f7; vertical-align: middle;
            color: #3a3a58; text-align: center; word-break: break-word; font-size: 0.73rem;
        }
        table tbody tr { background: #fff; }
        table tbody tr:hover { background: #f3f5fb !important; }
        tr.duplicate-batch { background: #f2f2f8 !important; border-left: 3px solid #d0d5e5; }
        .cell-clickable { cursor: pointer; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; max-height: 4.2em; overflow: hidden; text-overflow: ellipsis; padding: 2px 4px; border-radius: 3px; font-size: 0.73rem; line-height: 1.4; word-break: break-all; }
        .cell-clickable:hover { background: #eef1ff; color: var(--primary); }
        .cell-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 0.68rem; border: 1.5px solid #d5dcff; background: #f0f3ff; color: #4f6ef7; font-weight: 550; transition: all var(--transition); }
        .cell-btn:hover { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
        .cell-btn.no-data { background: #f5f5f8; color: #bbb; pointer-events: none; border-color: #e8e8ed; }
        .cell-btn.alert { border-color: #ef4444; color: #ef4444; background: #fef2f2; }
        .cell-btn.alert:hover { background: #ef4444; color: #fff; }
        .cell-view-btn { background: #fff8f1; color: var(--warning); border: 1.5px solid #ffe0c0; padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 0.68rem; font-weight: 550; transition: all var(--transition); display: inline-flex; align-items: center; gap: 4px; }
        .cell-view-btn:hover { background: var(--warning); color: #fff; border-color: var(--warning); }
        .cell-view-btn.no-image { background: #f5f5f8; color: #bbb; pointer-events: none; border-color: #e8e8ed; }
        .cell-select { padding: 5px 7px; border-radius: var(--radius-xs); border: 1.5px solid #d8dce8; font-size: 0.68rem; background: #fff; min-width: 65px; color: #3a3a55; cursor: pointer; }
        .cell-select:focus { border-color: var(--primary); outline: none; }
        .cell-toggle-btn { display: inline-flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: 14px; cursor: pointer; font-size: 0.72rem; border: 1.5px solid #d5dcff; background: #f0f3ff; color: #4f6ef7; font-weight: 550; transition: all var(--transition); user-select: none; position: relative; }
        .cell-toggle-btn:hover { background: #e0e5ff; border-color: var(--primary); }
        .cell-toggle-btn:active { transform: scale(0.95); }
        .cell-toggle-btn .toggle-hint { font-size: 0.6rem; opacity: 0.5; margin-left: 2px; }
        .cell-toggle-btn[data-type="responsible"] { border-color: #f5a6a6; background: #fff0f0; color: #e74c3c; }
        .cell-toggle-btn[data-type="responsible"]:hover { background: #ffe0e0; }
        .cell-toggle-btn[data-type="irresponsible"] { border-color: #a6d5b8; background: #f0fff4; color: #27ae60; }
        .cell-toggle-btn[data-type="irresponsible"]:hover { background: #e0ffe8; }
        .cell-toggle-btn[data-type="nonstandard"] { border-color: #f5c6a6; background: #fff8f0; color: #e67e22; }
        .cell-toggle-btn[data-type="nonstandard"]:hover { background: #ffe8d0; }
        .cell-toggle-btn[data-type="standard"] { border-color: #a6c5f5; background: #f0f6ff; color: #3498db; }
        .cell-toggle-btn[data-type="standard"]:hover { background: #e0ecff; }
        .cell-toggle-btn[data-type="yes"] { border-color: #f5a6a6; background: #fff0f0; color: #e74c3c; }
        .cell-toggle-btn[data-type="yes"]:hover { background: #ffe0e0; }
        .cell-toggle-btn[data-type="no"] { border-color: #a6d5b8; background: #f0fff4; color: #27ae60; }
        .cell-toggle-btn[data-type="no"]:hover { background: #e0ffe8; }
        @keyframes togglePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,110,247,0.3); } 50% { box-shadow: 0 0 0 4px rgba(79,110,247,0.1); } }
        .cell-toggle-btn.pulse { animation: togglePulse 2s ease-in-out 3; }
        .cell-input { padding: 5px 7px; border-radius: var(--radius-xs); border: 1.5px solid #d8dce8; font-size: 0.68rem; background: #fff; width: 100px; color: #3a3a55; }
        .cell-input:focus { border-color: var(--primary); outline: none; }

        .preview-bubble {
            position: fixed; z-index: 500; background: #fff; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.26); padding: 12px; display: none;
            max-width: 50vw; max-height: 50vh; text-align: center; animation: fadeIn 0.2s; border: 1px solid var(--border);
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .preview-bubble img { max-width: 46vw; max-height: 38vh; object-fit: contain; border-radius: 8px; }
        .preview-bubble .preview-controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 8px; }
        .preview-bubble .preview-controls button { padding: 5px 12px; border-radius: 14px; border: 1.5px solid #e6e8f0; background: #fafbfd; cursor: pointer; font-size: 0.68rem; font-weight: 600; color: #5c5c78; }
        .preview-bubble .preview-controls button:hover { background: #f0f3ff; border-color: var(--primary); color: var(--primary); }
        .preview-bubble .preview-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
        .preview-bubble .preview-counter { font-size: 0.68rem; color: var(--text-muted); min-width: 45px; }
        .preview-bubble .preview-close { position: absolute; top: 8px; right: 12px; background: rgba(0,0,0,0.06); border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.95rem; color: #888; display: flex; align-items: center; justify-content: center; }
        .preview-bubble .preview-close:hover { background: rgba(0,0,0,0.14); color: #333; }

        .fullscreen-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 600; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .fullscreen-overlay img { max-width: 96vw; max-height: 96vh; border-radius: 8px; }
        .btn-close-fs { position: fixed; top: 20px; right: 26px; background: rgba(255,255,255,0.12); color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 1.15rem; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; }
        .btn-close-fs:hover { background: rgba(255,255,255,0.25); }

        .pagination-bar {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 14px 10px; border-top: 1px solid #f0f2f7; flex-wrap: wrap;
            background: #fafbfd; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .pagination-bar button {

<body>

        <div class="table-wrapper" id="tableWrapper" style="display:none;">

    </div>

    <div class="guide-overlay" id="guideOverlay"><div class="guide-card" id="guideCard"></div></div>

        <button class="btn-close-fs" id="btnCloseFullscreen">✕</button>
        <img id="fullscreenImage" alt="全屏图片">
    </div>
    <div class="toast" id="toast" style="display:none;"></div>

    <script>
        (function() {
            const $ = (sel) => document.querySelector(sel);
            const guideOverlay = $('#guideOverlay');
            const guideCard = $('#guideCard');
            const hiddenFileInput = $('#hiddenFileInput');

            let allData = [], badReviewData = [], coldThawData = [], logisticsDamageData = [];
            let filteredData = [], filteredBadReviewData = [], filteredColdThawData = [], filteredLogisticsDamageData = [];
            let selectedStore = null;
            let selectedReasons = new Set();
            let currentView = 'default';
            let pageSize = 20;
            let viewCurrentPages = { default: 1, badReview: 1, coldThaw: 1, logistics: 1 };
            let allStores = [];
            let manualDataMap = new Map();
            let badReviewManualMap = new Map();
            let coldThawManualMap = new Map();
            let logisticsManualMap = new Map();
            let responsibilityReasonMap = new Map();
            let rowIdCounter = 0;
            let duplicateBatchSet = new Set();
            let currentPopup = null;
            let toastTimer;
            let previewUrls = [], previewIdx = 0;

            // 数据展示工作簿相关数据
            let dataDisplayWorkbook = null; // 存储"数据展示"工作簿
            let achievementCategories = []; // 问单类目名列表
            let shengxianLimits = {}; // 生鲜店标准上限
            let qianzhicangLimits = {}; // 前置仓标准上限
            let storeAchievements = {}; // 门店达成数据

            const TARGET_SHEET_KEYWORDS = ['问单速查','问单'];
            const TOOL_DISPLAY_NAME = '问单速查'; // 工具显示名称，用于页面标题和导出报告
            const TOOL_VERSION = 'WD1.0'; // 工具版本号
            const DATA_DISPLAY_KEYWORDS = ['数据展示'];
            const BAD_REVIEW_KEYWORDS = ['差评'];
            const IGNORE_KEYWORDS = ['sheet','数据源','汇总','模板','参数','配置','说明','备份','临时','测试'];

            // 初始化页面标题
            document.getElementById('pageTitle').textContent = TOOL_DISPLAY_NAME;
            document.getElementById('pageVersion').textContent = TOOL_VERSION;

            function findSheet(sheets, keywords) {
                for (let kw of keywords) {
                    const exact = sheets.find(s => s.trim() === kw);
                    if (exact) return exact;
                }
                for (let kw of keywords) {
                    const fuzzy = sheets.find(s => s.trim().includes(kw));
                    if (fuzzy) return fuzzy;
                }
                return null;
            }

            function shouldIgnore(sheetName) {
                const name = sheetName.trim().toLowerCase();
                for (let kw of IGNORE_KEYWORDS) if (name.includes(kw.toLowerCase())) return true;
                return false;
            }

            function getColValue(row, col) {
                if (row.hasOwnProperty(col)) return row[col];
                for (let k of Object.keys(row)) if (k.trim() === col.trim()) return row[k];
                return '';
            }

            function toast(msg) {
                const t = $('#toast');
                clearTimeout(toastTimer);
                t.textContent = msg; t.style.display = 'block'; t.style.animation = 'none';
                void t.offsetWidth;
                t.style.animation = 'toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards';
                toastTimer = setTimeout(() => t.style.display = 'none', 2300);
            }

            // 居中确认弹窗
            function showConfirmDialog(message) {
                return new Promise((resolve) => {
                    const overlay = document.createElement('div');
                    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:10000;display:flex;align-items:center;justify-content:center;';
                    const dialog = document.createElement('div');
                    dialog.style.cssText = 'background:#fff;border-radius:16px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.18);text-align:center;';
                    dialog.innerHTML = `
                        <div style="font-size:15px;font-weight:600;color:#1a1a2e;margin-bottom:18px;line-height:1.6;">${message}</div>
                        <div style="display:flex;gap:12px;justify-content:center;">
                            <button id="confirmNo" style="padding:8px 24px;border-radius:10px;border:1.5px solid #d5dcff;background:#f0f3ff;color:#4f6ef7;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;">否</button>
                            <button id="confirmYes" style="padding:8px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#4f6ef7,#6c5ce7);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;">是</button>
                        </div>
                    `;
                    overlay.appendChild(dialog);
                    document.body.appendChild(overlay);
                    dialog.querySelector('#confirmYes').addEventListener('click', () => { document.body.removeChild(overlay); resolve(true); });
                    dialog.querySelector('#confirmNo').addEventListener('click', () => { document.body.removeChild(overlay); resolve(false); });
                    overlay.addEventListener('click', (e) => { if (e.target === overlay) { document.body.removeChild(overlay); resolve(false); } });
                });
            }

            function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

            // 判断门店类型
            function getStoreType(storeName) {
                if (!storeName) return 'shengxian';
                return storeName.includes('前置仓') ? 'qianzhicang' : 'shengxian';
            }

            function getStoreTypeLabel(storeType) {
                return storeType === 'qianzhicang' ? '前置仓' : '生鲜店';
            }

            function getStoreTypeClass(storeType) {
                return storeType === 'qianzhicang' ? 'qianzhicang' : 'shengxian';
            }

            // parseDateTime 辅助函数
            function parseDateTime(str) {
                if (!str) return null;
                const s = String(str).trim();
                // 支持整数和小数Excel序列号（如46183.74715）
                if (/^\d+(\.\d+)?$/.test(s)) {
                    const num = parseFloat(s);
                    if (num > 40000 && num < 60000) {
                        return new Date((num - 25569) * 86400 * 1000);
                    }
                }
                const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[\sT]?(\d{1,2})?:(\d{1,2})?:(\d{1,2})?/);
                if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]), parseInt(m[4]||0), parseInt(m[5]||0), parseInt(m[6]||0));
                const d = new Date(s);
                if (!isNaN(d)) return d;
                return null;
            }

            // 解析数据展示工作簿
            function parseDataDisplaySheet(wb) {
                const sheetName = findSheet(wb.SheetNames, DATA_DISPLAY_KEYWORDS);
                if (!sheetName) {
                    console.log('未找到数据展示工作簿');
                    return false;
                }

                const sheet = wb.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
                
                if (!jsonData || jsonData.length < 44) {
                    console.log('数据展示工作簿数据不足');
                    return false;
                }

                // 解析结构
                // 第4行(index=3)从B列开始是问单类目名
                // 第5行(index=4)是生鲜店标准上限百分比
                // 第44行(index=43)是前置仓标准上限百分比
                // 类目读取到"虚假拒收"为止
                // B列(index=1)从第6行开始是门店名
                // 每个门店行中各列是对应类目的达成百分比

                achievementCategories = [];
                shengxianLimits = {};
                qianzhicangLimits = {};
                storeAchievements = {};

                const row4 = jsonData[3] || []; // 类目名行
                const row5 = jsonData[4] || []; // 生鲜店上限行
                const row44 = jsonData[43] || []; // 前置仓上限行

                // 读取类目名（从B列index=1开始，到"虚假拒收"为止）
                for (let colIdx = 1; colIdx < row4.length; colIdx++) {
                    const categoryName = String(row4[colIdx] || '').trim();
                    if (!categoryName) continue;
                    const catIndex = achievementCategories.length; // 当前类目的索引（0-based）
                    let sxLimit = parseFloat(row5[colIdx]) || 0;
                    let qzcLimit = parseFloat(row44[colIdx]) || 0;
                    // 百分比列（第1、4~12列，即index 0, 3~11）上限值×100
                    if (catIndex === 0 || (catIndex >= 3 && catIndex <= 11)) {
                        sxLimit = sxLimit * 100;
                        qzcLimit = qzcLimit * 100;
                    }
                    if (categoryName === '虚假拒收') {
                        achievementCategories.push(categoryName);
                        shengxianLimits[categoryName] = sxLimit;
                        qianzhicangLimits[categoryName] = qzcLimit;
                        break; // 读取到"虚假拒收"为止
                    }
                    achievementCategories.push(categoryName);
                    shengxianLimits[categoryName] = sxLimit;
                    qianzhicangLimits[categoryName] = qzcLimit;
                }

                // 读取门店数据（从第6行index=5开始，B列index=1）
                for (let rowIdx = 5; rowIdx < jsonData.length; rowIdx++) {
                    const row = jsonData[rowIdx];
                    if (!row || row.length < 2) continue;
                    
                    const storeName = String(row[1] || '').trim();
                    if (!storeName) continue;

                    const storeType = getStoreType(storeName);
                    const achievements = {};

                    for (let i = 0; i < achievementCategories.length; i++) {
                        const colIdx = i + 2; // B列(index=1)是门店名，C列(index=2)开始才是达成数据
                        const category = achievementCategories[i];
                        let value = parseFloat(row[colIdx]) || 0;
                        // 百分比列（第1、4~12列，即index 0, 3~11）数值×100
                        if (i === 0 || (i >= 3 && i <= 11)) {
                            value = value * 100;
                        }
                        achievements[category] = value;
                    }

                    storeAchievements[storeName] = {
                        type: storeType,
                        achievements: achievements
                    };
                }

                console.log('数据展示工作簿解析完成:', {
                    categories: achievementCategories,
                    storeCount: Object.keys(storeAchievements).length
                });

                return true;
            }

            // 格式化达成值：第2、3列(index 1,2)显示小数2位，其他列显示百分比3位小数
            function formatAchievementValue(value, category, catIndex) {
                if (catIndex === 1 || catIndex === 2) {
                    return value.toFixed(2);
                }
                return value.toFixed(3) + '%';
            }
            // 格式化上限值：第2、3列(index 1,2)显示小数2位，其他列显示百分比3位小数
            function formatLimitValue(value, category, catIndex) {
                if (catIndex === 1 || catIndex === 2) {
                    return value.toFixed(2);
                }
                return value.toFixed(3) + '%';
            }

            // 渲染问单达成展示区
            function renderAchievementPanel() {
                const panel = $('#achievementPanel');
                const grid = $('#achievementGrid');

                if (!selectedStore || !storeAchievements[selectedStore]) {
                    panel.style.display = 'none';
                    return;
                }

                const storeData = storeAchievements[selectedStore];
                const storeType = storeData.type;
                const limits = storeType === 'qianzhicang' ? qianzhicangLimits : shengxianLimits;
                const achievements = storeData.achievements;

                let html = '';
                achievementCategories.forEach((category, catIndex) => {
                    const actualValue = achievements[category] || 0;
                    const limitValue = limits[category] || 0;
                    const displayValue = formatAchievementValue(actualValue, category, catIndex);
                    const displayLimit = formatLimitValue(limitValue, category, catIndex);

                    // 颜色调度逻辑：超标红色，=0灰色，其他绿色
                    let statusClass = 'normal';
                    
                    if (limitValue > 0 && actualValue > limitValue) {
                        // 超标：红色
                        statusClass = 'danger';
                    } else if (actualValue === 0) {
                        // 等于0：灰色
                        statusClass = 'zero';
                    } else {
                        // 其他：绿色
                        statusClass = 'normal';
                    }

                    html += `
                        <div class="achievement-item">
                            <div class="achievement-item-name" title="${escapeHTML(category)}">${escapeHTML(category)}</div>
                            <div class="achievement-item-value ${statusClass}">${displayValue}</div>
                            <div class="achievement-item-limit">上限: ${displayLimit}</div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
                panel.style.display = 'block';
            }

            // 渲染责任分析面板
            function renderResponsibilityPanel() {
                const panel = $('#responsibilityPanel');
                const content = $('#responsibilityContent');

                // 收集当前门店的所有数据
                const allViewData = [];

                // 问单数据（排除冷链商品化冻和物流损）
                const defaultData = allData.filter(r => {
                    const reason = (getColValue(r,'问题原因名称')||'').trim();
                    return reason !== '冷链商品化冻' && reason !== '物流损';
                });
                if (selectedStore) {
                    defaultData.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore).forEach(r => allViewData.push(r));
                } else {
                    defaultData.forEach(r => allViewData.push(r));
                }

                // 冷链数据
                if (selectedStore) {
                    coldThawData.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore).forEach(r => allViewData.push(r));
                } else {
                    coldThawData.forEach(r => allViewData.push(r));
                }

                // 物流损数据
                if (selectedStore) {
                    logisticsDamageData.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore).forEach(r => allViewData.push(r));
                } else {
                    logisticsDamageData.forEach(r => allViewData.push(r));
                }

                // 差评数据
                if (selectedStore) {
                    badReviewData.filter(r => String(getColValue(r,'门店')||'').trim() === selectedStore).forEach(r => allViewData.push(r));
                } else {
                    badReviewData.forEach(r => allViewData.push(r));
                }

                if (!allViewData.length) {
                    panel.style.display = 'none';
                    return;
                }

                // 统计各类数据
                let totalNoResp = 0, totalResp = 0;
                let coldNoResp = 0, coldResp = 0;
                let logisticsNoResp = 0, logisticsResp = 0;
                let badReviewNoResp = 0, badReviewResp = 0;

                allViewData.forEach(row => {
                    const map = badReviewData.includes(row) ? badReviewManualMap :
                                coldThawData.includes(row) ? coldThawManualMap :
                                logisticsDamageData.includes(row) ? logisticsManualMap : manualDataMap;
                    const saved = map.get(row._rowId) || {};
                    const isResponsible = saved.isResponsible || '有责';
                    const isResp = isResponsible === '有责';

                    if (isResp) totalResp++; else totalNoResp++;

                    if (badReviewData.includes(row)) {
                        if (isResp) badReviewResp++; else badReviewNoResp++;
                    } else if (coldThawData.includes(row)) {
                        if (isResp) coldResp++; else coldNoResp++;
                    } else if (logisticsDamageData.includes(row)) {
                        if (isResp) logisticsResp++; else logisticsNoResp++;
                    }
                });

                // 计算有责率及颜色
                const calcRate = (noResp, resp) => {
                    const total = noResp + resp;
                    const rate = total > 0 ? (resp / total * 100) : 0;
                    const rateStr = rate.toFixed(1) + '%';
                    let color = '#27ae60';
                    if (rate >= 50) color = '#e74c3c';
                    else if (rate >= 30) color = '#f39c12';
                    return { rateStr, color };
                };

                // 构建汇总行HTML
                let summaryHTML = '<div style="background:#f0f2f7;border-radius:8px;padding:10px;margin-bottom:10px;border:1px solid #e6e8f0;">';
                summaryHTML += '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
                const totalAll = totalNoResp + totalResp;
                const totalRate = calcRate(totalNoResp, totalResp);
                summaryHTML += `<div style="flex:1;text-align:center;padding:6px;background:#fff;border-radius:6px;border:1px solid #e6e8f0;"><div style="font-size:11px;color:#5c5c78;">整体有责率</div><div style="font-size:16px;font-weight:700;color:${totalRate.color};">${totalRate.rateStr}</div><div style="font-size:10px;color:#8b8ba8;">(${totalResp}/${totalAll})</div></div>`;
                const coldTotal = coldNoResp + coldResp;
                const coldRate = calcRate(coldNoResp, coldResp);
                summaryHTML += `<div style="flex:1;text-align:center;padding:6px;background:#fff;border-radius:6px;border:1px solid #e6e8f0;"><div style="font-size:11px;color:#5c5c78;">冷链化冻</div><div style="font-size:16px;font-weight:700;color:${coldRate.color};">${coldRate.rateStr}</div><div style="font-size:10px;color:#8b8ba8;">(${coldResp}/${coldTotal})</div></div>`;
                const logisticsTotal = logisticsNoResp + logisticsResp;
                const logisticsRate = calcRate(logisticsNoResp, logisticsResp);
                summaryHTML += `<div style="flex:1;text-align:center;padding:6px;background:#fff;border-radius:6px;border:1px solid #e6e8f0;"><div style="font-size:11px;color:#5c5c78;">物流损</div><div style="font-size:16px;font-weight:700;color:${logisticsRate.color};">${logisticsRate.rateStr}</div><div style="font-size:10px;color:#8b8ba8;">(${logisticsResp}/${logisticsTotal})</div></div>`;
                const badReviewTotal = badReviewNoResp + badReviewResp;
                const badReviewRate = calcRate(badReviewNoResp, badReviewResp);
                summaryHTML += `<div style="flex:1;text-align:center;padding:6px;background:#fff;border-radius:6px;border:1px solid #e6e8f0;"><div style="font-size:11px;color:#5c5c78;">差评</div><div style="font-size:16px;font-weight:700;color:${badReviewRate.color};">${badReviewRate.rateStr}</div><div style="font-size:10px;color:#8b8ba8;">(${badReviewResp}/${badReviewTotal})</div></div>`;
                summaryHTML += '</div></div>';

                // 按问题原因名称统计
                const stats = new Map();
                // 收集每个问题原因下各条目的核实原因（用于动态默认值）
                const reasonTextMap = new Map(); // reasonName -> Map<核实原因文本, 出现次数>
                allViewData.forEach(row => {
                    let reason = '';
                    if (badReviewData.includes(row)) {
                        const tag = (getColValue(row, '评价标签') || '').trim().replace(/^\d+[:：]/, '') || '';
                        reason = tag ? '差评-' + tag : '差评';
                    } else {
                        reason = (getColValue(row, '问题原因名称') || '').trim() || '未知';
                    }
                    const map = badReviewData.includes(row) ? badReviewManualMap :
                                coldThawData.includes(row) ? coldThawManualMap :
                                logisticsDamageData.includes(row) ? logisticsManualMap : manualDataMap;
                    const saved = map.get(row._rowId) || {};
                    const isResponsible = saved.isResponsible || '有责';
                    if (!stats.has(reason)) stats.set(reason, { name: reason, noResponsible: 0, responsible: 0 });
                    const s = stats.get(reason);
                    if (isResponsible === '有责') s.responsible++; else s.noResponsible++;

                    // 收集该条目的核实原因文本
                    const reasonKey = badReviewData.includes(row) ? 'verify' :
                                      coldThawData.includes(row) ? 'verifyReason' : 'reason';
                    const reasonText = (saved[reasonKey] || '').trim();
                    if (reasonText) {
                        if (!reasonTextMap.has(reason)) reasonTextMap.set(reason, new Map());
                        const rMap = reasonTextMap.get(reason);
                        rMap.set(reasonText, (rMap.get(reasonText) || 0) + 1);
                    }
                });

                // 排序
                const sortOrder = { '冷链商品化冻': 0, '物流损': 1 };
                const sortedStats = [...stats.values()].sort((a, b) => {
                    const aOrder = sortOrder[a.name] !== undefined ? sortOrder[a.name] : (a.name.startsWith('差评') ? 999 : 2);
                    const bOrder = sortOrder[b.name] !== undefined ? sortOrder[b.name] : (b.name.startsWith('差评') ? 999 : 2);
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    const aTotal = a.noResponsible + a.responsible;
                    const bTotal = b.noResponsible + b.responsible;
                    return bTotal - aTotal;
                });

                // 构建表格HTML - 使用table-fit-container容器
                let tableHTML = '<div class="table-fit-container"><table class="responsibility-table"><thead><tr><th>问题原因名称</th><th>总计</th><th>无责</th><th>有责</th><th>有责率</th><th>核实原因</th></tr></thead><tbody>';
                sortedStats.forEach(s => {
                    const total = s.noResponsible + s.responsible;
                    const rate = total > 0 ? (s.responsible / total * 100) : 0;
                    const rateStr = rate.toFixed(1) + '%';
                    let rateColor = '#27ae60';
                    if (rate >= 50) rateColor = '#e74c3c';
                    else if (rate >= 30) rateColor = '#f39c12';
                    // 动态生成核实原因默认值：统计问单明细中各条目的核实原因
                    let savedReason = responsibilityReasonMap.get(s.name) || '';
                    if (!savedReason) {
                        const rTextMap = reasonTextMap.get(s.name);
                        if (rTextMap && rTextMap.size > 0) {
                            // 按出现次数降序排列
                            const sortedReasons = [...rTextMap.entries()].sort((a, b) => b[1] - a[1]);
                            savedReason = sortedReasons.map(([text, count]) => text + '*' + count).join('，');
                        }
                    }
                    const isBadReview = s.name.startsWith('差评');
                    const nameStyle = isBadReview ? 'color:#e74c3c;font-weight:700;' : '';
                    // 判断是用户手动值还是动态默认值
                    const isUserSaved = responsibilityReasonMap.has(s.name);
                    const inputClass = isUserSaved ? 'responsibility-input user-value' : 'responsibility-input placeholder-default';
                    const inputValue = isUserSaved ? savedReason : (savedReason || '');
                    // 动态默认值始终存入 data-default-value，用于清空恢复和导出
                    const dynamicDefault = savedReason || '';
                    tableHTML += `<tr><td style="${nameStyle}">${escapeHTML(s.name)}</td><td>${total}</td><td>${s.noResponsible}</td><td>${s.responsible}</td><td style="color:${rateColor};font-weight:700;">${rateStr}</td><td><input class="${inputClass}" data-reason="${escapeHTML(s.name)}" data-default-value="${escapeHTML(dynamicDefault)}" value="${escapeHTML(inputValue)}" placeholder="输入核实原因" /></td></tr>`;
                });
                tableHTML += '</tbody></table></div>';

                content.innerHTML = summaryHTML + tableHTML;

                // 监听输入框变化
                content.querySelectorAll('.responsibility-input').forEach(inp => {
                    // 聚焦时如果是placeholder默认值，自动清空并切换为正常输入模式
                    inp.addEventListener('focus', function() {
                        if (this.classList.contains('placeholder-default')) {
                            this.classList.remove('placeholder-default');
                            this.value = '';
                        }
                    });
                    inp.addEventListener('input', function() {
                        if (this.value.trim()) {
                            this.classList.add('user-value');
                            this.classList.remove('placeholder-default');
                            responsibilityReasonMap.set(this.dataset.reason, this.value);
                        } else {
                            this.classList.remove('user-value');
                            responsibilityReasonMap.delete(this.dataset.reason);
                        }
                    });
                    // 失焦时如果为空，从 data-default-value 恢复默认值
                    inp.addEventListener('blur', function() {
                        if (!this.value.trim() && this.dataset.defaultValue) {
                            this.value = this.dataset.defaultValue;
                            this.classList.add('placeholder-default');
                            this.classList.remove('user-value');
                        }
                    });
                });
                panel.style.display = 'block';
            }

            async function handleFileUpload(file) {
                if (!file) return;

                // 显示进度条
                const progressWrap = document.getElementById('guideProgressWrap') || document.getElementById('initProgressWrap');
                const progressFill = document.getElementById('guideProgressFill') || document.getElementById('initProgressFill');
                const progressText = document.getElementById('guideProgressText') || document.getElementById('initProgressText');
                if (progressWrap) { progressWrap.style.display = 'block'; }
                if (progressFill) { progressFill.style.width = '5%'; }
                if (progressText) { progressText.textContent = '正在读取文件...'; }

                toast('⏳ 正在解析文件...');
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        if (progressFill) progressFill.width = '15%';
                        if (progressText) progressText.textContent = '正在解析Excel...';

                        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
                        const targetSheets = wb.SheetNames.filter(s => !shouldIgnore(s));
                        const mainSheetName = findSheet(targetSheets, TARGET_SHEET_KEYWORDS);
                        const badReviewSheetName = findSheet(targetSheets, BAD_REVIEW_KEYWORDS);
                        if (!mainSheetName) { toast('❌ 未找到「问单速查」工作簿'); if (progressWrap) progressWrap.style.display = 'none'; return; }

                        if (progressFill) progressFill.style.width = '30%';
                        if (progressText) progressText.textContent = '正在解析数据展示...';

                        // 解析数据展示工作簿
                        parseDataDisplaySheet(wb);

                        if (progressFill) progressFill.style.width = '40%';
                        if (progressText) progressText.textContent = '正在加载问单速查...';

                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[mainSheetName], { defval:'', raw:false });
                        if (!rows.length) { toast('❌ 工作簿为空'); if (progressWrap) progressWrap.style.display = 'none'; return; }

                        allData = []; manualDataMap.clear();
                        const batchSize = 5000;
                        const totalRows = rows.length;
                        for (let i = 0; i < rows.length; i += batchSize) {
                            const batch = rows.slice(i, i + batchSize);
                            batch.forEach(r => {
                                const nr = {};
                                for (let k in r) nr[k.trim()] = r[k];
                                nr._rowId = rowIdCounter++;
                                allData.push(nr);
                                manualDataMap.set(nr._rowId, { isResponsible:'有责', reason:'' });
                            });
                            // 更新进度
                            const pct = 40 + Math.round(((i + batch.length) / totalRows) * 35);
                            if (progressFill) progressFill.style.width = pct + '%';
                            if (progressText) progressText.textContent = `正在处理数据... ${Math.min(100, pct)}%`;
                            await new Promise(resolve => setTimeout(resolve, 0));
                        }

                        if (progressFill) progressFill.style.width = '80%';
                        if (progressText) progressText.textContent = '正在分类数据...';

                        coldThawData = allData.filter(r => (getColValue(r,'问题原因名称')||'').trim() === '冷链商品化冻');
                        coldThawManualMap.clear();
                        coldThawData.forEach(r => coldThawManualMap.set(r._rowId, { isThawIssue:'是', storeStandard:'不规范', deliveryStandard:'不规范', orderAttr:'内环', isResponsible:'有责', verifyReason:'' }));

                        // 物流损数据
                        logisticsDamageData = allData.filter(r => (getColValue(r,'问题原因名称')||'').trim() === '物流损');
                        logisticsManualMap.clear();
                        logisticsDamageData.forEach(r => logisticsManualMap.set(r._rowId, { isResponsible:'有责', reason:'' }));

                        badReviewData = []; badReviewManualMap.clear();
                        if (badReviewSheetName) {
                            const brRows = XLSX.utils.sheet_to_json(wb.Sheets[badReviewSheetName], { defval:'', raw:false });
                            brRows.forEach(r => {
                                const nr = {};
                                for (let k in r) nr[k.trim()] = r[k];
                                nr._rowId = rowIdCounter++;
                                badReviewData.push(nr);
                                badReviewManualMap.set(nr._rowId, { isResponsible:'有责', verify:'' });
                            });
                        }

                        if (progressFill) progressFill.style.width = '95%';
                        if (progressText) progressText.textContent = '正在初始化界面...';

                        allStores = [...new Set(allData.map(r => String(getColValue(r,'门店名称')).trim()).filter(Boolean))].sort();
                        selectedReasons.clear();

                        if (progressFill) progressFill.style.width = '100%';
                        if (progressText) progressText.textContent = '加载完成！';

                        toast('✅ 成功加载 ' + allData.length + ' 条记录');

                        // 短暂延迟后隐藏进度条并弹出门店选择
                        setTimeout(() => {
                            if (progressWrap) progressWrap.style.display = 'none';
                            showStoreSelection();
                        }, 400);
                    } catch(err) { toast('❌ 解析文件失败'); console.error(err); if (progressWrap) progressWrap.style.display = 'none'; }
                };
                reader.readAsArrayBuffer(file);
            }

            function initializeMainUI() {
                currentView = 'default';
                viewCurrentPages = { default:1, badReview:1, coldThaw:1, logistics:1 };
                duplicateBatchSet.clear();
                // 切换门店时清除用户输入的数据，避免数据冗余
                manualDataMap.clear();
                badReviewManualMap.clear();
                coldThawManualMap.clear();
                logisticsManualMap.clear();
                responsibilityReasonMap.clear();
                // 重新初始化默认数据
                allData.forEach(r => manualDataMap.set(r._rowId, { isResponsible:'有责', reason:'' }));
                coldThawData.forEach(r => coldThawManualMap.set(r._rowId, { isThawIssue:'是', storeStandard:'不规范', deliveryStandard:'不规范', orderAttr:'内环', isResponsible:'有责', verifyReason:'' }));
                logisticsDamageData.forEach(r => logisticsManualMap.set(r._rowId, { isResponsible:'有责', reason:'' }));
                badReviewData.forEach(r => badReviewManualMap.set(r._rowId, { isResponsible:'有责', verify:'' }));
                updateBubbles();
                applyFilters();
                ['filterBar','tableWrapper','statsPanel','achievementPanel'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'flex';
                });
                // achievementPanel是block显示
                $('#achievementPanel').style.display = 'block';
                updateViewBubblesVisibility();
                updateViewBubbleActiveState();
                updateCurrentStoreLabel();
                updateDataSourceText();
                renderAchievementPanel();
                renderResponsibilityPanel();
            }

            function updateDataSourceText() {
                const el = $('#dataSourceText');
                if (!allData.length) { el.textContent = '时间：--'; return; }
                
                // 获取问单速查中日期列第一个非空数值
                let firstDate = '';
                for (const row of allData) {
                    const d = getColValue(row,'日期');
                    if (d) {
                        firstDate = String(d).trim();
                        break;
                    }
                }
                
                // 格式：当前时间：20260516
                el.textContent = '时间：' + (firstDate || '--');
            }

            function updateBubbles() {
                if (currentView !== 'default') { $('#bubbleContainer').innerHTML = '<span class="no-bubbles">当前视图不支持筛选</span>'; return; }
                let data = allData.filter(r => r && (getColValue(r,'问题原因名称')||'').trim() !== '冷链商品化冻' && (getColValue(r,'问题原因名称')||'').trim() !== '物流损');
                if (selectedStore) data = data.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore);
                const counts = new Map();
                data.forEach(r => { const k = (getColValue(r,'问题原因名称')||'').trim(); if (k) counts.set(k, (counts.get(k)||0)+1); });
                const reasons = [...counts.keys()].sort((a,b) => (counts.get(b)||0) - (counts.get(a)||0));
                
                const hasSelection = selectedReasons.size > 0;
                const allLabel = hasSelection ? '✕ 清空筛选' : '📋 全部';
                const allClass = hasSelection ? 'bubble-all has-selection' : 'bubble-all';
                
                let html = `<span class="bubble-tag ${allClass} ${!hasSelection?'active':''}" id="bubbleAll">${allLabel} <span class="bubble-count-inline">${data.length}条</span></span>`;
                reasons.forEach(r => html += `<span class="bubble-tag ${selectedReasons.has(r)?'active':''}" data-reason="${escapeHTML(r)}">${escapeHTML(r)} <span class="bubble-count-inline">${counts.get(r)}|${data.length?((counts.get(r)/data.length)*100).toFixed(1):0}%</span></span>`);
                $('#bubbleContainer').innerHTML = html;
                const ba = $('#bubbleAll');
                if (ba) ba.addEventListener('click', () => { selectedReasons.clear(); setCurrentPage(1); updateBubbles(); applyFilters(); });
                document.querySelectorAll('.bubble-tag[data-reason]').forEach(b => b.addEventListener('click', function() {
                    const r = this.dataset.reason;
                    selectedReasons.has(r) ? selectedReasons.delete(r) : selectedReasons.add(r);
                    setCurrentPage(1); updateBubbles(); applyFilters();
                }));
            }

            function applyFilters() {
                let data;
                if (currentView === 'default') {
                    data = [...allData];
                } else if (currentView === 'badReview') {
                    data = [...badReviewData];
                } else if (currentView === 'coldThaw') {
                    data = [...coldThawData];
                } else if (currentView === 'logistics') {
                    data = [...logisticsDamageData];
                } else {
                    data = [...allData];
                }

                if (selectedStore) {
                    const storeCol = currentView === 'badReview' ? '门店' : '门店名称';
                    data = data.filter(r => String(getColValue(r, storeCol)).trim() === selectedStore);
                }

                if (currentView === 'default') {
                    // 问单视图排除冷链和物流损
                    data = data.filter(r => {
                        const reason = (getColValue(r,'问题原因名称')||'').trim();
                        return reason !== '冷链商品化冻' && reason !== '物流损';
                    });
                    if (selectedReasons.size) data = data.filter(r => selectedReasons.has((getColValue(r,'问题原因名称')||'').trim()));
                }

                // 问单明细排序（default / logistics 共用逻辑）
                if (currentView === 'default' || currentView === 'logistics') {
                    // 第一步：统计每个问题原因名称的总数量
                    const reasonCounts = new Map();
                    data.forEach(r => {
                        const reason = (getColValue(r, '问题原因名称') || '').trim();
                        if (reason) reasonCounts.set(reason, (reasonCounts.get(reason) || 0) + 1);
                    });
                    // 第二步：统计每个批次号的总数量
                    const batchCounts = new Map();
                    data.forEach(r => {
                        const batch = String(getColValue(r, '批次号') || '').trim();
                        if (batch) batchCounts.set(batch, (batchCounts.get(batch) || 0) + 1);
                    });
                    // 第三步：排序
                    data.sort((a, b) => {
                        // 优先级1：按问题原因名称数量升序（少的在前）
                        const aReason = (getColValue(a, '问题原因名称') || '').trim();
                        const bReason = (getColValue(b, '问题原因名称') || '').trim();
                        const aReasonCount = reasonCounts.get(aReason) || 0;
                        const bReasonCount = reasonCounts.get(bReason) || 0;
                        if (aReasonCount !== bReasonCount) return aReasonCount - bReasonCount;
                        // 优先级2：同问题原因名称组内，按批次号数量降序（多的在前）
                        const aBatch = String(getColValue(a, '批次号') || '').trim();
                        const bBatch = String(getColValue(b, '批次号') || '').trim();
                        const aBatchCount = batchCounts.get(aBatch) || 0;
                        const bBatchCount = batchCounts.get(bBatch) || 0;
                        if (aBatchCount !== bBatchCount) return bBatchCount - aBatchCount;
                        // 优先级3：同批次号组内，APP退款原因和APP退款描述都为'-'的排后面
                        const aAppReason = (getColValue(a, 'app退款原因') || getColValue(a, 'APP退款原因') || '').trim();
                        const aAppDesc = (getColValue(a, 'app退款描述') || getColValue(a, 'APP退款描述') || '').trim();
                        const bAppReason = (getColValue(b, 'app退款原因') || getColValue(b, 'APP退款原因') || '').trim();
                        const bAppDesc = (getColValue(b, 'app退款描述') || getColValue(b, 'APP退款描述') || '').trim();
                        const aIsDash = (aAppReason === '-' || aAppReason === '') && (aAppDesc === '-' || aAppDesc === '');
                        const bIsDash = (bAppReason === '-' || bAppReason === '') && (bAppDesc === '-' || bAppDesc === '');
                        if (aIsDash !== bIsDash) return aIsDash ? 1 : -1;
                        return 0;
                    });
                } else if (currentView === 'badReview') {
                    data.sort((a, b) => {
                        const aDash = (getColValue(a, '评价文本') || '').trim() === '-';
                        const bDash = (getColValue(b, '评价文本') || '').trim() === '-';
                        if (aDash && !bDash) return 1;
                        if (!aDash && bDash) return -1;
                        return 0;
                    });
                }

                // 计算重复批次（所有问单明细视图）
                duplicateBatchSet.clear();
                const batchCounts = new Map();
                data.forEach(r => { const b = String(getColValue(r,'批次号')||'').trim(); if (b) batchCounts.set(b, (batchCounts.get(b)||0)+1); });
                batchCounts.forEach((v,k) => { if (v > 1) duplicateBatchSet.add(k); });

                if (currentView === 'default') filteredData = data;
                else if (currentView === 'badReview') filteredBadReviewData = data;
                else if (currentView === 'coldThaw') filteredColdThawData = data;
                else if (currentView === 'logistics') {
                    filteredLogisticsDamageData = data;
                }

                const totalPages = Math.ceil(cfd.length / pageSize) || 1;
                if (getCurrentPage() > totalPages) setCurrentPage(totalPages);
                renderTable();
                renderResponsibilityPanel();
            }

            function formatTime(str, onlyTime) {
                if (!str) return '';
                const s = String(str).trim();
                let fullStr = '';
                // 支持整数和小数Excel序列号（如46183.74715）
                if (/^\d+(\.\d+)?$/.test(s)) {
                    const num = parseFloat(s);
                    if (num > 40000 && num < 60000) {
                        const d = new Date((num - 25569) * 86400 * 1000);
                        fullStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                    }
                }
                if (!fullStr) {
                    const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[\sT]?(\d{1,2})?:(\d{1,2})?:(\d{1,2})?/);
                    if (m) {
                        fullStr = m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')+' '+(m[4]||'00').padStart(2,'0')+':'+(m[5]||'00').padStart(2,'0')+':'+(m[6]||'00').padStart(2,'0');
                    } else {
                        const d = new Date(s);
                        if (!isNaN(d)) fullStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                        else fullStr = s;
                    }
                }
                if (onlyTime) {
                    const timeMatch = fullStr.match(/(\d{2}:\d{2}:\d{2})$/);
                    return timeMatch ? timeMatch[1] : fullStr;
                }
                return fullStr;
            }

            // 一键复制冷链数据
            async function copyAllColdThawData() {
                // 检测店仓规范、配送规范、核实原因是否规范/填写
                const issues = { storeStandard: [], deliveryStandard: [], verifyReason: [] };
                filteredColdThawData.forEach(row => {
                    const ct = coldThawManualMap.get(row._rowId) || {};
                    const orderInfo = `【${getColValue(row,'门店名称')||'-'} - ${getColValue(row,'配送员名')||getColValue(row,'配送员名称')||'-'}】`;
                    if (ct.storeStandard === '不规范') {
                        issues.storeStandard.push(orderInfo);
                    }
                    if (ct.deliveryStandard === '不规范') {
                        issues.deliveryStandard.push(orderInfo);
                    }
                    if (!ct.verifyReason || !ct.verifyReason.trim()) {
                        issues.verifyReason.push(orderInfo);
                    }
                });
                // 汇总所有问题，使用一个弹窗提示
                const allIssues = [];
                if (issues.storeStandard.length > 0) allIssues.push(`店仓不规范（${issues.storeStandard.length}条）`);
                if (issues.deliveryStandard.length > 0) allIssues.push(`配送不规范（${issues.deliveryStandard.length}条）`);
                if (issues.verifyReason.length > 0) allIssues.push(`核实原因未填（${issues.verifyReason.length}条）`);

                if (allIssues.length > 0) {
                    const confirmed = await showConfirmDialog(`<div style="text-align:center;">检测到冷链数据存在以下问题：<br><b style="color:#e74c3c;">${allIssues.join('、<br>')}</b><br>是否继续复制？</div>`);
                    if (!confirmed) return;

            // 分页
            function renderPagination(cfd) {
                const bar = $('#paginationBar');
                bar.innerHTML = '';
                const totalPages = Math.ceil(cfd.length / pageSize) || 1;
                if (totalPages <= 1 && cfd.length <= pageSize) {
                    if (cfd.length) bar.innerHTML = '<span class="page-info">显示全部 ' + cfd.length + ' 条</span>';
                    return;
                }
                const cp = getCurrentPage();

                const btnFirst = document.createElement('button'); btnFirst.textContent = '首页';
                btnFirst.disabled = cp === 1;
                btnFirst.addEventListener('click', () => { setCurrentPage(1); applyFilters(); });
                bar.appendChild(btnFirst);

                const btnPrev = document.createElement('button'); btnPrev.textContent = '上一页';
                btnPrev.disabled = cp === 1;
                btnPrev.addEventListener('click', () => { setCurrentPage(cp - 1); applyFilters(); });
                bar.appendChild(btnPrev);

                let sp = Math.max(1, cp - 3), ep = Math.min(totalPages, cp + 3);
                for (let p = sp; p <= ep; p++) {
                    const bp = document.createElement('button');
                    bp.textContent = p;
                    if (p === cp) bp.classList.add('active-page');
                    bp.addEventListener('click', () => { setCurrentPage(p); applyFilters(); });
                    bar.appendChild(bp);
                }

                const btnNext = document.createElement('button'); btnNext.textContent = '下一页';
                btnNext.disabled = cp >= totalPages;
                btnNext.addEventListener('click', () => { setCurrentPage(cp + 1); applyFilters(); });
                bar.appendChild(btnNext);

                const btnLast = document.createElement('button'); btnLast.textContent = '末页';
                btnLast.disabled = cp >= totalPages;
                btnLast.addEventListener('click', () => { setCurrentPage(totalPages); applyFilters(); });
                bar.appendChild(btnLast);

                const sel = document.createElement('select');
                [10, 20, 30, 50, 100].forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = '每页' + n + '条'; if (n === pageSize) o.selected = true; sel.appendChild(o); });
                sel.addEventListener('change', () => { pageSize = +sel.value; setCurrentPage(1); applyFilters(); });
                bar.appendChild(sel);

                const info = document.createElement('span'); info.className = 'page-info';
                info.textContent = '共 ' + totalPages + ' 页 / ' + cfd.length + ' 条';
                bar.appendChild(info);
            }
