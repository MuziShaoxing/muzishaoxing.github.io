<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, viewport-fit=cover">
    <title>问单明细 · 数据分析</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        :root {
            --bg: #f0f2f7;
            --card-bg: #ffffff;
            --primary: #5568f5;
            --primary-hover: #4052d9;
            --primary-light: #eef0ff;
            --text: #1e1e2e;
            --text-secondary: #5c5c78;
            --text-muted: #8b8ba8;
            --border: #e6e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.18);
            --radius-lg: 14px;
            --radius: 10px;
            --radius-xs: 5px;
            --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            --tag-bg: #eef1ff;
            --tag-active-bg: #5568f5;
            --warning: #e67e22;
            --cold: #0ea5b9;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:15px; -webkit-text-size-adjust:100%; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { max-width: 1700px; margin: 0 auto; padding: 16px 20px 32px; }

        .page-header {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            flex-wrap: wrap; padding: 12px 0 6px; margin-bottom: 14px; position: relative;
        }
        .page-header h1 { font-size: 1.5rem; font-weight: 750; color: #1a1a2e; }

        .header-menu-btn {
            background: #fff; border: 1.5px solid #d8dce8; border-radius: 22px;
            padding: 7px 16px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: #4a4a65; transition: all var(--transition);
        }
        .header-menu-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

        .header-menu-dropdown {
            position: absolute; top: calc(100% + 10px); right: 0; background: #fff;
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl); z-index: 200; display: none; min-width: 170px; padding: 6px 0;
        }
        .header-menu-dropdown.show { display: block; animation: fadeInDown 0.18s ease; }
        @keyframes fadeInDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        .header-menu-dropdown button {
            display: block; width: 100%; padding: 11px 20px; border: none; background: none;
            text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 500; color: var(--text-secondary);
        }
        .header-menu-dropdown button:hover { background: #f5f6fc; color: var(--primary); }

        /* 统计面板 - 新布局 */
        .stats-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: stretch;
            box-shadow: var(--shadow-sm);
        }
        .stats-left, .stats-right {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; background: #fafbfd; border-radius: var(--radius); border: 1px solid #eef0f6;
            padding: 12px 8px; min-width: 80px;
        }
        .stats-label { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stats-value { font-weight: 750; font-size: 1.9rem; color: #1a1a2e; }
        .store-type-tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 12px; font-size: 0.65rem;
            font-weight: 600; margin-left: 6px; vertical-align: middle;
        }
        .store-type-tag.shengxian { background: #e0f2fe; color: #0369a1; }
        .store-type-tag.qianzhicang { background: #fef3c7; color: #92400e; }

        /* 问单达成展示区 */
        .achievement-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 14px 18px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }
        .achievement-title {
            font-size: 0.75rem; font-weight: 700; color: #1a1a2e;
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
        }
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        @media (max-width: 1200px) {
            .achievement-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .achievement-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .achievement-item {
            background: #fafbfd; border: 1px solid #eef0f6; border-radius: var(--radius);
            padding: 10px 8px; text-align: center;
            transition: all var(--transition);
        }
        .achievement-item:hover { background: #f5f7ff; border-color: #dde3ff; }
        .achievement-item-name {
            font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .achievement-item-value {
            font-size: 0.9rem; font-weight: 700;
        }
        /* 字体颜色调度：0灰色、非0黑色加粗、超标红色加粗 */
        .achievement-item-value.normal { color: #1a1a2e; } /* 非0黑色加粗 */
        .achievement-item-value.zero { color: #b0b0c0; } /* 0灰色 */
        .achievement-item-value.warning { color: #e67e22; } /* 接近上限橙色 */
        .achievement-item-value.danger { color: #c0392b; } /* 超标红色加粗 */
        .achievement-item-limit {
            font-size: 0.6rem; color: var(--text-muted); margin-top: 4px;
        }

        /* 筛选栏 - 新布局 */
        .filter-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 14px 18px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
        }
        .filter-left { flex: 1; min-width: 240px; }
        .filter-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .filter-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .filter-label-row label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

        .bubble-container { display: flex; flex-wrap: wrap; gap: 7px; }
        .bubble-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            background: var(--tag-bg);
            color: #4f6ef7;
            border: 1.5px solid transparent;
            transition: all var(--transition);
            font-weight: 550;
        }
        .bubble-tag:hover { background: #dde3ff; border-color: #c5ceff; }
        .bubble-tag.active { background: var(--tag-active-bg); color: #fff; border-color: var(--tag-active-bg); box-shadow: 0 3px 12px rgba(85,104,245,0.28); }
        .bubble-all { background: #f5f5f8; color: #666; border: 1.5px dashed #d0d5e5; }
        .bubble-all.active { background: #5c5c78; color: #fff; border-color: #5c5c78; }
        .bubble-all.has-selection { background: var(--warning); color: #fff; border-color: var(--warning); border-style: solid; }
        .bubble-count-inline { font-size: 0.65rem; opacity: 0.78; }

        /* 移动端气泡两列 */
        @media (max-width: 768px) {
            .bubble-tag {
                flex: 0 0 calc(50% - 7px);
                justify-content: center;
            }
        }

        .view-switch-bubble {
            display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 22px;
            font-size: 0.75rem; cursor: pointer; background: #f5f5f8; color: #5c5c78;
            border: 1.5px solid #d8dce8; font-weight: 600; transition: all var(--transition);
        }
        .view-switch-bubble:hover { border-color: #b0b8d0; background: #eef0f8; }
        .active-default { background: var(--primary); color: #fff; border-color: var(--primary); pointer-events: none; }
        .active-bad { background: var(--warning); color: #fff; border-color: var(--warning); pointer-events: none; }
        .active-cold { background: var(--cold); color: #fff; border-color: var(--cold); pointer-events: none; }
        .active-logistics { background: #8b5cf6; color: #fff; border-color: #8b5cf6; pointer-events: none; }
        .view-badge { font-size: 0.62rem; background: rgba(255,255,255,0.28); padding: 2px 8px; border-radius: 10px; font-weight: 650; }

        .table-wrapper {
            background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow);
            border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column;
        }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 1200px; table-layout: auto; }
        table thead { background: #f8f9fd; position: sticky; top: 0; z-index: 10; }
        table thead th {
            padding: 10px 7px; text-align: center; font-weight: 700; font-size: 0.65rem;
            text-transform: uppercase; color: #6b6b88; border-bottom: 2px solid #e2e5ee;
            white-space: nowrap; background: #f8f9fd;
        }
        table tbody td {
            padding: 8px 7px; border-bottom: 1px solid #f0f2f7; vertical-align: middle;
            color: #3a3a58; text-align: center; word-break: break-word; font-size: 0.73rem;
        }
        table tbody tr:nth-child(even) { background: #fafbfd; }
        table tbody tr:hover { background: #f3f5fb !important; }
        tr.duplicate-batch { background: #f2f2f8 !important; border-left: 3px solid #d0d5e5; }

        .cell-clickable { cursor: pointer; display: inline-block; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 4px; border-radius: 3px; font-size: 0.73rem; }
        .cell-clickable:hover { background: #eef1ff; color: var(--primary); }
        .cell-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 0.68rem; border: 1.5px solid #d5dcff; background: #f0f3ff; color: #4f6ef7; font-weight: 550; transition: all var(--transition); }
        .cell-btn:hover { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
        .cell-btn.no-data { background: #f5f5f8; color: #bbb; pointer-events: none; border-color: #e8e8ed; }
        .cell-view-btn { background: #fff8f1; color: var(--warning); border: 1.5px solid #ffe0c0; padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 0.68rem; font-weight: 550; transition: all var(--transition); display: inline-flex; align-items: center; gap: 4px; }
        .cell-view-btn:hover { background: var(--warning); color: #fff; border-color: var(--warning); }
        .cell-view-btn.no-image { background: #f5f5f8; color: #bbb; pointer-events: none; border-color: #e8e8ed; }
        .cell-select { padding: 5px 7px; border-radius: var(--radius-xs); border: 1.5px solid #d8dce8; font-size: 0.68rem; background: #fff; min-width: 65px; color: #3a3a55; cursor: pointer; }
        .cell-select:focus { border-color: var(--primary); outline: none; }
        .cell-input { padding: 5px 7px; border-radius: var(--radius-xs); border: 1.5px solid #d8dce8; font-size: 0.68rem; background: #fff; width: 100px; color: #3a3a55; }
        .cell-input:focus { border-color: var(--primary); outline: none; }

        .preview-bubble {
            position: fixed; z-index: 500; background: #fff; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.26); padding: 12px; display: none;
            max-width: 50vw; max-height: 50vh; text-align: center; animation: fadeIn 0.2s; border: 1px solid var(--border);
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .preview-bubble img { max-width: 46vw; max-height: 38vh; object-fit: contain; border-radius: 8px; }
        .preview-bubble .preview-controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 8px; }
        .preview-bubble .preview-controls button { padding: 5px 12px; border-radius: 14px; border: 1.5px solid #e6e8f0; background: #fafbfd; cursor: pointer; font-size: 0.68rem; font-weight: 600; color: #5c5c78; }
        .preview-bubble .preview-controls button:hover { background: #f0f3ff; border-color: var(--primary); color: var(--primary); }
        .preview-bubble .preview-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
        .preview-bubble .preview-counter { font-size: 0.68rem; color: var(--text-muted); min-width: 45px; }
        .preview-bubble .preview-close { position: absolute; top: 8px; right: 12px; background: rgba(0,0,0,0.06); border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.95rem; color: #888; display: flex; align-items: center; justify-content: center; }
        .preview-bubble .preview-close:hover { background: rgba(0,0,0,0.14); color: #333; }

        .fullscreen-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 600; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .fullscreen-overlay img { max-width: 96vw; max-height: 96vh; border-radius: 8px; }
        .btn-close-fs { position: fixed; top: 20px; right: 26px; background: rgba(255,255,255,0.12); color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 1.15rem; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; }
        .btn-close-fs:hover { background: rgba(255,255,255,0.25); }

        .pagination-bar {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 14px 10px; border-top: 1px solid #f0f2f7; flex-wrap: wrap;
            background: #fafbfd; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .pagination-bar button {
            padding: 6px 12px; border: 1.5px solid #e6e8f0; border-radius: var(--radius-xs);
            background: #fff; cursor: pointer; font-size: 0.72rem; transition: all var(--transition);
            font-weight: 500; color: #5c5c78; min-width: 34px;
        }
        .pagination-bar button:hover:not(:disabled) { background: #f0f3ff; border-color: #c5ceff; color: var(--primary); }
        .pagination-bar button:disabled { opacity: 0.35; cursor: not-allowed; background: #f5f5f8; }
        .pagination-bar button.active-page {
            background: var(--primary); color: #fff; border-color: var(--primary);
            pointer-events: none; box-shadow: 0 2px 10px rgba(85,104,245,0.28);
        }
        .pagination-bar select {
            padding: 6px 9px; border: 1.5px solid #e6e8f0; border-radius: var(--radius-xs);
            font-size: 0.7rem; background: #fff; color: #3a3a55; cursor: pointer;
        }
        .pagination-bar .page-info { font-size: 0.68rem; color: var(--text-muted); margin-left: 5px; }

        .guide-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
        .guide-card { background: #fff; border-radius: 20px; padding: 28px 24px 20px; max-width: 95vw; width: auto; max-height: 95vh; overflow: visible; position: relative; box-shadow: 0 26px 70px rgba(0,0,0,0.28); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .guide-title { font-size: 1.25rem; font-weight: 750; margin-bottom: 5px; text-align: center; color: #1a1a2e; }
        .guide-subtitle { font-size: 0.78rem; color: #999; text-align: center; margin-bottom: 18px; }
        .file-upload-area { border: 2.5px dashed #cbd5e1; border-radius: 16px; padding: 32px 22px; text-align: center; cursor: pointer; background: #fafbfc; margin: 8px 0; transition: all var(--transition); }
        .file-upload-area:hover { border-color: var(--primary); background: #f5f7ff; }
        .upload-text-lg { font-size: 0.95rem; font-weight: 600; color: #5c5c78; }
        .upload-hint { font-size: 0.68rem; color: #a0a3b1; text-align: center; margin-top: 8px; line-height: 1.6; }
        .upload-hint b { color: #e67e22; font-weight: 600; }
        .upload-progress-wrap { display:none; margin-top: 14px; text-align: center; }
        .upload-progress-bar { width: 100%; height: 6px; background: #eef0f6; border-radius: 3px; overflow: hidden; }
        .upload-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #5568f5, #7c8cf8); border-radius: 3px; transition: width 0.3s ease; }
        .upload-progress-text { font-size: 0.7rem; color: #8b8ba8; margin-top: 6px; }
        .guide-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #f0f2f7; }
        .guide-body { max-height: none; overflow: visible; }
        .guide-btn { padding: 9px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: 650; font-size: 0.82rem; transition: all var(--transition); }
        .guide-btn.primary { background: var(--primary); color: #fff; box-shadow: 0 3px 14px rgba(85,104,245,0.28); }
        .guide-btn.primary:hover { background: var(--primary-hover); }
        .guide-btn.secondary { background: #f0f2f8; color: #555; }
        .guide-btn.secondary:hover { background: #e4e6f0; }
        .guide-close-btn { position: absolute; top: 10px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: transparent; font-size: 1.05rem; cursor: pointer; color: #999; border: none; display: flex; align-items: center; justify-content: center; }
        .guide-close-btn:hover { background: #f0f0f5; color: #555; }

        .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #1e1e30; color: #fff; padding: 10px 24px; border-radius: 22px; z-index: 800; pointer-events: none; font-weight: 550; font-size: 0.82rem; box-shadow: 0 8px 28px rgba(0,0,0,0.30); animation: toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards; }
        @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(18px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateX(-50%) translateY(-10px); } }

        .star-rating { color: #f59e0b; letter-spacing: 2px; font-size: 0.8rem; }
        .detail-popup { position: fixed; z-index: 900; background: #fff; border: 1px solid #e6e8f0; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.16); padding: 14px 16px; max-width: 48vw; max-height: 48vh; text-align: left; animation: fadeIn 0.16s ease; font-size: 0.75rem; overflow-y: auto; }
        .detail-popup .info-row { display: flex; gap: 12px; padding: 5px 0; border-bottom: 1px solid #f4f5f9; align-items: center; }
        .detail-popup .info-row:last-child { border-bottom: none; }
        .detail-popup .info-label { font-weight: 650; color: #5a5a78; min-width: 70px; flex-shrink: 0; font-size: 0.68rem; }
        .detail-popup .info-value { word-break: break-all; flex: 1; font-size: 0.73rem; color: #2a2a40; }
        .info-copy-btn { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 12px; border: 1.5px solid #d5dcff; background: #f0f3ff; color: #4f6ef7; cursor: pointer; font-size: 0.63rem; font-weight: 550; flex-shrink: 0; }
        .info-copy-btn:hover { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
        .info-copy-btn.copied { background: #10b981; color: #fff; border-color: #10b981; pointer-events: none; }
        .detail-table { border-collapse: collapse; font-size: 0.65rem; margin-top: 8px; width: 100%; min-width: 450px; }
        .detail-table th,.detail-table td { border: 1px solid #e6e8f0; padding: 6px 5px; text-align: center; white-space: nowrap; }
        .detail-table th { background: #f8f9fd; font-weight: 700; color: #6b6b88; font-size: 0.6rem; }
        .detail-table .total-row { font-weight: 750; background: #fef9e3; }

        .empty-state { text-align: center; padding: 55px 18px; color: #b0b0c0; font-size: 0.85rem; }
        .no-bubbles { color: #b0b0c0; font-size: 0.75rem; font-style: italic; }
        .footer-note { text-align: center; color: #b8b8c8; font-size: 0.68rem; padding: 10px 0 0; margin-top: 8px; }

        @media (max-width: 768px) {
            .app-container { padding: 10px 8px 20px; }
            .page-header h1 { font-size: 1.2rem; }
            .stats-panel { flex-direction: column; gap: 8px; }
            .stats-left, .stats-right { flex: none; width: 100%; }
            table { font-size: 0.68rem; min-width: 950px; }
            table thead th { padding: 8px 5px; font-size: 0.58rem; }
            table tbody td { padding: 6px 5px; font-size: 0.63rem; }
            .detail-popup { max-width: 90vw; max-height: 50vh; }
            .preview-bubble { max-width: 90vw; max-height: 55vh; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-right { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <h1>📋 问单明细</h1>
            <div style="position:relative;">
                <button class="header-menu-btn" id="headerMenuBtn">⚙️ 菜单</button>
                <div class="header-menu-dropdown" id="headerMenuDropdown">
                    <button id="menuReupload">📂 重新上传</button>
                    <button id="menuSelectArea">🗺️ 片区筛选</button>
                    <button id="menuExportReport">📥 导出报告</button>
                </div>
            </div>
        </div>

        <!-- 统计面板 - 新布局 -->
        <div class="stats-panel" id="statsPanel" style="display:none;">
            <div class="stats-left">
                <span class="stats-value" id="currentStoreName">📍 当前门店：全部门店</span>
            </div>
            <div class="stats-right">
                <span class="stats-value" id="dataSourceText">当前时间：--</span>
            </div>
        </div>

        <!-- 问单达成展示区 -->
        <div id="achievementPanel" style="display:none; margin-bottom: 16px;"></div>

        <!-- 筛选栏 - 新布局 -->
        <div class="filter-bar" id="filterBar" style="display:none;">
            <div class="filter-left">
                <div class="filter-label-row"><label>🔍 问题原因筛选</label></div>
                <div class="bubble-container" id="bubbleContainer"><span class="no-bubbles">请先上传数据</span></div>
            </div>
            <div class="filter-right">
                <span class="view-switch-bubble active-default" id="viewBubbleDefault">📋 问单 <span class="view-badge" id="defaultBadge">0</span></span>
                <span class="view-switch-bubble" id="viewBubbleLogistics" style="display:none;">🚚 物流损 <span class="view-badge" id="logisticsBadge">0</span></span>
                <span class="view-switch-bubble" id="viewBubbleColdThaw" style="display:none;">❄️ 冷链 <span class="view-badge" id="coldThawBadge">0</span></span>
                <span class="view-switch-bubble" id="viewBubbleBadReview" style="display:none;">💬 差评 <span class="view-badge" id="badReviewBadge">0</span></span>
            </div>
        </div>

        <div class="table-wrapper" id="tableWrapper" style="display:none;">
            <div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
            <div class="pagination-bar" id="paginationBar"></div>
            <div class="empty-state" id="emptyState" style="display:none;"><p>📭 没有匹配的数据</p></div>
        </div>
        <div class="footer-note">💡 点击单元格查看完整内容 &nbsp;|&nbsp; 灰色背景为同批次号 &nbsp;|&nbsp; 可编辑责任归属与原因</div>
    </div>

    <div class="guide-overlay" id="guideOverlay"><div class="guide-card" id="guideCard"></div></div>
    <input type="file" id="hiddenFileInput" accept=".xlsx,.xls" style="display:none;">
    <div class="preview-bubble" id="previewBubble"></div>
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="btn-close-fs" id="btnCloseFullscreen">✕</button>
        <img id="fullscreenImage" alt="全屏图片">
    </div>
    <div class="toast" id="toast" style="display:none;"></div>

    <script>
        (function() {
            const $ = (sel) => document.querySelector(sel);
            const guideOverlay = $('#guideOverlay');
            const guideCard = $('#guideCard');
            const hiddenFileInput = $('#hiddenFileInput');

            let allData = [], badReviewData = [], coldThawData = [], logisticsData = [];
            let filteredData = [], filteredBadReviewData = [], filteredColdThawData = [], filteredLogisticsData = [];
            let selectedStore = null;
            let selectedReasons = new Set();
            let currentView = 'default';
            let pageSize = 20;
            let viewCurrentPages = { default: 1, badReview: 1, coldThaw: 1, logistics: 1 };
            let allStores = [];
            let selectedArea = null; // 当前选中的片区
            let areaStoreMap = {}; // 片区→门店列表映射
            let areaNames = []; // 片区名称列表（已剔除苏南片区）
            let manualDataMap = new Map();
            let badReviewManualMap = new Map();
            let coldThawManualMap = new Map();
            let rowIdCounter = 0;
            let duplicateBatchSet = new Set();
            let currentPopup = null;
            let toastTimer;
            let previewUrls = [], previewIdx = 0;

            // 数据展示工作簿相关数据
            let dataDisplayWorkbook = null; // 存储"数据展示"工作簿
            let achievementCategories = []; // 问单类目名列表（存储唯一key，如"库存缺货@0"）
            let categoryKeyToDisplay = new Map(); // key → 显示名（如"库存缺货@0" → "库存缺货"）
            let shengxianLimits = {}; // 生鲜店标准上限
            let qianzhicangLimits = {}; // 前置仓标准上限
            let storeAchievements = {}; // 门店达成数据

            const TARGET_SHEET_KEYWORDS = ['问单明细','问单'];
            const DATA_DISPLAY_KEYWORDS = ['数据展示'];
            const DAILY_REPORT_KEYWORDS = ['日报展示1'];
            const BAD_REVIEW_KEYWORDS = ['差评'];
            const IGNORE_KEYWORDS = ['sheet','数据源','汇总','模板','参数','配置','说明','备份','临时','测试'];

            function findSheet(sheets, keywords) {
                for (let kw of keywords) {
                    const exact = sheets.find(s => s.trim() === kw);
                    if (exact) return exact;
                }
                for (let kw of keywords) {
                    const fuzzy = sheets.find(s => s.trim().includes(kw));
                    if (fuzzy) return fuzzy;
                }
                return null;
            }

            function shouldIgnore(sheetName) {
                const name = sheetName.trim().toLowerCase();
                for (let kw of IGNORE_KEYWORDS) if (name.includes(kw.toLowerCase())) return true;
                return false;
            }

            function getColValue(row, col) {
                if (row.hasOwnProperty(col)) return row[col];
                for (let k of Object.keys(row)) if (k.trim() === col.trim()) return row[k];
                return '';
            }

            function toast(msg) {
                const t = $('#toast');
                clearTimeout(toastTimer);
                t.textContent = msg; t.style.display = 'block'; t.style.animation = 'none';
                void t.offsetWidth;
                t.style.animation = 'toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards';
                toastTimer = setTimeout(() => t.style.display = 'none', 2300);
            }

            function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

            // 判断门店类型
            function getStoreType(storeName) {
                if (!storeName) return 'shengxian';
                return storeName.includes('前置仓') ? 'qianzhicang' : 'shengxian';
            }

            function getStoreTypeLabel(storeType) {
                return storeType === 'qianzhicang' ? '前置仓' : '生鲜店';
            }

            function getStoreTypeClass(storeType) {
                return storeType === 'qianzhicang' ? 'qianzhicang' : 'shengxian';
            }

            // 解析数据展示工作簿
            function parseDataDisplaySheet(wb) {
                const sheetName = findSheet(wb.SheetNames, DATA_DISPLAY_KEYWORDS);
                if (!sheetName) {
                    console.log('未找到数据展示工作簿');
                    return false;
                }

                const sheet = wb.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
                
                if (!jsonData || jsonData.length < 44) {
                    console.log('数据展示工作簿数据不足');
                    return false;
                }

                // 解析结构
                // 第4行(index=3)从B列开始是问单类目名
                // 第5行(index=4)是生鲜店标准上限百分比
                // 第44行(index=43)是前置仓标准上限百分比
                // B列(index=1)从第6行开始是门店名
                // 每个门店行中各列是对应类目的达成百分比

                achievementCategories = [];
                shengxianLimits = {};
                qianzhicangLimits = {};
                storeAchievements = {};

                const row4 = jsonData[3] || []; // 类目名行
                const row5 = jsonData[4] || []; // 生鲜店上限行
                const row44 = jsonData[43] || []; // 前置仓上限行

                // ==========================================
                // 读取所有非空类目列
                // ==========================================
                achievementCategories = []; // 存储唯一key（格式：类目名@索引）
                categoryKeyToDisplay = new Map(); // key → displayName
                const categoryKeyToColIdx = {}; // key → 列索引
                const seenNames = new Set(); // 用于检测重复的类目名

                for (let colIdx = 1; colIdx < row4.length; colIdx++) {
                    const rawVal = row4[colIdx];
                    const valStr = String(rawVal || '').trim();
                    if (!valStr) continue;
                    // 跳过纯数字列（如"100"）
                    if ((valStr.split('.').length - 1 === 0) && /^\d+$/.test(valStr)) continue;
                    
                    // 生成唯一key：如果类目名重复，添加@索引后缀
                    let key = valStr;
                    if (seenNames.has(valStr)) {
                        key = valStr + '@' + colIdx;
                    } else {
                        seenNames.add(valStr);
                    }
                    
                    achievementCategories.push(key);
                    categoryKeyToDisplay.set(key, valStr);
                    categoryKeyToColIdx[key] = colIdx;
                    // 上限取当前列的值
                    shengxianLimits[key] = parseFloat(row5[colIdx]) || 0;
                    qianzhicangLimits[key] = parseFloat(row44[colIdx]) || 0;
                }

                // DEBUG
                console.log('【DEBUG】最终类目:', achievementCategories);

                // ==========================================
                // 读取门店数据
                // ==========================================
                for (let rowIdx = 5; rowIdx < jsonData.length; rowIdx++) {
                    const row = jsonData[rowIdx];
                    if (!row || row.length < 2) continue;

                    const storeName = String(row[1] || '').trim();
                    if (!storeName) continue;

                    const storeType = getStoreType(storeName);
                    const achievements = {};

                    achievementCategories.forEach((catKey, idx) => {
                        const colIdx = categoryKeyToColIdx[catKey];
                        const rawVal = row[colIdx];
                        // 前12个类目（索引0-11）：直接返回表格数值（百分比）
                        // 第13个及之后（索引12+）：整数格式
                        if (idx < 12) {
                            const val = parseFloat(rawVal) || 0;
                            achievements[catKey] = val;
                        } else {
                            const val = parseInt(rawVal) || 0;
                            achievements[catKey] = val;
                        }
                    });

                    storeAchievements[storeName] = {
                        type: storeType,
                        achievements: achievements
                    };
                }

                console.log('数据展示工作簿解析完成:', {
                    categories: achievementCategories,
                    storeCount: Object.keys(storeAchievements).length
                });

                return true;
            }

            // 解析日报展示1工作簿，提取片区→门店映射
            function parseDailyReportSheet(wb) {
                const sheetName = findSheet(wb.SheetNames, DAILY_REPORT_KEYWORDS);
                if (!sheetName) {
                    console.log('未找到日报展示1工作簿');
                    return false;
                }
                const sheet = wb.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
                if (!jsonData || jsonData.length < 2) {
                    console.log('日报展示1工作簿数据不足');
                    return false;
                }

                areaStoreMap = {};
                areaNames = [];

                // 遍历所有行，A列=片区，B列=站点（门店）
                for (let rowIdx = 0; rowIdx < jsonData.length; rowIdx++) {
                    const row = jsonData[rowIdx];
                    if (!row || row.length < 2) continue;
                    const areaName = String(row[0] || '').trim();
                    const storeName = String(row[1] || '').trim();
                    if (!areaName || !storeName) continue;
                    // 剔除"苏南片区"
                    if (areaName === '苏南片区') continue;
                    // 剔除时间值（如纯数字或日期格式）和空值
                    if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(areaName)) continue;
                    if (/^\d{1,2}[-\/]\d{1,2}$/.test(areaName)) continue;
                    if (/^\d+$/.test(areaName) && areaName.length <= 4) continue;

                    if (!areaStoreMap[areaName]) areaStoreMap[areaName] = [];
                    if (!areaStoreMap[areaName].includes(storeName)) {
                        areaStoreMap[areaName].push(storeName);
                    }
                }

                areaNames = Object.keys(areaStoreMap).sort();
                console.log('日报展示1解析完成:', { areas: areaNames, storeCount: Object.values(areaStoreMap).flat().length });
                return true;
            }

            // 获取当前片区对应的门店列表
            function getAreaStores(areaName) {
                if (!areaName) return [];
                return areaStoreMap[areaName] || [];
            }

            // 格式化达成值：根据类目索引决定格式
            // 前12个类目（索引0-11）：百分比格式（Excel存储为小数，需要乘以100）
            // 第13个及之后（索引12+）：整数格式
            function formatAchievementValue(value, category, achievements, catIndex) {
                // 第13个及之后：整数格式
                if (catIndex >= 12) {
                    return String(Math.round(value));
                }
                // 前12个：百分比格式
                // Excel存储的是小数（如0.00041表示0.041%），需要乘以100
                let percentValue = value;
                if (value < 1) {
                    percentValue = value * 100;
                }
                // 差评率/差评数用2位小数
                if (category && (category.includes('差评率') || category.includes('差评数'))) {
                    return percentValue.toFixed(2) + '%';
                }
                // 默认百分比格式
                return percentValue.toFixed(3) + '%';
            }
            // 格式化上限值：统一0.000%格式
            function formatLimitValue(value, category) {
                if (category && (category.includes('差评率') || category.includes('差评数'))) {
                    return value.toFixed(2);
                }
                return value.toFixed(3) + '%';
            }

            // 渲染问单达成展示区 - 表格模式
            function renderAchievementPanel() {
                const panel = $('#achievementPanel');

                if (!achievementCategories.length) {
                    panel.style.display = 'none';
                    return;
                }

                // 获取门店第一个类目数据用于排序（降序）
                const getFirstCategoryValue = (storeName) => {
                    const sd = storeAchievements[storeName];
                    if (!sd || !achievementCategories.length) return 0;
                    const firstCatKey = achievementCategories[0];
                    return sd.achievements[firstCatKey] || 0;
                };

                // 仅前12个百分比类目渲染热力图，后面的整数类目不渲染
                // 前置仓和生鲜店分别计算热力值
                const heatmapCount = 12;
                const catRangeSx = {}; // 生鲜店 catKey -> {min, max}
                const catRangeQzc = {}; // 前置仓 catKey -> {min, max}
                const allStores = selectedArea ? getAreaStores(selectedArea) : (selectedStore ? [selectedStore] : []);
                const sxStoresAll = allStores.filter(s => !s.includes('前置仓'));
                const qzcStoresAll = allStores.filter(s => s.includes('前置仓'));
                
                achievementCategories.forEach((ck, idx) => {
                    if (idx >= heatmapCount) return;
                    // 生鲜店
                    let valsSx = [];
                    sxStoresAll.forEach(sn => {
                        const sd = storeAchievements[sn];
                        if (!sd) return;
                        const v = sd.achievements[ck] || 0;
                        if (v > 0) valsSx.push(v);
                    });
                    catRangeSx[ck] = valsSx.length > 0 ? { min: Math.min(...valsSx), max: Math.max(...valsSx) } : { min: 0, max: 1 };
                    // 前置仓
                    let valsQzc = [];
                    qzcStoresAll.forEach(sn => {
                        const sd = storeAchievements[sn];
                        if (!sd) return;
                        const v = sd.achievements[ck] || 0;
                        if (v > 0) valsQzc.push(v);
                    });
                    catRangeQzc[ck] = valsQzc.length > 0 ? { min: Math.min(...valsQzc), max: Math.max(...valsQzc) } : { min: 0, max: 1 };
                });

                // 字体颜色+背景热力图辅助函数（工具展示页面用）
                // 热力图：仅超标红色，不超标列：最低点绿 -> 最高点黄
                // 绿(#1DB954=29,185,84) -> 黄(#FFD700=255,215,0)，超标红(#FF4500=255,69,0)
                const getValueStyle = (val, lim, ck, idx, isQzc) => {
                    if (val === 0) return 'color:#999;'; // 0值忽略，灰色
                    if (lim > 0 && val > lim) return 'background:#FF4500;color:#fff;'; // 超标红
                    if (idx < heatmapCount) {
                        const range = isQzc ? catRangeQzc[ck] : catRangeSx[ck];
                        if (!range || range.max <= range.min) return '';
                        const ratio = (val - range.min) / (range.max - range.min);
                        // 绿(29,185,84) -> 黄(255,215,0)
                        const r = Math.round(255 * ratio + 29 * (1 - ratio));
                        const g = Math.round(215 * ratio + 185 * (1 - ratio));
                        const b = Math.round(0 * ratio + 84 * (1 - ratio));
                        return 'background:rgb(' + r + ',' + g + ',' + b + ');';
                    }
                    return '';
                };

                // 生成类目表头行的HTML（共享函数）
                const buildCategoryHeaderRow = (extraCol) => {
                    let h = '<tr style="background:#f0f2fc;">';
                    if (extraCol) h += '<th style="padding:8px 6px;border:1px solid #dde3f0;text-align:center;font-weight:700;white-space:nowrap;min-width:225px;">门店</th>';
                    achievementCategories.forEach(catKey => {
                        const displayName = categoryKeyToDisplay.get(catKey) || catKey;
                        const catShort = displayName.includes('｜') ? displayName.split('｜')[0] : displayName;
                        // 表头可以换行，列宽自适应
                        h += '<th style="padding:8px 4px;border:1px solid #dde3f0;text-align:center;font-weight:700;white-space:normal;word-break:break-all;line-height:1.2;" title="' + escapeHTML(displayName) + '">' + escapeHTML(catShort) + '</th>';
                    });
                    h += '</tr>';
                    return h;
                };

                // 表格模式HTML
                let html = '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;"><span style="font-size:0.85rem;font-weight:700;color:#2d3a8c;">📊 问单达成情况</span><button id="btnShowCompliance" style="font-size:0.7rem;padding:4px 12px;border:1.5px solid #d5dcff;border-radius:12px;background:#f0f3ff;color:#4f6ef7;font-weight:600;cursor:pointer;">📋 达标查看</button></div>';

                // 片区模式：展示所有片区门店，按物流问单数据量降序排序
                if (selectedArea) {
                    const areaStores = getAreaStores(selectedArea);
                    if (!areaStores.length) {
                        panel.style.display = 'none';
                        return;
                    }
                    
                    // 按第一个类目数据降序排序
                    const sortedStores = [...areaStores].sort((a, b) => {
                        const valA = getFirstCategoryValue(a);
                        const valB = getFirstCategoryValue(b);
                        return valB - valA;
                    });

                    // 分离生鲜店和前置仓
                    const sxStores = sortedStores.filter(s => !s.includes('前置仓'));
                    const qzcStores = sortedStores.filter(s => s.includes('前置仓'));

                    // 生鲜店分组（黄色边框）
                    if (sxStores.length) {
                        html += '<div style="background:#fff;border:3px solid #f59e0b;border-radius:14px;padding:12px 14px;margin-bottom:15px;">';
                        html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.78rem;">';
                        html += '<thead>';
                        html += buildCategoryHeaderRow(true);
                        html += '</thead><tbody>';
                        sxStores.forEach(storeName => {
                            const sd = storeAchievements[storeName];
                            if (!sd) return;
                            const st = sd.type;
                            const limits = st === 'qianzhicang' ? qianzhicangLimits : shengxianLimits;
                            const ach = sd.achievements;
                            html += '<tr><td style="padding:6px;border:1px solid #eef0f6;font-weight:600;white-space:nowrap;background:#f8f9fd;">' + escapeHTML(storeName) + '</td>';
                            achievementCategories.forEach((catKey, idx) => {
                                const val = ach[catKey] || 0;
                                const lim = limits[catKey] || 0;
                                const dv = formatAchievementValue(val, catKey, ach, idx);
                                const fontStyle = getValueStyle(val, lim, catKey, idx, false); // 生鲜店
                                // 数据不换行，列宽自适应
                                html += '<td style="padding:6px 4px;border:1px solid #eef0f6;text-align:center;white-space:nowrap;' + fontStyle + '">' + dv + '</td>';
                            });
                            html += '</tr>';
                        });
                        html += '</tbody></table></div></div>';
                    }
                    // 前置仓分组（蓝色边框）
                    if (qzcStores.length) {
                        html += '<div style="background:#fff;border:3px solid #3b82f6;border-radius:14px;padding:12px 14px;">';
                        html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.78rem;">';
                        html += '<thead>';
                        html += buildCategoryHeaderRow(true);
                        html += '</thead><tbody>';
                        qzcStores.forEach(storeName => {
                            const sd = storeAchievements[storeName];
                            if (!sd) return;
                            const st = sd.type;
                            const limits = st === 'qianzhicang' ? qianzhicangLimits : shengxianLimits;
                            const ach = sd.achievements;
                            html += '<tr><td style="padding:6px;border:1px solid #eef0f6;font-weight:600;white-space:nowrap;background:#f8f9fd;">' + escapeHTML(storeName) + '</td>';
                            achievementCategories.forEach((catKey, idx) => {
                                const val = ach[catKey] || 0;
                                const lim = limits[catKey] || 0;
                                const dv = formatAchievementValue(val, catKey, ach, idx);
                                const fontStyle = getValueStyle(val, lim, catKey, idx, true); // 前置仓
                                // 数据不换行，列宽自适应
                                html += '<td style="padding:6px 4px;border:1px solid #eef0f6;text-align:center;white-space:nowrap;' + fontStyle + '">' + dv + '</td>';
                            });
                            html += '</tr>';
                        });
                        html += '</tbody></table></div></div>';
                    }
                } else if (selectedStore) {
                    // 单门店模式
                    const storeData = storeAchievements[selectedStore];
                    if (!storeData) {
                        panel.style.display = 'none';
                        return;
                    }
                    const storeType = storeData.type;
                    const storeTypeLabel = storeType === 'qianzhicang' ? '前置仓' : '生鲜店';
                    const storeTypeClass = storeType === 'qianzhicang' ? 'qianzhicang' : 'shengxian';
                    const limits = storeType === 'qianzhicang' ? qianzhicangLimits : shengxianLimits;
                    const achievements = storeData.achievements;
                    html += '<thead>';
                    html += '<tr style="background:#eef1fd;"><th colspan="' + achievementCategories.length + '" style="padding:6px 12px;font-size:0.75rem;font-weight:700;color:#2d3a8c;text-align:center;"><span class="store-type-tag ' + storeTypeClass + '">' + storeTypeLabel + '</span></th></tr>';
                    html += buildCategoryHeaderRow(false);
                    html += '</thead><tbody><tr>';
                    achievementCategories.forEach((catKey, idx) => {
                        const actualValue = achievements[catKey] || 0;
                        const limitValue = limits[catKey] || 0;
                        const displayValue = formatAchievementValue(actualValue, catKey, achievements, idx);
                        const fontStyle = getValueStyle(actualValue, limitValue, catKey, idx, storeType === 'qianzhicang');
                        // 数据不换行，列宽自适应
                        html += '<td style="padding:6px 4px;border:1px solid #eef0f6;text-align:center;white-space:nowrap;' + fontStyle + '">' + displayValue + '</td>';
                    });
                    html += '</tr></tbody>';
                } else {
                    // 全部门店模式：不显示达成情况
                    panel.style.display = 'none';
                    return;
                }

                html += '</table></div></div>';
                panel.innerHTML = html;
                panel.style.display = 'block';
                
                // 绑定达标查看按钮事件
                const complianceBtn = document.getElementById('btnShowCompliance');
                if (complianceBtn) {
                    complianceBtn.addEventListener('click', showCompliancePopup);
                }
            }

            function showCompliancePopup() {
                if (!achievementCategories.length) return;
                
                // 获取当前筛选的门店列表
                let stores = [];
                if (selectedArea) {
                    stores = getAreaStores(selectedArea);
                } else if (selectedStore) {
                    stores = [selectedStore];
                }
                if (!stores.length) return;
                
                // 按第一个类目数据降序排序
                const getFirstCategoryValue = (storeName) => {
                    const sd = storeAchievements[storeName];
                    if (!sd || !achievementCategories.length) return 0;
                    return sd.achievements[achievementCategories[0]] || 0;
                };
                
                const sortedStores = [...stores].sort((a, b) => getFirstCategoryValue(b) - getFirstCategoryValue(a));
                
                // 分离生鲜店和前置仓
                const sxStores = sortedStores.filter(s => !s.includes('前置仓'));
                const qzcStores = sortedStores.filter(s => s.includes('前置仓'));
                
                // 收集不达标门店
                const nonCompliantStores = [];
                
                // 构建达标数据
                let tableHtml = '<table style="width:auto;min-width:100%;border-collapse:collapse;font-size:0.75rem;margin-top:10px;table-layout:fixed;">';
                tableHtml += '<thead><tr style="background:#f0f2fc;"><th style="padding:6px 8px;border:1px solid #dde3f0;font-weight:700;white-space:nowrap;width:70%;">门店</th><th style="padding:6px 8px;border:1px solid #dde3f0;font-weight:700;white-space:nowrap;width:30%;">是否达标</th></tr></thead><tbody>';
                
                const buildRows = (storeList, limitsMap) => {
                    storeList.forEach(storeName => {
                        const sd = storeAchievements[storeName];
                        if (!sd) return;
                        const limits = limitsMap;
                        const ach = sd.achievements;
                        const firstCatKey = achievementCategories[0];
                        const val = ach[firstCatKey] || 0;
                        const lim = limits[firstCatKey] || 0;
                        const isOver = lim > 0 && val > lim;
                        if (isOver) nonCompliantStores.push(storeName);
                        const statusHtml = isOver 
                            ? '<span style="color:#c0392b;font-weight:700;">❌ 不达标</span>' 
                            : '<span style="color:#27ae60;font-weight:700;">✅ 达标</span>';
                        tableHtml += `<tr><td style="padding:6px 8px;border:1px solid #eef0f6;font-weight:600;background:#f8f9fd;">${escapeHTML(storeName)}</td><td style="padding:6px 8px;border:1px solid #eef0f6;text-align:center;">${statusHtml}</td></tr>`;
                    });
                };
                
                buildRows(sxStores, shengxianLimits);
                buildRows(qzcStores, qianzhicangLimits);
                
                tableHtml += '</tbody></table>';
                
                // 构建纯文本用于复制（全部）- 仅门店名和达标情况，不包含表头
                let plainTextAll = '';
                const buildPlainRows = (storeList, limitsMap) => {
                    storeList.forEach(storeName => {
                        const sd = storeAchievements[storeName];
                        if (!sd) return;
                        const limits = limitsMap;
                        const ach = sd.achievements;
                        const firstCatKey = achievementCategories[0];
                        const val = ach[firstCatKey] || 0;
                        const lim = limits[firstCatKey] || 0;
                        const isOver = lim > 0 && val > lim;
                        plainTextAll += `${storeName}\t${isOver ? '不达标' : '达标'}\n`;
                    });
                };
                
                buildPlainRows(sxStores, shengxianLimits);
                buildPlainRows(qzcStores, qianzhicangLimits);
                
                // 构建不达标门店纯文本
                const plainTextNonCompliant = '不达标门店\n' + nonCompliantStores.join('\n');
                
                const bodyHTML = `
                    <div>
                        ${tableHtml}
                    </div>
                    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;">
                        <button id="btnCopyNonCompliant" style="font-size:0.75rem;padding:6px 16px;border:none;border-radius:10px;background:#c0392b;color:white;font-weight:600;cursor:pointer;">📋 一键复制不达标门店</button>
                        <button id="btnCopyCompliance" style="font-size:0.75rem;padding:6px 16px;border:none;border-radius:10px;background:#4f6ef7;color:white;font-weight:600;cursor:pointer;">📋 一键复制全部</button>
                    </div>
                `;
                
                openGuideView('📋 达标情况查看', '第一个类目标红=不达标，其他达标', bodyHTML, '<button class="guide-btn secondary" onclick="document.getElementById(\'guideOverlay\').style.display=\'none\'">关闭</button>');
                
                // 弹窗已自适应内容，无需额外调整
                // 但针对达标查看，确保弹窗足够宽以显示所有数据
                setTimeout(() => {
                    const guideCard = document.querySelector('.guide-card');
                    if (guideCard) {
                        guideCard.style.maxWidth = '95vw';
                        guideCard.style.maxHeight = '95vh';
                    }
                }, 50);
                
                // 绑定复制全部按钮
                setTimeout(() => {
                    const copyBtn = document.getElementById('btnCopyCompliance');
                    if (copyBtn) {
                        copyBtn.addEventListener('click', () => {
                            doCopy(plainTextAll, copyBtn, '📋 一键复制全部');
                        });
                    }
                    
                    // 绑定复制不达标门店按钮
                    const copyNonBtn = document.getElementById('btnCopyNonCompliant');
                    if (copyNonBtn) {
                        if (nonCompliantStores.length === 0) {
                            copyNonBtn.style.opacity = '0.4';
                            copyNonBtn.style.cursor = 'not-allowed';
                            copyNonBtn.title = '暂无不达标门店';
                        } else {
                            copyNonBtn.addEventListener('click', () => {
                                doCopy(plainTextNonCompliant, copyNonBtn, '📋 一键复制不达标门店');
                            });
                        }
                    }
                }, 100);
            }

            function doCopy(text, btn, originalText) {
                navigator.clipboard.writeText(text).then(() => {
                    toast('✅ 已复制到剪贴板');
                    btn.textContent = '✅ 已复制';
                    btn.style.background = '#27ae60';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '';
                    }, 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.cssText = 'position:fixed;left:-9999px;';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    toast('✅ 已复制到剪贴板');
                    btn.textContent = '✅ 已复制';
                    btn.style.background = '#27ae60';
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '';
                    }, 2000);
                });
            }

            async function handleFileUpload(file) {
                if (!file) return;

                // 显示进度条
                const progressWrap = document.getElementById('guideProgressWrap') || document.getElementById('initProgressWrap');
                const progressFill = document.getElementById('guideProgressFill') || document.getElementById('initProgressFill');
                const progressText = document.getElementById('guideProgressText') || document.getElementById('initProgressText');
                if (progressWrap) { progressWrap.style.display = 'block'; }
                if (progressFill) { progressFill.style.width = '5%'; }
                if (progressText) { progressText.textContent = '正在读取文件...'; }

                toast('⏳ 正在解析文件...');
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        if (progressFill) progressFill.style.width = '15%';
                        if (progressText) progressText.textContent = '正在解析Excel...';

                        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
                        const targetSheets = wb.SheetNames.filter(s => !shouldIgnore(s));
                        const mainSheetName = findSheet(targetSheets, TARGET_SHEET_KEYWORDS);
                        const badReviewSheetName = findSheet(targetSheets, BAD_REVIEW_KEYWORDS);
                        if (!mainSheetName) { toast('❌ 未找到「问单明细」工作簿'); if (progressWrap) progressWrap.style.display = 'none'; return; }

                        if (progressFill) progressFill.style.width = '30%';
                        if (progressText) progressText.textContent = '正在解析数据展示...';

                        // 解析数据展示工作簿
                        parseDataDisplaySheet(wb);

                        // 解析日报展示1工作簿（片区映射）
                        parseDailyReportSheet(wb);

                        if (progressFill) progressFill.style.width = '40%';
                        if (progressText) progressText.textContent = '正在加载问单明细...';

                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[mainSheetName], { defval:'', raw:false });
                        if (!rows.length) { toast('❌ 工作簿为空'); if (progressWrap) progressWrap.style.display = 'none'; return; }

                        allData = []; manualDataMap.clear();
                        const batchSize = 5000;
                        const totalRows = rows.length;
                        for (let i = 0; i < rows.length; i += batchSize) {
                            const batch = rows.slice(i, i + batchSize);
                            batch.forEach(r => {
                                const nr = {};
                                for (let k in r) nr[k.trim()] = r[k];
                                nr._rowId = rowIdCounter++;
                                allData.push(nr);
                                manualDataMap.set(nr._rowId, { responsible:'仓责', reason:'' });
                            });
                            // 更新进度
                            const pct = 40 + Math.round(((i + batch.length) / totalRows) * 35);
                            if (progressFill) progressFill.style.width = pct + '%';
                            if (progressText) progressText.textContent = `正在处理数据... ${Math.min(100, pct)}%`;
                            await new Promise(resolve => setTimeout(resolve, 0));
                        }

                        if (progressFill) progressFill.style.width = '80%';
                        if (progressText) progressText.textContent = '正在分类数据...';

                        coldThawData = allData.filter(r => (getColValue(r,'问题原因名称')||'').trim() === '冷链商品化冻');
                        coldThawManualMap.clear();
                        coldThawData.forEach(r => coldThawManualMap.set(r._rowId, { isThawIssue:'是', deliveryStandard:'规范', verifyReason:'' }));

                        logisticsData = allData.filter(r => (getColValue(r,'问题原因名称')||'').trim() === '物流损');

                        badReviewData = []; badReviewManualMap.clear();
                        if (badReviewSheetName) {
                            const brRows = XLSX.utils.sheet_to_json(wb.Sheets[badReviewSheetName], { defval:'', raw:false });
                            brRows.forEach(r => {
                                const nr = {};
                                for (let k in r) nr[k.trim()] = r[k];
                                nr._rowId = rowIdCounter++;
                                badReviewData.push(nr);
                                badReviewManualMap.set(nr._rowId, { responsible:'无责', verify:'' });
                            });
                        }

                        if (progressFill) progressFill.style.width = '95%';
                        if (progressText) progressText.textContent = '正在初始化界面...';

                        allStores = [...new Set(allData.map(r => String(getColValue(r,'门店名称')).trim()).filter(Boolean))].sort();
                        selectedReasons.clear();

                        if (progressFill) progressFill.style.width = '100%';
                        if (progressText) progressText.textContent = '加载完成！';

                        toast('✅ 成功加载 ' + allData.length + ' 条记录');

                        // 短暂延迟后隐藏进度条并弹出门店选择
                        setTimeout(() => {
                            if (progressWrap) progressWrap.style.display = 'none';
                            showAreaQuickSelect();
                        }, 400);
                    } catch(err) { toast('❌ 解析文件失败'); console.error(err); if (progressWrap) progressWrap.style.display = 'none'; }
                };
                reader.readAsArrayBuffer(file);
            }

            function initializeMainUI() {
                currentView = 'default';
                viewCurrentPages = { default:1, badReview:1, coldThaw:1, logistics:1 };
                duplicateBatchSet.clear();
                updateBubbles();
                applyFilters();
                ['filterBar','tableWrapper','statsPanel'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'flex';
                });
                // 片区模式下达成面板依旧显示（多门店紧凑布局由renderAchievementPanel处理）
                const achPanel = document.getElementById('achievementPanel');
                if (achPanel) achPanel.style.display = 'block';
                updateViewBubblesVisibility();
                updateViewBubbleActiveState();
                updateCurrentStoreLabel();
                updateDataSourceText();
                renderAchievementPanel();
            }

            function updateDataSourceText() {
                const el = $('#dataSourceText');
                if (!allData.length) { el.textContent = '当前时间：--'; return; }
                
                // 获取问单明细中日期列第一个非空数值
                let firstDate = '';
                for (const row of allData) {
                    const d = getColValue(row,'日期');
                    if (d) {
                        firstDate = String(d).trim();
                        break;
                    }
                }
                
                // 格式：当前时间：20260516
                el.textContent = '当前时间：' + (firstDate || '--');
            }

            function updateBubbles() {
                if (currentView !== 'default') { $('#bubbleContainer').innerHTML = '<span class="no-bubbles">当前视图不支持筛选</span>'; return; }
                // 问单视图：排除冷链商品化冻和物流损
                let data = allData.filter(r => r && (getColValue(r,'问题原因名称')||'').trim() !== '冷链商品化冻' && (getColValue(r,'问题原因名称')||'').trim() !== '物流损');
                // 门店筛选
                if (selectedStore) {
                    data = data.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore);
                } else if (selectedArea) {
                    // 片区筛选：获取当前片区对应的门店集合
                    const areaStores = getAreaStores(selectedArea);
                    const areaStoreSet = new Set(areaStores);
                    data = data.filter(r => areaStoreSet.has(String(getColValue(r,'门店名称')).trim()));
                }
                const counts = new Map();
                data.forEach(r => { const k = (getColValue(r,'问题原因名称')||'').trim(); if (k) counts.set(k, (counts.get(k)||0)+1); });
                const reasons = [...counts.keys()].sort((a,b) => (counts.get(b)||0) - (counts.get(a)||0));
                
                const hasSelection = selectedReasons.size > 0;
                const allLabel = hasSelection ? '✕ 清空筛选' : '📋 全部';
                const allClass = hasSelection ? 'bubble-all has-selection' : 'bubble-all';
                
                let html = `<span class="bubble-tag ${allClass} ${!hasSelection?'active':''}" id="bubbleAll">${allLabel} <span class="bubble-count-inline">${data.length}条</span></span>`;
                reasons.forEach(r => html += `<span class="bubble-tag ${selectedReasons.has(r)?'active':''}" data-reason="${escapeHTML(r)}">${escapeHTML(r)} <span class="bubble-count-inline">${counts.get(r)}|${data.length?((counts.get(r)/data.length)*100).toFixed(1):0}%</span></span>`);
                $('#bubbleContainer').innerHTML = html;
                const ba = $('#bubbleAll');
                if (ba) ba.addEventListener('click', () => { selectedReasons.clear(); setCurrentPage(1); updateBubbles(); applyFilters(); });
                document.querySelectorAll('.bubble-tag[data-reason]').forEach(b => b.addEventListener('click', function() {
                    const r = this.dataset.reason;
                    selectedReasons.has(r) ? selectedReasons.delete(r) : selectedReasons.add(r);
                    setCurrentPage(1); updateBubbles(); applyFilters();
                }));
            }

            function applyFilters() {
                let data;
                if (currentView === 'default') {
                    data = [...allData];
                } else if (currentView === 'badReview') {
                    data = [...badReviewData];
                } else if (currentView === 'logistics') {
                    data = [...logisticsData];
                } else {
                    data = [...coldThawData];
                }

                // 片区筛选：获取当前片区对应的门店集合
                let areaStoreSet = null;
                if (selectedArea) {
                    const areaStores = getAreaStores(selectedArea);
                    areaStoreSet = new Set(areaStores);
                }

                // 门店筛选：优先单门店，其次片区
                if (selectedStore) {
                    data = data.filter(r => String(getColValue(r, currentView==='badReview'?'门店':'门店名称')).trim() === selectedStore);
                } else if (areaStoreSet) {
                    data = data.filter(r => {
                        const storeName = String(getColValue(r, currentView==='badReview'?'门店':'门店名称')).trim();
                        return areaStoreSet.has(storeName);
                    });
                }
                if (currentView === 'default') {
                    // 问单视图：排除冷链商品化冻和物流损
                    data = data.filter(r => {
                        const reason = (getColValue(r,'问题原因名称')||'').trim();
                        return reason !== '冷链商品化冻' && reason !== '物流损';
                    });
                    if (selectedReasons.size) data = data.filter(r => selectedReasons.has((getColValue(r,'问题原因名称')||'').trim()));
                }

                // 全局后置排序：先生鲜店，后前置仓
                data.sort((a, b) => {
                    // 门店类型排序：生鲜店(0) < 前置仓(1)
                    const aStoreName = String(getColValue(a, currentView==='badReview'?'门店':'门店名称') || '').trim();
                    const bStoreName = String(getColValue(b, currentView==='badReview'?'门店':'门店名称') || '').trim();
                    const aIsQZC = aStoreName.includes('前置仓') ? 1 : 0;
                    const bIsQZC = bStoreName.includes('前置仓') ? 1 : 0;
                    if (aIsQZC !== bIsQZC) return aIsQZC - bIsQZC;

                    if (currentView === 'default' || currentView === 'coldThaw' || currentView === 'logistics') {
                        const aReason = (getColValue(a, 'app退款原因') || getColValue(a, 'APP退款原因') || '').trim();
                        const bReason = (getColValue(b, 'app退款原因') || getColValue(b, 'APP退款原因') || '').trim();
                        const aDesc = (getColValue(a, 'app退款描述') || getColValue(a, 'APP退款描述') || '').trim();
                        const bDesc = (getColValue(b, 'app退款描述') || getColValue(b, 'APP退款描述') || '').trim();
                        const aDoubleDash = aReason === '-' && aDesc === '-';
                        const bDoubleDash = bReason === '-' && bDesc === '-';
                        const aDescDash = aDesc === '-' && !aDoubleDash;
                        const bDescDash = bDesc === '-' && !bDoubleDash;
                        // 双"-"排最后，仅描述"-"排中间，其余排最前
                        const aPri = aDoubleDash ? 2 : (aDescDash ? 1 : 0);
                        const bPri = bDoubleDash ? 2 : (bDescDash ? 1 : 0);
                        if (aPri !== bPri) return aPri - bPri;
                    } else if (currentView === 'badReview') {
                        const aDash = (getColValue(a, '评价文本') || '').trim() === '-';
                        const bDash = (getColValue(b, '评价文本') || '').trim() === '-';
                        if (aDash && !bDash) return 1;
                        if (!aDash && bDash) return -1;
                    }
                    // 默认按批次号排序（仅限问单视图和物流损视图）
                    if (currentView === 'default' || currentView === 'logistics') {
                        const aBatch = String(getColValue(a, '批次号') || '').trim();
                        const bBatch = String(getColValue(b, '批次号') || '').trim();
                        return aBatch.localeCompare(bBatch);
                    }
                    return 0;
                });

                // 计算重复批次（仅问单视图和物流损视图）
                if (currentView === 'default' || currentView === 'logistics') {
                    duplicateBatchSet.clear();
                    const batchCounts = new Map();
                    data.forEach(r => { const b = String(getColValue(r,'批次号')||'').trim(); if (b) batchCounts.set(b, (batchCounts.get(b)||0)+1); });
                    batchCounts.forEach((v,k) => { if (v > 1) duplicateBatchSet.add(k); });
                }

                if (currentView === 'default') filteredData = data;
                else if (currentView === 'badReview') filteredBadReviewData = data;
                else if (currentView === 'logistics') filteredLogisticsData = data;
                else filteredColdThawData = data;

                const cfd = currentView === 'default' ? filteredData : (currentView === 'badReview' ? filteredBadReviewData : (currentView === 'logistics' ? filteredLogisticsData : filteredColdThawData));
                const totalPages = Math.ceil(cfd.length / pageSize) || 1;
                if (getCurrentPage() > totalPages) setCurrentPage(totalPages);
                renderTable();
            }

            function createTimeCell(row) {
                const td = document.createElement('td');
                const fields = ['批次生成时间','拣货完成时间','打包完成时间','揽收时间','最晚送达时间','签收时间'];
                const values = fields.map(f => formatTime(getColValue(row,f)||''));
                if (values.some(v => String(v).trim())) {
                    const btn = document.createElement('span'); btn.className='cell-btn'; btn.textContent='🕐 查看';

                }

            // 冷链视图时间戳单元格（显示6个时间节点+间隔计算）
            function createTimestampCell(row) {
                const td = document.createElement('td');
                const fields = ['批次生成时间','拣货完成时间','打包完成时间','揽收时间','签收时间','最晚送达时间'];
                const rawValues = fields.map(f => getColValue(row,f)||'');
                const formattedValues = rawValues.map(v => formatTime(v));
                if (formattedValues.some(v => String(v).trim())) {
                    const btn = document.createElement('span'); btn.className='cell-btn'; btn.textContent='🕐 查看';
                    // 计算签收时间与揽收时间的间隔，大于18分钟则按钮变红色边框
                    const qianshouTime = formattedValues[4]; // 签收时间
                    const lanshouTime = formattedValues[3]; // 揽收时间
                    if (qianshouTime && lanshouTime && qianshouTime !== '-' && lanshouTime !== '-') {
                        const qianshouDate = new Date(qianshouTime);
                        const lanshouDate = new Date(lanshouTime);
                        if (!isNaN(qianshouDate) && !isNaN(lanshouDate)) {
                            const diffMs = qianshouDate - lanshouDate;
                            const diffMins = Math.round(diffMs / 60000);
                            if (diffMins > 18) {
                                btn.style.border = '2px solid #ef4444';
                                btn.style.color = '#ef4444';
                            }
                        }
                    }
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        showTimestampPopup(btn, fields, formattedValues);
                    });
                    td.appendChild(btn);
                } else {
                    const btn = document.createElement('span'); btn.className='cell-btn no-data'; btn.textContent='无数据'; td.appendChild(btn);
                }
                return td;
            }
            // 显示时间戳弹窗（含间隔计算）
            function showTimestampPopup(anchor, fields, values) {
                closeAllPopups();
                // 计算间隔时间
                const intervals = ['-'];
                for (let i = 1; i < values.length; i++) {
                    const prev = values[i-1];
                    const curr = values[i];
                    if (prev && curr && prev !== '-' && curr !== '-') {
                        const prevDate = new Date(prev);
                        const currDate = new Date(curr);
                        if (!isNaN(prevDate) && !isNaN(currDate)) {
                            const diffMs = currDate - prevDate;
                            const diffMins = Math.round(diffMs / 60000);
                            if (diffMins >= 0) {
                                const hours = Math.floor(diffMins / 60);
                                const mins = diffMins % 60;
                                if (hours > 0) {
                                    intervals.push(`${hours}时${mins}分`);
                                } else {
                                    intervals.push(`${mins}分钟`);
                                }
                            } else {
                                intervals.push('-');
                            }
                        } else {
                            intervals.push('-');
                        }
                    } else {
                        intervals.push('-');
                    }
                }
                // 构建表格HTML（无表头，三列：时间类型、时间、间隔）
                let tableHtml = '<table class="detail-table" style="min-width:320px;"><tbody>';
                for (let i = 0; i < fields.length; i++) {
                    tableHtml += '<tr>';
                    tableHtml += '<td style="text-align:left;font-weight:600;">' + escapeHTML(fields[i]) + '</td>';
                    tableHtml += '<td>' + escapeHTML(values[i]||'-') + '</td>';
                    tableHtml += '<td style="color:#666;">⏱️ ' + escapeHTML(intervals[i]) + '</td>';
                    tableHtml += '</tr>';
                }
                tableHtml += '</tbody></table>';
                const popup = document.createElement('div');
                popup.className = 'detail-popup';
                popup.innerHTML = tableHtml;
                document.body.appendChild(popup);
                positionPopup(anchor, popup);
                currentPopup = popup;
            }
            function formatTime(str) {
                if (!str) return '';
                const s = String(str).trim();
                if (/^\d+$/.test(s) && parseInt(s) > 40000 && parseInt(s) < 60000) {
                    const d = new Date((parseInt(s) - 25569) * 86400 * 1000);
                    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                }
                const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[\sT]?(\d{1,2})?:(\d{1,2})?:(\d{1,2})?/);
                if (m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')+' '+(m[4]||'00').padStart(2,'0')+':'+(m[5]||'00').padStart(2,'0')+':'+(m[6]||'00').padStart(2,'0');
                const d = new Date(s);
                if (!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                return s;
            }
            function createStarCell(row) {
                const td = document.createElement('td');

                if (!isNaN(v) && v > 0) td.innerHTML = '<span class="star-rating">'+'★'.repeat(v)+'☆'.repeat(5-v)+'</span>';
                else td.textContent = getColValue(row,'评价星级')||'-';

            function createSelectCell(row, key, options, map) {
                const td = document.createElement('td');

                const saved = map.get(row._rowId) || {};
                sel.value = saved[key] || options[0];
                sel.addEventListener('change', () => { saved[key] = sel.value; map.set(row._rowId, saved); });

            function createInputCell(row, key, map) {
                const td = document.createElement('td');
                const inp = document.createElement('input'); inp.type='text'; inp.className='cell-input';
