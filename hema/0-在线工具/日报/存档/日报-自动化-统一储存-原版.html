                    let inner, tdClass = '', tdStyle = '';
                    if (ha) {
                        if (!working) { tdClass = 'non-working-bg'; inner = cnt > 0 ? '<span style="font-weight:700;">' + cnt + '</span>' : '<span style="visibility:hidden;">-</span>'; }
                        else if (cnt === 0) { tdStyle = 'background-color:' + typeBgColor + ' !important;'; inner = '<span class="zero-mark">' + (CONFIG.zeroMarkText || '✘') + '</span>'; }
                        else { tdStyle = 'background-color:' + typeBgColor + ' !important;'; inner = cnt >= avg ? '<span style="font-weight:700;">' + cnt + '</span>' : '<span class="eff-low">' + cnt + '</span>'; }
                    } else {
                        if (cnt === 0) inner = '<span style="visibility:hidden;">-</span>';
                        else inner = cnt >= avg ? '<span style="font-weight:700;">' + cnt + '</span>' : '<span class="eff-low">' + cnt + '</span>';
                    }
                    cells += '<td class="' + tdClass + '" style="' + tdStyle + '">' + inner + '</td>';
                });
                cells += '<td style="font-weight:700;">' + r.total + '</td>';
                body += '<tr>' + cells + '</tr>';
            });
            RTB.innerHTML = body;
        }

        function renderBlockTable(stats) {
            const { blocks, blockOrders, totalOrders, riderRows } = stats || {};
            if (!blocks?.length) return;
            let thead = '<tr><th>区块</th><th>总计</th>';
            blocks.forEach(b => thead += '<th>' + b + '</th>');
            thead += '</tr>';
            RTH.innerHTML = thead;
            const percentages = blockOrders.map(v => totalOrders ? ((v/totalOrders)*100).toFixed(2) + '%' : '0.00%');
            let body = '<tr class="summary-row"><td style="background:' + (CONFIG.colorBlockSummaryBg || '#fde68a') + ';">单量</td><td>' + totalOrders + '</td>' + blockOrders.map(v => '<td style="font-weight:700;">' + v + '</td>').join('') + '</tr>';
            body += '<tr class="summary-row"><td style="background:' + (CONFIG.colorBlockSubSummaryBg || '#fef9e3') + ';">占比</td><td>' + (totalOrders ? ((riderRows.reduce((s,r)=>s+r.total,0)/totalOrders)*100).toFixed(2)+'%' : '0.00%') + '</td>' + percentages.map(p => '<td>' + p + '</td>').join('') + '</tr>';
            body += '<tr class="separator-row"><td>────────</td><td>─</td>' + blocks.map(() => '<td>─</td>').join('') + '</tr>';
            const tbc = new Map(), tto = new Map();
            for (let rider of riderRows) {
                const type = riderTypeMap.get(rider.rider);
                if (!type) continue;
                if (!tbc.has(type)) { tbc.set(type, Array(blocks.length).fill(0)); tto.set(type, 0); }
                const arr = tbc.get(type);
                rider.counts.forEach((cnt,i) => arr[i] += cnt);
                tto.set(type, tto.get(type) + rider.total);
            }
            if (tbc.size > 0) {
                const types = Array.from(tbc.keys()).sort();
                for (let type of types) {
                    const counts = tbc.get(type);
                    let row = '<td style="background:' + (CONFIG.colorBlockTypeBg || '#fef3c7') + ';font-weight:700;">' + type + '</td>';
                    let tt = tto.get(type);
                    let tp = totalOrders ? ((tt/totalOrders)*100).toFixed(2) + '%' : '0.00%';
                    row += '<td style="position:relative;background:' + (CONFIG.colorBlockTypeBg || '#fef3c7') + ';"><div class="type-block-cell"><span class="percent">' + tp + '</span><span class="corner-abs">' + tt + '</span></div></td>';
                    counts.forEach((cnt,i) => {
                        let bt = blockOrders[i] || 1;
                        let p = ((cnt/bt)*100).toFixed(2) + '%';
                        row += '<td style="position:relative;background:' + (CONFIG.colorBlockTypeBg || '#fef3c7') + ';"><div class="type-block-cell"><span class="percent">' + p + '</span><span class="corner-abs">' + cnt + '</span></div></td>';
                    });
                    body += '<tr>' + row + '</tr>';
                }
                body += '<tr class="separator-row"><td colspan="' + (blocks.length+2) + '"></td></tr>';
            }
            let hr = '<td style="background:' + (CONFIG.colorBlockHeaderBg || '#f1f5f9') + ';font-weight:700;">姓名</td><td style="background:' + (CONFIG.colorBlockHeaderBg || '#f1f5f9') + ';font-weight:700;">单量</td>';
            blocks.forEach(b => hr += '<td style="background:' + (CONFIG.colorBlockHeaderBg || '#f1f5f9') + ';font-weight:700;">' + b + '</td>');
            body += '<tr>' + hr + '</tr>';
            let srr = [...riderRows];
            if (heatSortState.ci !== null) {
                srr = sortByColumn(srr, heatSortState.ci, heatSortState.asc, {
                    0: r => getPureName(r.rider), 1: r => r.total,
                    ...Object.fromEntries(blocks.map((_,i) => [i+2, r => r.counts[i]]))
                });
            } else { srr.sort((a,b) => b.total - a.total); }
            srr.forEach(r => {
                const indexed = r.counts.map((v,i) => ({val:v, idx:i})).sort((a,b) => b.val - a.val);
                const rm = new Map(); let rank = 1;
                for (let item of indexed) { if (item.val <= 0) break; rm.set(item.idx, rank); rank++; }
                let cells = '<td>' + getRiderDisplayHTML(r.rider) + '</td><td>' + r.total + '</td>';
                r.counts.forEach((cnt,i) => {
                    if (cnt === 0) cells += '<td></td>';
                    else { const rk = rm.get(i) || 5; cells += '<td>' + renderRankMedal(cnt, rk) + '</td>'; }
                });
                body += '<tr>' + cells + '</tr>';
            });
            RTB.innerHTML = body;
        }

        function renderTypeTable(ts, bts) {
            if (!ts?.typeRows?.length) return;
            const { slots, typeRows } = ts;
            let h = '<tr><th>骑手类型 / 区块</th>';
            slots.forEach(s => h += '<th><span class="slot-start">' + s.startHour.toString().padStart(2,'0') + ':' + s.startMin.toString().padStart(2,'0') + '</span><span class="slot-end">↓' + s.endHour.toString().padStart(2,'0') + ':' + s.endMin.toString().padStart(2,'0') + '</span></th>');
            h += '<th>总单量</th><th>总人数</th></tr>';
            RTH.innerHTML = h;
            let body = '';
            let str = [...typeRows];
            let sbr = bts ? [...bts.blockRows] : [];
            if (heatSortState.ci !== null) {
                const idx = heatSortState.ci;
                const sorter = (a,b) => {
                    let va, vb;
                    if (idx === 0) { va = a.type; vb = b.type; }
                    else if (idx > 0 && idx <= slots.length) { va = a.orders[idx-1]||0; vb = b.orders[idx-1]||0; }
                    else if (idx === slots.length+1) { va = a.totalOrders; vb = b.totalOrders; }
                    else if (idx === slots.length+2) { va = a.totalRiders; vb = b.totalRiders; }
                    if (typeof va === 'string') return heatSortState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
                    return heatSortState.asc ? va - vb : vb - va;
                };
                str.sort(sorter); sbr.sort(sorter);
            } else { str.sort((a,b) => b.totalOrders - a.totalOrders); }
            str.forEach(r => {
                body += '<tr><td style="font-weight:700;background-color:' + (CONFIG.colorTypeTitleBg || '#f0fdf4') + ';">' + r.type + '</td>';
                const rMin = Math.min(0, ...r.orders), rMax = Math.max(1, ...r.orders);
                r.orders.forEach(v => body += '<td style="background:' + getHeatColor(v, rMin, rMax) + ';font-weight:700;">' + v + '</td>');
                body += '<td style="font-weight:700;background:' + (CONFIG.colorTypeTitleBg || '#f0fdf4') + ';">' + r.totalOrders + '</td><td style="background:' + (CONFIG.colorTypeTitleBg || '#f0fdf4') + ';">' + r.totalRiders + '</td></tr>';
            });
            if (sbr.length) {
                body += '<tr class="separator-row"><td>────────</td>' + slots.map(() => '<td>─</td>').join('') + '<td>─</td><td>─</td></tr>';
                sbr.forEach(r => {
                    body += '<tr><td style="font-weight:700;background:' + (CONFIG.colorTypeBlockHeaderBg || '#eef2ff') + ';">📦 ' + r.block + '</td>';
                    const bMin = Math.min(0,...r.orders), bMax = Math.max(1,...r.orders);
                    r.orders.forEach(v => body += '<td style="background:' + getHeatColor(v,bMin,bMax) + ';font-weight:700;">' + v + '</td>');
                    body += '<td style="font-weight:700;background:' + (CONFIG.colorTypeBlockHeaderBg || '#eef2ff') + ';">' + r.total + '</td><td style="background:' + (CONFIG.colorTypeBlockHeaderBg || '#eef2ff') + ';">—</td></tr>';
                });
            }
            RTB.innerHTML = body;
        }

        function renderOps() {
            let dr = payload.riderDataFromPaste;
            if (!dr.length && !payload.structHalfHour) {
                OSP.innerHTML = '<div style="padding:20px;text-align:center;">' + (CONFIG.messages?.noOpsData || '暂无数据') + '</div>';
                return;
            }
            if (!dr.length) {
                const struct = payload.structHalfHour || payload.structHour;
                if (struct) {
                    const riderMap = new Map();
                    struct.riderDisplay.forEach(r => riderMap.set(r.rider, (riderMap.get(r.rider)||0) + r.total));
                    dr = Array.from(riderMap.entries()).map(([name,total]) => ({
                        name: getPureName(name),
                        id: name.includes('||') ? name.split('||')[1] || name.split('||')[0] : name,
                        type: riderTypeMap.get(name) || CONFIG.defaultRiderType || '其他',
                        total, overtime:0, force:0, second:0, trips:0
                    }));
                }
            }
            if (selectedNames.size > 0) dr = dr.filter(r => selectedNames.has(getPureName(r.name)) || selectedNames.has(r.name));
            const cards = CONFIG.opsMetricCards || [];
            OSP.innerHTML = cards.map(c => {
                const val = payload.opsMetrics[c.key] || (c.key === 'force' || c.key === 'second' ? '0%' : '-');
                const color = getTrafficLightColor(val, c.key === 'outboundValue' ? 'outbound' : (c.key === 'deliveryValue' ? 'delivery' : c.key));
                return '<div class="stat-card"><div class="stat-label">' + c.label + '</div><div class="stat-number" style="color:' + color + '">' + val + '</div></div>';
            }).join('');
            const typeMap = new Map();
            dr.forEach(r => {
                const type = r.type || CONFIG.defaultRiderType || '其他';
                if (!typeMap.has(type)) typeMap.set(type, { riders: new Set(), orders:0, overtime:0, force:0, second:0, trips:0 });
                const agg = typeMap.get(type);
                agg.riders.add(r.id || r.name); agg.orders += r.total; agg.overtime += r.overtime; agg.force += r.force; agg.second += r.second; agg.trips += (r.trips||0);
            });
            let tR=0,tO=0,tOt=0,tF=0,tS=0;
            const srs = [];
            const tp = CONFIG.riderTypePriority || [];
            [...new Set([...tp.filter(t=>typeMap.has(t)), ...Array.from(typeMap.keys()).filter(t=>!tp.includes(t))])].forEach(type => {
                const agg = typeMap.get(type);
                if (!agg) return;
                const rc = agg.riders.size;
                const eff = rc>0 ? (agg.orders/rc).toFixed(1) : '0';
                srs.push({type, orders:agg.orders, ridersCount:rc, overtime:agg.overtime, force:agg.force, second:agg.second, eff});
                tR+=rc; tO+=agg.orders; tOt+=agg.overtime; tF+=agg.force; tS+=agg.second;
            });
            if (opsSummarySortState.ci !== null) {
                srs.sort((a,b) => {
                    const idx = opsSummarySortState.ci;
                    let va, vb;
                    if (idx===0) { va=a.type; vb=b.type; }
                    else if (idx===1) { va=a.orders; vb=b.orders; }
                    else if (idx===2) { va=a.ridersCount; vb=b.ridersCount; }
                    else if (idx===3) { va=a.overtime; vb=b.overtime; }
                    else if (idx===4) { va=a.force; vb=b.force; }
                    else if (idx===5) { va=a.second; vb=b.second; }
                    else if (idx===6) { va=parseFloat(a.eff); vb=parseFloat(b.eff); }
                    if (typeof va === 'string') return opsSummarySortState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
                    return opsSummarySortState.asc ? va - vb : vb - va;
                });
            } else { srs.sort((a,b) => parseFloat(b.eff) - parseFloat(a.eff)); }
            let sHtml = '';
            srs.forEach(r => sHtml += '<tr><td>' + r.type + '</td><td>' + r.orders + '</td><td>' + r.ridersCount + '</td><td>' + (r.overtime||'') + '</td><td>' + (r.force||'') + '</td><td>' + (r.second||'') + '</td><td>' + r.eff + '</td></tr>');
            sHtml += '<tr style="font-weight:700;background:' + (CONFIG.colorBlockSummaryBg || '#fde68a') + ';"><td>合计</td><td>' + tO + '</td><td>' + tR + '</td><td>' + (tOt||'') + '</td><td>' + (tF||'') + '</td><td>' + (tS||'') + '</td><td>' + (tR>0 ? (tO/tR).toFixed(1) : '0') + '</td></tr>';
            OST.querySelector('thead').innerHTML = '<tr><th>类型</th><th>订单</th><th>出勤</th><th>超时</th><th>强投</th><th>二投</th><th>人效</th></tr>';
            OST.querySelector('tbody').innerHTML = sHtml;
            const nc = new Map(); dr.forEach(r => nc.set(r.name, (nc.get(r.name)||0)+1));
            let drs = [...dr];
            if (opsDetailSortState.ci !== null) {
                drs = sortByColumn(drs, opsDetailSortState.ci, opsDetailSortState.asc, {
                    0: r=>r.name, 1: r=>r.type, 2: r=>r.total, 3: r=>r.overtime, 4: r=>r.force, 5: r=>r.second, 6: r=>r.trips
                });
            } else { drs.sort((a,b) => b.total - a.total); }
            const oRk = getRankMap(drs.map(r=>r.overtime)), fRk = getRankMap(drs.map(r=>r.force)), sRk = getRankMap(drs.map(r=>r.second)), tRk = getRankMap(drs.map(r=>r.trips));
            let dHtml = '';
            drs.forEach(r => {
                const isDup = nc.get(r.name) > 1;
                dHtml += '<tr><td>' + (isDup ? r.id + '<br><span style="font-weight:700;">' + r.name + '</span>' : r.name) + '</td><td class="col-type">' + (r.type||'-') + '</td><td>' + r.total + '</td><td>' + (r.overtime ? renderRankMedal(r.overtime, oRk.get(r.overtime)||5) : '') + '</td><td>' + (r.force ? renderRankMedal(r.force, fRk.get(r.force)||5) : '') + '</td><td>' + (r.second ? renderRankMedal(r.second, sRk.get(r.second)||5) : '') + '</td><td>' + (r.trips ? renderRankMedal(r.trips, tRk.get(r.trips)||5) : '') + '</td></tr>';
            });
            ODT.querySelector('thead').innerHTML = '<tr><th>姓名</th><th>类型</th><th>订单</th><th>超时</th><th>强投</th><th>二投</th><th>趟次</th></tr>';
            ODT.querySelector('tbody').innerHTML = dHtml;
            OST.querySelector('thead').querySelectorAll('th').forEach((th,i) => th.onclick = () => {
                if (opsSummarySortState.ci === i) opsSummarySortState.asc = !opsSummarySortState.asc;
                else { opsSummarySortState.ci = i; opsSummarySortState.asc = true; }
                renderOps();
            });
            ODT.querySelector('thead').querySelectorAll('th').forEach((th,i) => th.onclick = () => {
                if (opsDetailSortState.ci === i) opsDetailSortState.asc = !opsDetailSortState.asc;
                else { opsDetailSortState.ci = i; opsDetailSortState.asc = true; }
                renderOps();
            });
        }

        RSI.addEventListener('focus', () => { RD.classList.add('show'); renderDropdown(); });
        RSI.addEventListener('input', renderDropdown);
        RSI.addEventListener('keydown', e => { if (e.key === 'Escape') { RD.classList.remove('show'); RSI.blur(); } });
        RD.addEventListener('click', e => {
            e.stopPropagation();
            const opt = e.target.closest('.rider-option');
            if (!opt) return;
            const v = opt.dataset.value;
            if (v) {
                selectedNames.has(v) ? selectedNames.delete(v) : selectedNames.add(v);
                renderDropdown();
                RSI.focus();
                if (currentView === 'ops') renderOps(); else renderCurrent();
            }
        });
        RCB.addEventListener('click', e => {
            e.stopPropagation();
            selectedNames.clear();
            RSI.value = '';
            renderDropdown();
            if (currentView === 'ops') renderOps(); else renderCurrent();
            RD.classList.remove('show');
        });
        document.addEventListener('click', e => { if (!RFC.contains(e.target)) RD.classList.remove('show'); });
        VTG.addEventListener('click', e => {
            const opt = e.target.closest('.view-option');
            if (!opt) return;
            switchView(opt.dataset.view);
        });
        RTH.addEventListener('click', e => {
            const th = e.target.closest('th');
            if (!th) return;
            const ci = th.cellIndex;
            if (ci === -1) return;
            if (heatSortState.ci === ci) heatSortState.asc = !heatSortState.asc;
            else { heatSortState.ci = ci; heatSortState.asc = true; }
            renderCurrent();
        });

        function initDrag(w) {
            let dragging = false, sX=0,sY=0,sL=0,sT=0;
            w.style.cursor = 'grab';
            w.addEventListener('mousedown', e => {
                if (e.target.closest('th')) return;
                dragging = true; w.style.cursor = 'grabbing';
                sX = e.pageX - w.offsetLeft; sY = e.pageY - w.offsetTop;
                sL = w.scrollLeft; sT = w.scrollTop;
                e.preventDefault();
            });
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                e.preventDefault();
                w.scrollLeft = sL - (e.pageX - w.offsetLeft - sX) * 1.5;
                w.scrollTop = sT - (e.pageY - w.offsetTop - sY) * 1.5;
            });
            window.addEventListener('mouseup', () => { dragging=false; w.style.cursor='grab'; });
            w.addEventListener('touchstart', e => {
                if (e.target.closest('th')) return; if (e.touches.length!==1) return;
                dragging=true;
                sX = e.touches[0].pageX - w.offsetLeft; sY = e.touches[0].pageY - w.offsetTop;
                sL = w.scrollLeft; sT = w.scrollTop;
                e.preventDefault();
            }, {passive:false});
            w.addEventListener('touchmove', e => {
                if (!dragging) return;
                e.preventDefault();
                w.scrollLeft = sL - (e.touches[0].pageX - w.offsetLeft - sX) * 1.5;
                w.scrollTop = sT - (e.touches[0].pageY - w.offsetTop - sY) * 1.5;
            }, {passive:false});
            w.addEventListener('touchend', () => { dragging=false; });
        }
        initDrag(SW); initDrag(OS);

        updateLegend();
        updateGranDisplay();
        updateRiderOverlay();
        switchView(CONFIG.defaultView || 'ops');
    })();
    <\/script>
</body>

                const blob = new Blob([html], { type: 'text/html' });
                const a = document.createElement('a');

                a.click();
                URL.revokeObjectURL(a.href);
                logStatus(CONFIG.messages.exportSuccess, '', 'success');

            // ==================== 菜单与拖拽事件 ====================
            menuToggle.onclick = e => { e.stopPropagation(); menuDropdown.classList.toggle('show'); };

            const initDragScroll = (wrapper) => {
                let dragging = false, sX = 0, sY = 0, sL = 0, sT = 0;
                wrapper.style.cursor = 'grab';
                wrapper.addEventListener('mousedown', e => { if (e.target.closest('th')) return; dragging = true; wrapper.style.cursor = 'grabbing'; sX = e.pageX - wrapper.offsetLeft; sY = e.pageY - wrapper.offsetTop; sL = wrapper.scrollLeft; sT = wrapper.scrollTop; e.preventDefault(); });
                window.addEventListener('mousemove', e => { if (!dragging) return; e.preventDefault(); wrapper.scrollLeft = sL - (e.pageX - wrapper.offsetLeft - sX) * 1.5; wrapper.scrollTop = sT - (e.pageY - wrapper.offsetTop - sY) * 1.5; });
                window.addEventListener('mouseup', () => { dragging = false; wrapper.style.cursor = 'grab'; });
                wrapper.addEventListener('touchstart', e => { if (e.target.closest('th')) return; if (e.touches.length !== 1) return; dragging = true; sX = e.touches[0].pageX - wrapper.offsetLeft; sY = e.touches[0].pageY - wrapper.offsetTop; sL = wrapper.scrollLeft; sT = wrapper.scrollTop; e.preventDefault(); }, { passive: false });
                wrapper.addEventListener('touchmove', e => { if (!dragging) return; e.preventDefault(); wrapper.scrollLeft = sL - (e.touches[0].pageX - wrapper.offsetLeft - sX) * 1.5; wrapper.scrollTop = sT - (e.touches[0].pageY - wrapper.offsetTop - sY) * 1.5; }, { passive: false });
                wrapper.addEventListener('touchend', () => { dragging = false; });
            };
            initDragScroll(scrollWrapper);
            initDragScroll(opsScrollWrapper);

            confirmMatchBtn.onclick = () => { processMatchResult(matchContainer, true); if (appState.matchResolve) { appState.matchResolve(); appState.matchResolve = null; } modalManager.close(matchModal); };
            skipMatchBtn.onclick = () => { processMatchResult(matchContainer, false); if (appState.matchResolve) { appState.matchResolve(); appState.matchResolve = null; } modalManager.close(matchModal); };

            guideCloseBtn.addEventListener('click', () => { modalManager.close(guideOverlayEl); logStatus(CONFIG.messages.guideClosed, '', 'info'); });
            guideAutoToggle.addEventListener('click', () => { appState.guideAutoNext = !appState.guideAutoNext; updateAutoToggleDisplay(appState.currentGuideStep); logStatus(appState.guideAutoNext ? CONFIG.messages.autoModeOn : CONFIG.messages.autoModeOff, '', 'info'); });

            // ==================== 初始化 ====================
            syncConfigColorsToCSS();
            mainTitle.textContent = CONFIG.appTitle;
            rankFirstRowWords.value = CONFIG.rankParseDefaults.firstRowWords;
            rankSingleWordRows.value = CONFIG.rankParseDefaults.singleWordRows;
            rankMaxDataRows.value = CONFIG.rankParseDefaults.maxDataRows;
            rankTotalCols.textContent = CONFIG.rankParseDefaults.totalCols;
            initViewButtons();
            syncUIFromState();
            modalManager.open(guideOverlayEl);
            renderGuideStep(1);
            logStatus(CONFIG.messages.toolReady, '请通过引导或右上角⚙️菜单开始', 'info');
        })();
