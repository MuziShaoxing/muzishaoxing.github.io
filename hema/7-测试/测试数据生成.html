<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即时配送数据生成器 · 极简虚拟版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#3b82f6,#8b5cf6);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;padding:20px}
        .container{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);max-width:760px;width:100%;padding:48px 40px;text-align:center}
        h2{font-size:28px;font-weight:700;color:#1e293b;margin-bottom:8px}
        .subtitle{color:#64748b;margin-bottom:36px;font-size:15px}
        .btn-grid{display:flex;flex-direction:column;gap:14px;align-items:center;margin-bottom:32px}
        .btn{border:none;border-radius:16px;padding:16px 28px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s;width:100%;max-width:400px;color:white;background:#3b82f6;box-shadow:0 8px 16px -4px rgba(59,130,246,0.4);display:flex;align-items:center;justify-content:center;gap:8px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 14px 24px -6px rgba(59,130,246,0.5)}
        .btn:active{transform:translateY(0)}
        .btn.accent{background:#8b5cf6}
        .btn.success{background:#10b981}
        .btn.copy{background:#0ea5e9}
        .status-box{background:#f8fafc;border-radius:12px;padding:14px 18px;color:#334155;font-size:14px;min-height:48px;margin-top:20px;border:1px solid #e2e8f0}
        .note{background:#f1f5f9;border-radius:12px;padding:18px 20px;margin-top:24px;text-align:left;font-size:13px;color:#475569;line-height:1.6}
        .footer{margin-top:24px;color:#94a3b8;font-size:12px}
        hr{margin:28px 0;border:1px solid #e2e8f0}
    </style>
</head>
<body>
<div class="container">
    <h2>📊 即时配送数据生成器</h2>
    <p class="subtitle">考勤 · 订单 · 履约 · 单袋比 · 月度考勤 · 申领复制</p>
    <div class="btn-grid">
        <button class="btn" onclick="generateAttendance()">📋 生成日度考勤 (30条)</button>
        <button class="btn" onclick="generateOrders()">📦 生成订单数据 (8000条)</button>
        <button class="btn accent" onclick="generateFulfillmentSummary()">📅 生成履约数据 (月度明细)</button>
        <button class="btn accent" onclick="generateBagRatio()">📐 生成单袋比 (248条)</button>
        <button class="btn accent" onclick="generateMonthly()">🗓️ 生成月度考勤 (排休)</button>
        <button class="btn success" onclick="generateAll()">🚀 一键生成全部文档 (含排休限制)</button>
    </div>
    <hr>
    <p style="font-weight:600; color:#334155; margin-bottom:12px;">📋 单独功能</p>
    <div class="btn-grid">
        <button class="btn copy" onclick="copyApplySheet()">📋 复制申领单据 (连续11行)</button>
    </div>
    <div class="status-box" id="status">🟢 就绪</div>
    <div class="note">
        <strong>📌 数据已完全虚拟化 & 精简化</strong><br>
        • 骑手：游戏角色名<br>
        • 站点/子公司/门店/区块/POI/服务商：<strong>全部固定为1个虚拟值</strong><br>
        • 配送班次时间：<strong>仅保留 HH:MM:SS</strong><br>
        • 排休、履约限制等规则不变
    </div>
    <div class="footer">纯浏览器运行 · 无后端</div>
</div>

<script>
    // ======================= 骑手数据（游戏角色名） =======================
    const riders = [
        { id: "R01", name: "亚索", type: "全职" },
        { id: "R02", name: "劫", type: "全职" },
        { id: "R03", name: "薇恩", type: "全职" },
        { id: "R04", name: "锐雯", type: "全职" },
        { id: "R05", name: "盖伦", type: "全职" },
        { id: "R06", name: "德莱文", type: "盒心" },
        { id: "R07", name: "阿木木", type: "盒心" },
        { id: "R08", name: "机器人", type: "盒心" },
        { id: "R09", name: "卡牌大师", type: "盒心" },
        { id: "R10", name: "小鱼人", type: "盒心" },
        { id: "R11", name: "炸弹人", type: "盒心" },
        { id: "R12", name: "牛头酋长", type: "盒心" },
        { id: "R13", name: "皮城女警", type: "盒心" },
        { id: "R14", name: "影流之主", type: "盒心" },
        { id: "R15", name: "齐天大圣", type: "灵活" },
        { id: "R16", name: "诺克萨斯", type: "灵活" },
        { id: "R17", name: "麦林炮手", type: "灵活" },
        { id: "R18", name: "虚空之眼", type: "灵活" },
        { id: "R19", name: "深海泰坦", type: "灵活" },
        { id: "R20", name: "暗夜猎手", type: "灵活" },
        { id: "R21", name: "暴走萝莉", type: "灵活" },
        { id: "R22", name: "德玛西亚皇子", type: "灵活" },
        { id: "R23", name: "圣枪游侠", type: "灵活" },
        { id: "R24", name: "刀锋意志", type: "灵活" },
        { id: "R25", name: "放逐之刃", type: "灵活" },
        { id: "R26", name: "皎月女神", type: "灵活" },
        { id: "R27", name: "曙光女神", type: "灵活" },
        { id: "R28", name: "暮光之眼", type: "灵活" },
        { id: "R29", name: "狂暴之心", type: "灵活" },
        { id: "R30", name: "正义巨像", type: "灵活" }
    ];
    const riderIds = riders.map(r => r.id);
    const riderMapName = Object.fromEntries(riders.map(r => [r.id, r.name]));

    const shiftTypeMap = {};
    riders.forEach(r => {
        if (r.type === '全职') shiftTypeMap[r.id] = '全职排班';
        else if (r.type === '盒心') shiftTypeMap[r.id] = '盒心排班';
        else shiftTypeMap[r.id] = '灵活排班';
    });

    const fixedShifts = [
        { startH: 7, startM: 0, endH: 20, endM: 0 },
        { startH: 8, startM: 0, endH: 21, endM: 0 },
        { startH: 10, startM: 0, endH: 22, endM: 0 }
    ];
    const flexShiftTemplates = [];
    for (let i = 0; i < 17; i++) {
        const startH = randInt(7, 15);
        const duration = randInt(5, 10);
        const endH = startH + duration > 23 ? 23 : startH + duration;
        flexShiftTemplates.push({ startH, startM: 0, endH, endM: 0 });
    }
    const allShiftTemplates = [...fixedShifts, ...flexShiftTemplates];

    // ======================= 全能通用虚拟地点（每个只保留一条） =======================
    const SINGLE_SITE = "比邻星b基地台";
    const SINGLE_SUB_COMPANY = "仙女座星际集团";
    const SINGLE_BLOCK = "α象限";
    const SINGLE_STORE = "半人马座α中心";
    const SINGLE_POI = "人马座A*黑洞咖啡";
    const SINGLE_CARRIER = "曲速引擎快递";

    const statuses = ["在线","忙碌","小休"];

    const NOW = new Date();
    const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
    const YESTERDAY = new Date(TODAY.getTime() - 86400000);
    const TODAY_END = new Date(TODAY.getTime() + 86399000);

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function formatDateTime(date) {
        const y = date.getFullYear();
        const mo = String(date.getMonth()+1).padStart(2,'0');
        const d = String(date.getDate()).padStart(2,'0');
        const hh = String(date.getHours()).padStart(2,'0');
        const mm = String(date.getMinutes()).padStart(2,'0');
        const ss = String(date.getSeconds()).padStart(2,'0');
        return `${y}-${mo}-${d} ${hh}:${mm}:${ss}`;
    }
    // 仅时间格式（无年月日）
    function formatTimeOnly(date) {
        const hh = String(date.getHours()).padStart(2,'0');
        const mm = String(date.getMinutes()).padStart(2,'0');
        const ss = String(date.getSeconds()).padStart(2,'0');
        return `${hh}:${mm}:${ss}`;
    }
    function yyyymmdd(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth()+1).padStart(2,'0');
        const d = String(date.getDate()).padStart(2,'0');
        return `${y}${m}${d}`;
    }

    // 分配全职/盒心班次
    function assignFixedShifts() {
        const fullHexin = riders.filter(r => r.type === '全职' || r.type === '盒心');
        const pool = [{ idx: 0, riders: [] }, { idx: 1, riders: [] }, { idx: 2, riders: [] }];
        const shuffled = [...fullHexin];
        for (let s = 0; s < 3; s++) for (let i = 0; i < 3; i++) {
            if (shuffled.length === 0) break;
            pool[s].riders.push(shuffled.pop());
        }
        while (shuffled.length > 0) {
            const s = randInt(0, 2);
            pool[s].riders.push(shuffled.pop());
        }
        const map = {};
        pool.forEach(s => s.riders.forEach(r => map[r.id] = s.idx));
        return map;
    }

    function makeAttendanceRow(rider, date, shiftTemplate, isCancel) {
        const planStart = new Date(date.getFullYear(), date.getMonth(), date.getDate(), shiftTemplate.startH, shiftTemplate.startM);
        const planEnd = new Date(date.getFullYear(), date.getMonth(), date.getDate(), shiftTemplate.endH, shiftTemplate.endM);
        let workStart = new Date(planStart.getTime() + randInt(-15, 15) * 60000);
        if (workStart < date) workStart = date;
        let workEnd = new Date(planEnd.getTime() + randInt(-15, 15) * 60000);
        if (workEnd <= workStart) workEnd = new Date(workStart.getTime() + 8 * 3600000);
        const dateEnd = new Date(date.getTime() + 86399000);
        if (workEnd > dateEnd) workEnd = dateEnd;
        return {
            "统计日期": yyyymmdd(date),
            "考勤骑手": rider.id,
            "配送班次": `BC${yyyymmdd(date)}${randInt(100, 999)}`,
            "骑手类型": rider.type,
            "骑手考勤状态（实时）": statuses[randInt(0, 2)],
            "考勤骑手.行政站点名称": SINGLE_SITE,
            "考勤骑手.工作配送站名称": SINGLE_SITE,
            "考勤骑手.行政站点子公司": SINGLE_SUB_COMPANY,
            "考勤骑手.工作站点子公司": SINGLE_SUB_COMPANY,
            "考勤骑手.下班时间": formatDateTime(workEnd),         // 上下班仍保留完整日期
            "考勤骑手.上班时间": formatDateTime(workStart),
            "考勤骑手.配送员姓名": rider.name,
            "配送班次.班次结束时间": formatTimeOnly(planEnd),     // 仅时间
            "配送班次.班次开始时间": formatTimeOnly(planStart),
            "班次状态（1：取消；0：正常）": isCancel ? 1 : 0,
            "配送班次.班次类型": shiftTypeMap[rider.id]
        };
    }

    function makeAttendanceRowFull(rider, date, shiftTemplate, isCancel) {
        const row = makeAttendanceRow(rider, date, shiftTemplate, isCancel);
        const planStart = new Date(date.getFullYear(), date.getMonth(), date.getDate(), shiftTemplate.startH, shiftTemplate.startM);
        const planEnd = new Date(date.getFullYear(), date.getMonth(), date.getDate(), shiftTemplate.endH, shiftTemplate.endM);
        let ws = new Date(planStart.getTime() + randInt(-15, 15) * 60000);
        if (ws < date) ws = date;
        let we = new Date(planEnd.getTime() + randInt(-15, 15) * 60000);
        if (we <= ws) we = new Date(ws.getTime() + 8 * 3600000);
        const dateEnd = new Date(date.getTime() + 86399000);
        if (we > dateEnd) we = dateEnd;
        row._workStart = ws;
        row._workEnd = we;
        row._phone = `1380000${String(riders.indexOf(rider) + 1).padStart(4, '0')}`;
        return row;
    }

    function generateAttendanceFull(date, cancelSet) {
        const shiftIdxMap = assignFixedShifts();
        const records = [];
        riders.forEach(r => {
            let tmpl;
            if (r.type === '全职' || r.type === '盒心') tmpl = fixedShifts[shiftIdxMap[r.id]];
            else tmpl = allShiftTemplates[randInt(3, allShiftTemplates.length - 1)];
            records.push(makeAttendanceRowFull(r, date, tmpl, cancelSet.has(r.id)));
        });
        for (let i = records.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [records[i], records[j]] = [records[j], records[i]];
        }
        return records;
    }

    let currentDayCancelSet = new Set(riders.sort(() => Math.random() - 0.5).slice(0, 3).map(r => r.id));
    function generateAttendanceData() {
        const recs = generateAttendanceFull(TODAY, currentDayCancelSet);
        window.attendanceCache = recs;
        return recs;
    }

    // ======================= 订单数据 =======================
    function generateOrderData(attendanceRecords) {
        const schedule = {};
        attendanceRecords.forEach(r => schedule[r["考勤骑手"]] = { start: r._workStart, end: r._workEnd });
        const normalRiders = riderIds.filter(id => !currentDayCancelSet.has(id));
        const batchTypes = ["即时配","预约配","半日达"];
        const orderStatuses = ["已妥投","取消配送"];
        const remarks = ["","超空间波动","离子风暴","陨石阻隔"];
        const records = [];
        for (let i = 1; i <= 8000; i++) {
            const riderId = normalRiders[randInt(0, normalRiders.length - 1)];
            const riderName = riderMapName[riderId];
            const phone = attendanceRecords.find(r => r["考勤骑手"] === riderId)._phone;
            const { start: ws, end: we } = schedule[riderId];
            const earliestDel = new Date(Math.max(TODAY.getTime(), ws.getTime() - 3600000));
            const latestDel = new Date(Math.min(TODAY_END.getTime(), we.getTime() + 3600000));
            const deliveryTime = new Date(randInt(earliestDel.getTime(), latestDel.getTime()));
            let pickupTime = new Date(deliveryTime.getTime() - randInt(10, 50) * 60000);
            if (pickupTime < TODAY) pickupTime = TODAY;
            let lastScan = new Date(pickupTime.getTime() - randInt(1, 15) * 60000);
            if (lastScan < TODAY) lastScan = TODAY;
            const payTime = new Date(randInt(YESTERDAY.getTime(), TODAY_END.getTime()));
            const batchCreate = new Date(randInt(Math.max(payTime.getTime() + 1000, lastScan.getTime() - 900000, YESTERDAY.getTime()), lastScan.getTime() - 1000));
            const totalSec = (lastScan - batchCreate) / 1000;
            let pickingTime, packTime, firstScan, finalLastScan;
            if (totalSec < 4) {
                const step = Math.max(1, Math.floor(totalSec / 4));
                pickingTime = new Date(batchCreate.getTime() + step * 1000);
                packTime = new Date(pickingTime.getTime() + step * 1000);
                firstScan = new Date(packTime.getTime() + step * 1000);
                finalLastScan = new Date(firstScan.getTime() + step * 1000);
            } else {
                const pts = [randInt(1, totalSec - 1), randInt(1, totalSec - 1), randInt(1, totalSec - 1)].sort((a,b)=>a-b);
                pickingTime = new Date(batchCreate.getTime() + pts[0] * 1000);
                packTime = new Date(pickingTime.getTime() + (pts[1]-pts[0]) * 1000);
                firstScan = new Date(packTime.getTime() + (pts[2]-pts[1]) * 1000);
                finalLastScan = new Date(firstScan.getTime() + (totalSec-pts[2]) * 1000);
            }
            let deadline = new Date(deliveryTime.getTime() + randInt(-20, 40) * 60000);
            if (deadline < YESTERDAY) deadline = YESTERDAY;
            if (deadline > TODAY_END) deadline = TODAY_END;
            records.push({
                "批次号": `BN${yyyymmdd(TODAY)}${String(i).padStart(6, '0')}`,
                "履约单号": `FY${randInt(100000000, 999999999)}`,
                "业务订单号": `BO${randInt(100000000, 999999999)}`,
                "淘系订单号": `TO${randInt(100000000, 999999999)}`,
                "批次包裹数": randInt(1, 5),
                "批次类型": batchTypes[randInt(0, 2)],
                "门店": SINGLE_STORE,
                "区块": SINGLE_BLOCK,
                "POI名称": SINGLE_POI,
                "经度": (Math.random() * 360 - 180).toFixed(6),
                "纬度": (Math.random() * 180 - 90).toFixed(6),
                "商品种类数": randInt(1, 10),
                "批次送达时间": formatDateTime(deliveryTime),
                "批次创建时间": formatDateTime(batchCreate),
                "批次生成到拣货完成": `${Math.round((pickingTime - batchCreate) / 60000)}分钟`,
                "订单拣货时间": formatDateTime(pickingTime),
                "拣货到打包完成": `${Math.round((packTime - pickingTime) / 60000)}分钟`,
                "批次打包时间": formatDateTime(packTime),
                "过机时间(首容器)": formatDateTime(firstScan),
                "过机时间(末容器)": formatDateTime(finalLastScan),
                "打包到揽收完成": `${Math.round((pickupTime - packTime) / 60000)}分钟`,
                "批次揽收时间": formatDateTime(pickupTime),
                "订单揽收到配送完成": `${Math.round((deliveryTime - pickupTime) / 60000)}分钟`,
                "订单配送完成时间": formatDateTime(deliveryTime),
                "订单最晚送达时间": formatDateTime(deadline),
                "支付时间": formatDateTime(payTime),
                "是否超时": deliveryTime > deadline ? 1 : 0,
                "订单状态": orderStatuses[randInt(0, 1)],
                "备注原因": remarks[randInt(0, 3)],
                "配送员姓名": riderName,
                "配送员电话": phone,
                "配送员所属配送商": SINGLE_CARRIER,
                "是否大件": Math.random() < 0.1 ? 1 : 0,
                "是否首选时间片": Math.random() < 0.3 ? 1 : 0
            });
        }
        return records;
    }

    // ======================= 履约明细（排休过滤） =======================
    function generateFulfillmentSummaryData(restDaysMap) {
        const year = TODAY.getFullYear();
        const month = TODAY.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const rows = [];
        for (let d = 1; d <= days; d++) {
            const ds = yyyymmdd(new Date(year, month, d));
            const restSet = restDaysMap ? (restDaysMap.get(ds) || new Set()) : new Set();
            riderIds.forEach(id => {
                if (!restSet.has(id)) {
                    rows.push({ "统计日期": ds, "配送员名字": riderMapName[id], "总签收单量": randInt(0, 45) });
                }
            });
        }
        return rows;
    }

    // ======================= 单袋比 =======================
    function generateBagRatioData() {
        const year = TODAY.getFullYear();
        const month = TODAY.getMonth();
        const days = new Date(year, month + 1, 0).getDate();
        const mStart = new Date(year, month, 1);
        const mEnd = new Date(year, month, days);
        const weeks = [];
        const used = new Set();
        while (weeks.length < 7) {
            const startDay = randInt(1, days - 6);
            if (used.has(startDay)) continue;
            used.add(startDay);
            const ws = new Date(year, month, startDay);
            const we = new Date(year, month, startDay + 6);
            weeks.push({ start: ws, end: we });
        }
        const range = `${yyyymmdd(mStart)}~${yyyymmdd(mEnd)}`;
        const rows = [];
        riders.forEach(r => {
            const o2oM = randInt(1, 3000);
            rows.push({ "骑手id": r.id, "骑手姓名": r.name, "确认申领商品数量": randInt(1, Math.min(3000, o2oM * 2)), "统计范围": range, "统计日期": yyyymmdd(mEnd), "o2o签收单量": o2oM });
            weeks.forEach(w => {
                const o2oW = randInt(1, 3000);
                rows.push({ "骑手id": r.id, "骑手姓名": r.name, "确认申领商品数量": randInt(1, Math.min(3000, o2oW * 2)), "统计范围": `${yyyymmdd(w.start)}~${yyyymmdd(w.end)}`, "统计日期": yyyymmdd(w.end), "o2o签收单量": o2oW });
            });
        });
        const rr = riders[randInt(0, riders.length - 1)];
        const dupM = randInt(1, 3000);
        rows.push({ "骑手id": "RX", "骑手姓名": rr.name, "确认申领商品数量": randInt(1, Math.min(3000, dupM * 2)), "统计范围": range, "统计日期": yyyymmdd(mEnd), "o2o签收单量": dupM });
        weeks.forEach(w => {
            const dupW = randInt(1, 3000);
            rows.push({ "骑手id": "RX", "骑手姓名": rr.name, "确认申领商品数量": randInt(1, Math.min(3000, dupW * 2)), "统计范围": `${yyyymmdd(w.start)}~${yyyymmdd(w.end)}`, "统计日期": yyyymmdd(w.end), "o2o签收单量": dupW });
        });
        return rows;
    }

    // ======================= 申领单据 =======================
    function generateApplySheetData() {
        const statusOpts = ["确认", "拒绝", "待审批"];
        const count = randInt(60, 200);
        const records = [];
        while (records.length < count) {
            const rider = riders[randInt(0, riders.length - 1)];
            const applyDate = new Date(TODAY.getFullYear(), TODAY.getMonth(), randInt(1, 28));
            const status = statusOpts[randInt(0, 2)];
            const isPending = status === "待审批";
            records.push({
                "申领单据": `SQ${yyyymmdd(applyDate)}${String(records.length + 1).padStart(3, '0')}`,
                "申领日期": yyyymmdd(applyDate),
                "申请人工号": rider.id,
                "申请人姓名": rider.name,
                "耗材商品编码": "HC005",
                "耗材商品名称": "购物袋",
                "申领数量": randInt(1, 10),
                "状态": status,
                "操作": isPending ? "审批" : "查看",
                "审批时间": isPending ? "-" : formatDateTime(new Date()),
                "审批人": isPending ? "-" : "管理员" + randInt(1, 3)
            });
        }
        return records;
    }

    function applyToVertical(records) {
        const keys = Object.keys(records[0]);
        let text = '';
        records.forEach(r => keys.forEach(k => text += r[k] + '\n'));
        return text;
    }

    // ======================= 月度考勤（排休规则） =======================
    function generateMonthlyAttendance() {
        const year = TODAY.getFullYear();
        const month = TODAY.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dates = [];
        for (let d = 1; d <= daysInMonth; d++) dates.push(new Date(year, month, d));
        const dayCancelMap = new Map();
        dates.forEach(date => dayCancelMap.set(yyyymmdd(date), new Set()));
        const getMonday = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        };
        let currentMonday = getMonday(dates[0]);
        while (currentMonday <= dates[dates.length - 1]) {
            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(currentMonday);
                d.setDate(d.getDate() + i);
                if (d.getMonth() === month && d.getFullYear() === year) weekDays.push(d);
            }
            if (weekDays.length === 7) {
                riderIds.forEach(id => {
                    const randomDay = weekDays[randInt(0, 6)];
                    dayCancelMap.get(yyyymmdd(randomDay)).add(id);
                });
            }
            currentMonday.setDate(currentMonday.getDate() + 7);
        }
        dates.forEach(date => {
            const key = yyyymmdd(date);
            const set = dayCancelMap.get(key);
            if (set.size < 3) {
                const av = riderIds.filter(id => !set.has(id));
                const addCount = Math.min(3 - set.size, av.length);
                const shuffled = [...av].sort(() => Math.random() - 0.5);
                for (let i = 0; i < addCount; i++) set.add(shuffled[i]);
            }
        });
        const allRecords = [];
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const cancelSet = dayCancelMap.get(yyyymmdd(date));
            allRecords.push(...generateAttendanceFull(date, cancelSet));
        }
        return { records: allRecords, cancelMap: dayCancelMap, daysInMonth };
    }

    // ======================= 导出 =======================
    function exportToXLSX(dataArr, filename, title) {
        const exportData = dataArr.map(row => {
            const clean = {};
            for (let k in row) if (!k.startsWith('_')) clean[k] = row[k];
            return clean;
        });
        const headers = Object.keys(exportData[0] || {});
        let aoa;
        if (title) {
            aoa = [[title], headers];
            exportData.forEach(r => aoa.push(headers.map(h => r[h] ?? '')));
        } else {
            aoa = [headers];
            exportData.forEach(r => aoa.push(headers.map(h => r[h] ?? '')));
        }
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = headers.map(() => ({ wch: 18 }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
        XLSX.writeFile(wb, filename);
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    async function copyTextToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
            setStatus('✅ 已复制申领单据');
        } catch {
            setStatus('❌ 复制失败，请查看控制台');
            console.log(text);
        }
    }

    function generateAll() {
        setStatus('🚀 一键生成全部文档...');
        setTimeout(() => {
            try {
                window.attendanceCache = generateAttendanceData();
                exportToXLSX(window.attendanceCache, '考勤数据.xlsx');

                const { records: monthlyRecs, cancelMap } = generateMonthlyAttendance();

                const year = TODAY.getFullYear();
                const month = TODAY.getMonth() + 1;
                exportToXLSX(monthlyRecs, `考勤数据_月度_${year}年${month}月.xlsx`);

                const todayKey = yyyymmdd(TODAY);
                const todayCancelSet = cancelMap.get(todayKey) || new Set();
                currentDayCancelSet = todayCancelSet;
                exportToXLSX(generateOrderData(window.attendanceCache), '订单数据.xlsx');

                exportToXLSX(generateFulfillmentSummaryData(cancelMap), '履约数据.xlsx', '履约明细表');
                exportToXLSX(generateBagRatioData(), '单袋比数据.xlsx');

                setStatus(`✅ 全部5个文件已下载！履约已排除休息骑手`);
            } catch (e) {
                setStatus('❌ 生成失败：' + e.message);
                console.error(e);
            }
        }, 30);
    }
