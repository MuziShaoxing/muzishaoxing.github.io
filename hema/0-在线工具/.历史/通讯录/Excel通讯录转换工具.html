<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel通讯录转换工具 - 免费·安全·高效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header .subtitle {
            font-size: 15px;
            opacity: 0.95;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .content {
            padding: 25px 30px;
        }

        .step {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .step-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-title .badge {
            background: #4a90e2;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            background: white;
            transition: all 0.3s;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 15px;
            color: #555;
            margin-bottom: 5px;
        }

        .upload-hint {
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }

        .upload-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .file-list {
            margin-top: 15px;
            display: none;
        }

        .file-list.show {
            display: block;
        }

        .file-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .file-items-container {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-name {
            color: #333;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 400px;
        }

        .file-remove {
            color: #dc3545;
            cursor: pointer;
            font-size: 16px;
            padding: 0 5px;
        }

        .file-remove:hover {
            color: #a71d2a;
        }

        .file-count {
            color: #4a90e2;
            font-weight: 600;
        }

        .mapping-row {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .mapping-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mapping-item label {
            font-weight: 500;
            color: #555;
            min-width: 60px;
        }

        .mapping-item input {
            width: 80px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            text-transform: uppercase;
            text-align: center;
            font-weight: 500;
            transition: border-color 0.3s;
        }

        .mapping-item input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .default-hint {
            color: #888;
            font-size: 13px;
            margin-left: 10px;
        }

        .options-row {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4a90e2;
        }

        .separator-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .separator-input input {
            width: 55px;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(74, 144, 226, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20a038 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(40, 167, 69, 0.4);
        }

        .btn-success:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .btn-outline {
            background: white;
            color: #555;
            border: 1px solid #ddd;
        }

        .btn-outline:hover {
            background: #f5f5f5;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-folder {
            background: white;
            color: #4a90e2;
            border: 1px solid #4a90e2;
        }

        .btn-folder:hover {
            background: #f0f7ff;
        }

        .stats {
            background: #e8f4ff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 15px;
            font-size: 14px;
            color: #4a90e2;
        }

        .preview-section {
            margin-top: 20px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .preview-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .table-container {
            max-height: 320px;
            overflow: auto;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8f9fa;
            padding: 12px 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 9px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .empty-table-msg {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .status-bar {
            margin-top: 18px;
            padding: 10px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #e9ecef;
            border-top-color: #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            border-top: 1px solid #e9ecef;
            margin: 15px 0;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-left: 4px;
            color: #999;
            cursor: help;
            font-size: 13px;
        }

        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px 15px;
            }
            
            .features {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>📇</span>
                Excel通讯录转换工具
                <span>📇</span>
            </h1>
            <div class="subtitle">Excel 秒变 vCard · 一键导入手机通讯录</div>
            <div class="features">
                <span class="feature-item">🔒 纯本地处理 · 数据不上传</span>
                <span class="feature-item">⚡ 批量处理 · 无数量限制</span>
                <span class="feature-item">📂 支持文件夹 · 一键导入</span>
                <span class="feature-item">🆓 完全免费 · 无需注册</span>
            </div>
        </div>

        <div class="content">
            <!-- 步骤1 -->
            <div class="step">
                <div class="step-title">
                    <span class="badge">1</span>
                    选择 Excel 文件
                </div>
                
                <div class="upload-area">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击下方按钮选择文件或文件夹</div>
                    <div class="upload-hint">支持 .xlsx 和 .xls 格式</div>
                    <div class="upload-buttons">
                        <button class="btn btn-outline btn-small" id="selectFilesBtn">
                            <span>📄</span>
                            选择文件
                        </button>
                        <button class="btn btn-folder btn-small" id="selectFolderBtn">
                            <span>📂</span>
                            选择文件夹
                        </button>
                    </div>
                </div>

                <div class="file-list" id="fileList">
                    <div class="file-list-header">
                        <div>
                            <span style="font-weight: 600; color: #555;">已选文件</span>
                            <span class="file-count" id="fileCount">(0)</span>
                        </div>
                        <button class="btn btn-outline btn-small" id="clearFilesBtn">🗑️ 清空</button>
                    </div>
                    <div class="file-items-container" id="fileItems"></div>
                </div>
            </div>

            <!-- 步骤2 -->
            <div class="step">
                <div class="step-title">
                    <span class="badge">2</span>
                    列映射与过滤
                </div>

                <div class="mapping-row">
                    <div class="mapping-item">
                        <label>姓名列：</label>
                        <input type="text" id="nameCol" value="AD" maxlength="3">
                    </div>
                    <div class="mapping-item">
                        <label>电话列：</label>
                        <input type="text" id="phoneCol" value="AE" maxlength="3">
                    </div>
                    <div class="mapping-item">
                        <label>公司列：</label>
                        <input type="text" id="companyCol" value="AF" maxlength="3">
                    </div>
                    <span class="default-hint">默认 AD / AE / AF</span>
                </div>

                <div class="divider"></div>

                <div class="options-row">
                    <div class="checkbox-item">
                        <input type="checkbox" id="skipFirstRow" checked>
                        <label for="skipFirstRow">跳过标题行</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="phoneMustBeNumber" checked>
                        <label for="phoneMustBeNumber">电话必须为数字</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="filterEmptyName" checked>
                        <label for="filterEmptyName">过滤空姓名</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="filterEmptyPhone" checked>
                        <label for="filterEmptyPhone">过滤空电话</label>
                    </div>
                </div>

                <div class="options-row">
                    <div class="checkbox-item">
                        <input type="checkbox" id="mergeDuplicates" checked>
                        <label for="mergeDuplicates">合并同名联系人</label>
                        <span class="tooltip" data-tip="相同姓名自动合并，多号码用分隔符连接">ⓘ</span>
                    </div>
                    <div class="separator-input">
                        <label>分隔符：</label>
                        <input type="text" id="separator" value="; " maxlength="3">
                    </div>
                    <button class="btn btn-primary" id="loadBtn" disabled>
                        <span>📂</span>
                        加载并预览
                    </button>
                </div>

                <div class="stats" id="stats">未加载数据</div>
            </div>

            <!-- 步骤3 -->
            <div class="preview-section">
                <div class="preview-header">
                    <div class="preview-title">
                        <span class="badge" style="display: inline-flex; margin-right: 8px;">3</span>
                        数据预览
                    </div>
                    <button class="btn btn-success" id="exportBtn" disabled>
                        <span>⬇️</span>
                        导出 vCard
                    </button>
                </div>

                <div class="table-container">
                    <table id="previewTable">
                        <thead>
                            <tr>
                                <th style="width: 60px;">#</th>
                                <th style="width: 140px;">姓名</th>
                                <th style="width: 200px;">电话</th>
                                <th>公司</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 状态栏 -->
            <div class="status-bar">
                <span id="statusIcon">💡</span>
                <span id="statusText">等待选择文件...</span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>处理中...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script>
        (function() {
            'use strict';

            const selectFilesBtn = document.getElementById('selectFilesBtn');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const fileList = document.getElementById('fileList');
            const fileItems = document.getElementById('fileItems');
            const fileCount = document.getElementById('fileCount');
            const clearFilesBtn = document.getElementById('clearFilesBtn');
            const loadBtn = document.getElementById('loadBtn');
            const exportBtn = document.getElementById('exportBtn');
            const tableBody = document.getElementById('tableBody');
            const stats = document.getElementById('stats');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const loading = document.getElementById('loading');

            const nameColInput = document.getElementById('nameCol');
            const phoneColInput = document.getElementById('phoneCol');
            const companyColInput = document.getElementById('companyCol');
            const skipFirstRow = document.getElementById('skipFirstRow');
            const phoneMustBeNumber = document.getElementById('phoneMustBeNumber');
            const filterEmptyName = document.getElementById('filterEmptyName');
            const filterEmptyPhone = document.getElementById('filterEmptyPhone');
            const mergeDuplicates = document.getElementById('mergeDuplicates');
            const separatorInput = document.getElementById('separator');

            let selectedFiles = [];
            let processedContacts = [];
            let skippedRowsCount = 0;
            let nonNumericPhoneCount = 0;

            function createInput(accept, multiple, isFolder = false) {
                const input = document.createElement('input');
                input.type = 'file';
                if (accept) input.accept = accept;
                input.multiple = multiple;
                if (isFolder) input.webkitdirectory = true;
                input.style.display = 'none';
                document.body.appendChild(input);
                return input;
            }

            function selectFiles() {
                const input = createInput('.xlsx,.xls', true);
                input.addEventListener('change', function() {
                    if (this.files.length) addFiles(Array.from(this.files));
                    document.body.removeChild(this);
                });
                input.click();
            }

            function selectFolder() {
                const input = createInput(null, true, true);
                input.addEventListener('change', function() {
                    const files = Array.from(this.files).filter(f => 
                        f.name.toLowerCase().match(/\.(xlsx|xls)$/)
                    );
                    files.length ? addFiles(files) : updateStatus('⚠️', '文件夹中没有 Excel 文件', 'warning');
                    document.body.removeChild(this);
                });
                input.click();
            }

            function initEvents() {
                selectFilesBtn.addEventListener('click', (e) => { e.stopPropagation(); selectFiles(); });
                selectFolderBtn.addEventListener('click', (e) => { e.stopPropagation(); selectFolder(); });
                clearFilesBtn.addEventListener('click', clearFiles);
                loadBtn.addEventListener('click', loadAndPreview);
                exportBtn.addEventListener('click', exportVCard);
                [nameColInput, phoneColInput, companyColInput].forEach(i => i.addEventListener('input', e => e.target.value = e.target.value.toUpperCase()));
            }

            function addFiles(files) {
                let added = 0;
                files.forEach(f => {
                    if (!selectedFiles.some(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified)) {
                        selectedFiles.push(f);
                        added++;
                    }
                });
                if (added) {
                    renderFileList();
                    updateStatus('📁', `已添加 ${added} 个文件，共 ${selectedFiles.length} 个`);
                }
                updateButtonStates();
            }

            function renderFileList() {
                if (!selectedFiles.length) { fileList.classList.remove('show'); return; }
                fileList.classList.add('show');
                fileCount.textContent = `(${selectedFiles.length})`;
                let html = '';
                [...selectedFiles].sort((a,b) => a.name.localeCompare(b.name, 'zh-CN')).forEach(f => {
                    const idx = selectedFiles.findIndex(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified);
                    html += `<div class="file-item"><span class="file-name" title="${f.name}">📄 ${f.name}</span><span class="file-remove" data-index="${idx}">✕</span></div>`;
                });
                fileItems.innerHTML = html;
                fileItems.querySelectorAll('.file-remove').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        if (!isNaN(idx)) { selectedFiles.splice(idx, 1); renderFileList(); updateButtonStates(); updateStatus(selectedFiles.length ? '📁' : '💡', selectedFiles.length ? `已选择 ${selectedFiles.length} 个文件` : '等待选择文件...'); }
                    });
                });
            }

            function clearFiles() {
                selectedFiles = []; processedContacts = []; renderFileList(); renderEmptyTable();
                stats.textContent = '未加载数据'; updateStatus('💡', '等待选择文件...'); updateButtonStates();
            }

            function updateButtonStates() { loadBtn.disabled = !selectedFiles.length; exportBtn.disabled = !processedContacts.length; }
            function updateStatus(icon, text) { statusIcon.textContent = icon; statusText.textContent = text; }
            function setLoading(l) { loading.classList.toggle('show', l); }
            function renderEmptyTable() { tableBody.innerHTML = '<tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看数据</td></tr>'; }

            function colToIdx(letter) {
                let r = 0;
                for (let c of letter.toUpperCase()) r = r * 26 + (c.charCodeAt(0) - 64);
                return r - 1;
            }

            function isNumeric(s) { return s && /^\d+$/.test(String(s).replace(/\s+/g, '')); }
            function cleanPhone(v) {
                if (v == null || v === '') return '';
                const s = String(v).trim();
                if (s === 'nan' || s === 'NaN') return '';
                if (s.includes('.')) { const n = parseFloat(s); if (!isNaN(n) && Number.isInteger(n)) return String(Math.floor(n)); }
                return s;
            }
            function cleanText(v) {
                if (v == null || v === '') return '';
                const s = String(v).trim();
                return (s === 'nan' || s === 'NaN') ? '' : s;
            }

            async function loadAndPreview() {
                if (!selectedFiles.length) return updateStatus('⚠️', '请先选择文件', 'warning');
                const nameL = nameColInput.value.trim().toUpperCase();
                const phoneL = phoneColInput.value.trim().toUpperCase();
                if (!nameL || !phoneL) return updateStatus('⚠️', '请设置姓名和电话列', 'warning');
                
                setLoading(true); updateStatus('📂', '读取中...');
                skippedRowsCount = 0; nonNumericPhoneCount = 0;
                
                try {
                    const nIdx = colToIdx(nameL), pIdx = colToIdx(phoneL), cIdx = companyColInput.value.trim() ? colToIdx(companyColInput.value.trim().toUpperCase()) : -1;
                    let raw = [], skippedFiles = 0;
                    
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const f = selectedFiles[i];
                        updateStatus('📂', `${i+1}/${selectedFiles.length} ${f.name}`);
                        try {
                            const data = await readExcel(f);
                            if (!data.length || nIdx >= data[0].length || pIdx >= data[0].length) { skippedFiles++; continue; }
                            const start = skipFirstRow.checked ? 1 : 0;
                            for (let r = start; r < data.length; r++) {
                                const row = data[r];
                                const name = cleanText(row[nIdx]);
                                let phone = cleanPhone(row[pIdx]);
                                const company = cIdx >= 0 && cIdx < row.length ? cleanText(row[cIdx]) : '';
                                
                                if (filterEmptyName.checked && !name) { skippedRowsCount++; continue; }
                                if (filterEmptyPhone.checked && !phone) { skippedRowsCount++; continue; }
                                if (phoneMustBeNumber.checked && phone && !isNumeric(phone)) { nonNumericPhoneCount++; continue; }
                                if (name) raw.push({ name, phone, company });
                            }
                        } catch { skippedFiles++; }
                    }
                    
                    if (!raw.length) {
                        updateStatus('⚠️', '无有效数据'); stats.textContent = '未读取到数据';
                        renderEmptyTable(); processedContacts = []; setLoading(false); updateButtonStates(); return;
                    }
                    
                    updateStatus('🔄', '合并中...');
                    processedContacts = mergeDuplicates.checked ? mergeContacts(raw) : raw;
                    
                    const cnt = processedContacts.length;
                    let statsText = `📊 有效 ${raw.length} 条`;
                    const details = [];
                    if (skipFirstRow.checked) details.push('跳过标题');
                    if (skippedRowsCount) details.push(`空值 ${skippedRowsCount}`);
                    if (nonNumericPhoneCount) details.push(`非数字 ${nonNumericPhoneCount}`);
                    if (details.length) statsText += ` (${details.join(' · ')})`;
                    statsText += mergeDuplicates.checked ? ` → ${cnt} 人` : ` → ${cnt} 人`;
                    if (skippedFiles) statsText += ` · 跳过${skippedFiles}文件`;
                    stats.textContent = statsText;
                    
                    renderPreview();
                    updateStatus('✅', `完成，共 ${cnt} 个联系人`);
                    setLoading(false); updateButtonStates();
                } catch (e) {
                    updateStatus('❌', '加载失败'); setLoading(false); processedContacts = []; renderEmptyTable(); updateButtonStates();
                }
            }

            function readExcel(f) {
                return new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = e => { try { const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'}); res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})); } catch(er) { rej(er); } };
                    r.onerror = rej;
                    r.readAsArrayBuffer(f);
                });
            }

            function mergeContacts(data) {
                const m = new Map(), sep = separatorInput.value || '; ';
                data.forEach(({name, phone, company}) => {
                    if (!m.has(name)) m.set(name, {phones: new Set(), company: ''});
                    const d = m.get(name);
                    if (phone) d.phones.add(phone);
                    if (company && !d.company) d.company = company;
                });
                return Array.from(m, ([name, {phones, company}]) => ({ name, phone: [...phones].sort().join(sep), company }));
            }

            function renderPreview() {
                if (!processedContacts.length) return renderEmptyTable();
                const preview = processedContacts.slice(0, 1000);
                let html = '';
                preview.forEach((c, i) => html += `<tr><td>${i+1}</td><td>${escapeHtml(c.name)||'-'}</td><td>${escapeHtml(c.phone)||'-'}</td><td>${escapeHtml(c.company)||'-'}</td></tr>`);
                tableBody.innerHTML = html;
                if (processedContacts.length > 1000) updateStatus('📋', `预览前1000条，共${processedContacts.length}条`);
            }

            function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            function exportVCard() {
                if (!processedContacts.length) return updateStatus('⚠️', '无数据');
                const sep = separatorInput.value || '; ';
                let content = '';
                processedContacts.forEach((c, i) => {
                    let card = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
                    card += `FN:${c.name.trim()}\r\nN:;${c.name.trim()};;;\r\n`;
                    if (c.company) card += `ORG:${c.company.trim()}\r\n`;
                    if (c.phone) c.phone.split(sep).map(p => p.trim()).filter(p=>p).forEach(p => card += `TEL:${p}\r\n`);
                    content += card + 'END:VCARD' + (i < processedContacts.length-1 ? '\r\n' : '');
                });
                const name = selectedFiles.length === 1 ? selectedFiles[0].name.replace(/\.(xlsx|xls)$/i,'') + '_通讯录.vcf' : `合并通讯录_${selectedFiles.length}文件_${new Date().toISOString().slice(0,19).replace(/[-:T]/g,'').slice(0,14)}.vcf`;
                const blob = new Blob([content], {type:'text/vcard;charset=utf-8'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = name;
                a.click(); URL.revokeObjectURL(a.href);
                updateStatus('✅', `导出成功！共 ${processedContacts.length} 个联系人`);
            }

            initEvents();
        })();
    </script>
</body>
</html>
