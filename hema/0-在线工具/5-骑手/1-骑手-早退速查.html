<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>骑手考勤 · 表头高亮排序</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #5b8def;
            --primary-light: #eaf1fd;
            --success: #4caf7d;
            --success-light: #e8f5ec;
            --danger: #e06c75;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #2c3e4c;
            --text-light: #6b7b8d;
            --border: #e2e8f0;
            --radius: 14px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height:1.5; min-height:100vh;
            -webkit-text-size-adjust:100%; overflow-x:hidden;
        }
        .container { max-width:1200px; margin:0 auto; padding:12px 10px 40px; }

        .header { text-align:center; padding:18px 0 12px; display:flex; flex-direction:column; align-items:center; }
        .header h1 { font-size:1.4rem; font-weight:700; color:#1e2b3c; }
        .header .sub { font-size:0.75rem; color:var(--text-light); margin-top:2px; }
        .status-indicator {
            display:inline-flex; align-items:center; gap:6px;
            background:var(--card); border-radius:20px; padding:5px 14px;
            box-shadow:0 1px 4px rgba(0,0,0,0.06); cursor:pointer;
            font-size:0.7rem; color:var(--text); font-weight:500;
            border:1px solid var(--border); margin-top:8px;
        }
        .status-dot { width:8px; height:8px; border-radius:50%; background:#c0c8d4; }
        .status-dot.all-ok { background:var(--success); }
        .status-dot.partial { background:var(--danger); }

        .upload-grid { display:flex; flex-direction:column; gap:10px; margin:12px 0 16px; }
        @media(min-width:640px){ .upload-grid{ flex-direction:row; } }
        .upload-card {
            flex:1; background:var(--card); border-radius:var(--radius); padding:14px 16px;
            box-shadow:var(--shadow); border:2px dashed var(--border); transition:all 0.2s;
            cursor:pointer; position:relative; display:flex; align-items:center; gap:12px; min-height:56px;
        }
        .upload-card:hover { border-color:var(--primary); background:var(--primary-light); }
        .upload-card.loaded { border-style:solid; border-color:var(--success); background:var(--success-light); }
        .upload-card .icon-box { width:34px; height:34px; border-radius:10px; background:var(--primary-light); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .upload-card.loaded .icon-box { background:var(--success-light); }
        .upload-card .icon-box svg { width:18px; height:18px; fill:var(--primary); }
        .upload-card.loaded .icon-box svg { fill:var(--success); }
        .upload-card .info { flex:1; min-width:0; }
        .upload-card .info h3 { font-size:0.85rem; font-weight:600; }
        .upload-card .info p { font-size:0.7rem; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .upload-card .file-status { display:flex; align-items:center; gap:6px; font-size:0.7rem; color:var(--text-light); }
        .upload-card .status-light { width:8px; height:8px; border-radius:50%; background:#c0c8d4; }
        .upload-card.loaded .status-light { background:var(--success); }
        .upload-card.loaded .file-status span { color:var(--success); font-weight:500; }
        .upload-card input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .upload-card .remove-btn {
            display:none; position:absolute; top:8px; right:10px;
            background:#fff; border:1px solid #ddd; border-radius:50%; width:22px; height:22px;
            font-size:12px; line-height:20px; text-align:center; color:#999; cursor:pointer; z-index:2;
        }
        .upload-card.loaded .remove-btn { display:block; }

        .action-bar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; }
        .btn { display:inline-flex; align-items:center; gap:4px; padding:7px 16px; border-radius:20px; border:1.5px solid #d0d7e2; background:#fff; font-size:0.7rem; font-weight:500; color:var(--text); cursor:pointer; transition:0.2s; }
        .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }

        .data-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
        .data-header { padding:14px 16px; border-bottom:1px solid #f0f3f8; display:flex; justify-content:space-between; align-items:center; }
        .data-header h2 { font-size:1rem; font-weight:600; }
        .badge { background:var(--primary-light); color:var(--primary); padding:4px 14px; border-radius:20px; font-size:0.7rem; }

        .table-outer { width:100%; overflow-x:visible; }
        .summary-table { width:100%; border-collapse:collapse; white-space:nowrap; table-layout:auto; }
        .summary-table th {
            background:#f8fafc; padding:10px 6px; text-align:left; font-weight:600; color:#475569;
            border-bottom:1px solid #e2e8f0; cursor:pointer; user-select:none; font-size:0.72rem;
            transition: background 0.2s;
        }
        .summary-table th:hover { background:#eef2f6; }
        /* 排序高亮样式 */
        .summary-table th.sorted-header {
            background: #dce3f9 !important;
            color: var(--primary) !important;
            font-weight: 700;
        }
        .summary-table td { padding:10px 6px; border-bottom:1px solid #f1f5f9; font-size:0.72rem; vertical-align:middle; }
        .summary-table tbody tr { transition:background 0.2s; cursor:pointer; }
        .summary-table tbody tr:hover { background:#f8f9fc; }

        .tag-positive { background:#fff3e0; color:#d97706; font-weight:600; padding:2px 10px; border-radius:12px; font-size:0.68rem; white-space:nowrap; }
        .tag-negative { background:#e3f0ff; color:#2563eb; font-weight:600; padding:2px 10px; border-radius:12px; font-size:0.68rem; white-space:nowrap; }
        .tag-zero { background:#e6f7ec; color:#15803d; font-weight:600; padding:2px 10px; border-radius:12px; font-size:0.68rem; white-space:nowrap; }
        .tag-delivering { background:#fff3cd; color:#b45309; font-weight:700; padding:2px 10px; border-radius:12px; font-size:0.68rem; white-space:nowrap; }
        .tag-collect { background:#d4edda; color:#1a5c32; font-weight:700; padding:2px 10px; border-radius:12px; font-size:0.68rem; white-space:nowrap; }
        .na-text { color:#c0c8d4; font-style:italic; font-size:0.7rem; }

        .empty { text-align:center; padding:40px; color:#b0bec5; font-size:0.85rem; }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal-card {
            background:#fff; border-radius:20px; padding:20px 24px;
            width:95%; max-width:640px; max-height:80vh;
            display:flex; flex-direction:column;
            box-shadow:0 20px 40px rgba(0,0,0,0.25);
        }
        .modal-card h3 {
            display:flex; align-items:center; margin-bottom:16px;
            color:var(--primary); font-size:1rem;
        }
        .modal-title-text { flex:1; text-align:center; }
        .modal-close {
            background:none; border:none; font-size:1.4rem; cursor:pointer;
            color:#999; padding:0 4px; line-height:1;
        }
        .modal-close:hover { color:#333; }

        .detail-table-header {
            flex-shrink:0;
            border:1px solid #e9eef3;
            border-bottom:none;
        }
        .detail-table-scroll {
            flex:1;
            overflow-y:auto;
            border:1px solid #e9eef3;
            border-top:none;
            min-height:0;
        }
        .detail-header-table,
        .detail-body-table {
            width:100%;
            border-collapse:collapse;
            white-space:nowrap;
            table-layout:fixed;
            font-size:0.72rem;
        }
        .detail-header-table th {
            background:#f1f5f9;
            padding:8px 6px;
            font-weight:600;
            color:#475569;
            text-align:center;
            font-size:0.72rem;
            border-bottom:1px solid #cdd5e0;
        }
        .detail-body-table td {
            padding:8px 6px;
            border-bottom:1px solid #eef2f7;
            text-align:center;
            font-size:0.72rem;
        }
        .detail-body-table tr:nth-child(even) { background:#f8fafc; }
        .detail-header-table th:nth-child(1),
        .detail-body-table td:nth-child(1) { width:20%; text-align:left; }
        .detail-header-table th:nth-child(2),
        .detail-body-table td:nth-child(2) { width:20%; }
        .detail-header-table th:nth-child(3),
        .detail-body-table td:nth-child(3) { width:20%; }
        .detail-header-table th:nth-child(4),
        .detail-body-table td:nth-child(4) { width:40%; text-align:left; }

        .toast {
            position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:2000;
            padding:10px 22px; border-radius:24px; font-size:0.78rem; font-weight:500;
            box-shadow:0 6px 20px rgba(0,0,0,0.12); animation:slideIn 0.3s; pointer-events:none;
        }
        .toast.success { background:#e8f5ec; color:#1f6d43; border:1px solid #b7dfc9; }
        .toast.error { background:#fde8e8; color:#a12b2b; border:1px solid #f1b9b9; }
        @keyframes slideIn { from{opacity:0;transform:translateX(-50%) translateY(-16px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

        @media(min-width:768px){
            .container { padding:20px 32px 48px; }
            .header h1 { font-size:2rem; }
            .summary-table th, .summary-table td { padding:14px 10px; font-size:1.3rem; }
            .detail-header-table th,
            .detail-body-table td { padding:12px 10px; font-size:1.1rem; }
            .tag-positive,.tag-negative,.tag-zero,.tag-delivering,.tag-collect { font-size:1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🛵 骑手考勤与订单管理</h1>
        <div class="sub">拖拽上传 · 点击行查看订单明细</div>
        <div class="status-indicator" id="statusIndicator" style="display:none;" onclick="openModal()">
            <span class="status-dot" id="globalDot"></span>
            匹配状态
        </div>
    </div>

    <div class="upload-grid">
        <div class="upload-card" id="orderCard">
            <input type="file" id="orderFile" accept=".xlsx,.xls,.csv"/>
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 2l5 5h-5V4zM8 13h8v2H8v-2zm0 4h8v2H8v-2zm0-8h5v2H8V9z"/></svg>
            </div>
            <div class="info">
                <h3>📦 订单表格</h3>
                <p>配送员姓名 · 完成时间 · 状态 · 揽收 · POI</p>
            </div>
            <div class="file-status" id="orderStatusDisplay">
                <span class="status-light"></span>
                <span>未加载</span>
            </div>
            <button class="remove-btn" id="orderRemoveBtn">×</button>
        </div>
        <div class="upload-card" id="attCard">
            <input type="file" id="attFile" accept=".xlsx,.xls,.csv"/>
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
            </div>
            <div class="info">
                <h3>🕒 考勤表格</h3>
                <p>骑手姓名 · 班次结束 · 班次开始 · 状态</p>
            </div>
            <div class="file-status" id="attStatusDisplay">
                <span class="status-light"></span>
                <span>未加载</span>
            </div>
            <button class="remove-btn" id="attRemoveBtn">×</button>
        </div>
    </div>

    <div class="action-bar" id="actionBtns" style="display:none;">
        <button class="btn" id="clearAllBtn">🗑️ 清除</button>
        <button class="btn primary" id="exportBtn">📥 导出</button>
    </div>

    <div class="data-card" id="summaryCard" style="display:none;">
        <div class="data-header">
            <h2>📊 骑手早退列表</h2>
            <span class="badge" id="riderCount">0</span>
        </div>
        <div class="table-outer">
            <table class="summary-table" id="summaryTable">
                <thead>
                <tr>
                    <th id="sort-shiftEnd">下班时间</th>
                    <th id="sort-latest">最晚送达</th>
                    <th id="sort-early" class="sorted-header">早退时间</th>
                    <th id="sort-name">姓名</th>
                </tr>
                </thead>
                <tbody id="summaryBody"></tbody>
            </table>
        </div>
        <div class="empty" id="emptyState">请上传订单与考勤表格</div>
    </div>

    <div class="modal-overlay" id="statusModalOverlay" style="display:none;" onclick="closeStatusModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3>
                <span class="modal-title-text">📎 匹配状态详情</span>
                <button class="modal-close" onclick="closeStatusModalDirect()">✖️</button>
            </h3>
            <div class="list" id="modalList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModalOverlay" style="display:none;" onclick="closeDetailModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3>
                <span class="modal-title-text" id="detailModalTitleText">📋 订单明细</span>
                <button class="modal-close" onclick="closeDetailModalDirect()">✖️</button>
            </h3>
            <div class="detail-table-header">
                <table class="detail-header-table">
                    <thead>
                    <tr>
                        <th>揽收时间</th>
                        <th>配送完成</th>
                        <th>间隔</th>
                        <th>地址</th>
                    </tr>
                    </thead>
                </table>
            </div>
            <div class="detail-table-scroll">
                <table class="detail-body-table">
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>
</div>

<script>
    (function() {
        let orderData = [];
        let attendanceData = [];
        let orderCols = { riderName:-1, completeTime:-1, orderStatus:-1, batchCollectTime:-1, poiName:-1 };
        let attCols = { riderName:-1, shiftEndTime:-1, shiftStartTime:-1, shiftStatus:-1 };
        let summaryList = [];
        let sortKey = 'early';
        let sortAsc = false;

        const orderFile = document.getElementById('orderFile');
        const attFile = document.getElementById('attFile');
        const orderCard = document.getElementById('orderCard');
        const attCard = document.getElementById('attCard');
        const orderStatusDisplay = document.getElementById('orderStatusDisplay');
        const attStatusDisplay = document.getElementById('attStatusDisplay');
        const orderRemoveBtn = document.getElementById('orderRemoveBtn');
        const attRemoveBtn = document.getElementById('attRemoveBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const globalDot = document.getElementById('globalDot');
        const summaryCard = document.getElementById('summaryCard');
        const summaryBody = document.getElementById('summaryBody');
        const emptyState = document.getElementById('emptyState');
        const riderCount = document.getElementById('riderCount');
        const actionBtns = document.getElementById('actionBtns');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const toastContainer = document.getElementById('toastContainer');
        const statusModalOverlay = document.getElementById('statusModalOverlay');
        const modalList = document.getElementById('modalList');
        const detailModalOverlay = document.getElementById('detailModalOverlay');
        const detailTableBody = document.getElementById('detailTableBody');
        const detailModalTitleText = document.getElementById('detailModalTitleText');

        document.getElementById('sort-shiftEnd').addEventListener('click', () => setSort('shiftEnd'));
        document.getElementById('sort-latest').addEventListener('click', () => setSort('latest'));
        document.getElementById('sort-early').addEventListener('click', () => setSort('early'));
        document.getElementById('sort-name').addEventListener('click', () => setSort('name'));

        function toast(msg, type='success') {
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
            toastContainer.appendChild(t); setTimeout(() => t.remove(), 2200);
        }
        function fmtTime(d) { if(!d||isNaN(d.getTime())) return ''; return [d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':'); }
        function fmtDuration(ms) { if(ms===null||isNaN(ms)) return '-'; const abs=Math.abs(ms); const min=Math.floor(abs/60000); const sec=Math.floor((abs%60000)/1000); return `${ms>0?'+':'-'}${min}分${sec}秒`; }
        function parseDate(val) {
            if(!val&&val!==0) return null; if(val instanceof Date) return isNaN(val.getTime())?null:val;
            if(typeof val==='number'){ const d=new Date((val-25569)*86400000); return d&&d.getFullYear()>2000?d:null; }
            if(typeof val==='string'){ let s=val.trim(); if(!s) return null;
                let m=s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})[\sT](\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
                m=s.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
                if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
                m=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
                if(m){ const now=new Date(); now.setHours(+m[1],+m[2],+(m[3]||0),0); return now; }
                const d=new Date(s); return isNaN(d.getTime())?null:d;
            } return null;
        }
        function secOf(d){ return d?d.getHours()*3600+d.getMinutes()*60+d.getSeconds():null; }

        function matchOrderHeaders(headers) {
            const m={riderName:-1,completeTime:-1,orderStatus:-1,batchCollectTime:-1,poiName:-1};
            const exact=['配送员姓名','订单配送完成时间','订单状态','批次揽收时间','POI名称'];
            for(let i=0;i<headers.length;i++){ const h=String(headers[i]||'').trim();
                if(h===exact[0]&&m.riderName===-1) m.riderName=i; else if(h===exact[1]&&m.completeTime===-1) m.completeTime=i;
                else if(h===exact[2]&&m.orderStatus===-1) m.orderStatus=i; else if(h===exact[3]&&m.batchCollectTime===-1) m.batchCollectTime=i;
                else if(h===exact[4]&&m.poiName===-1) m.poiName=i;
            } return m;
        }
        function matchAttendanceHeaders(headers) {
            const m={riderName:-1,shiftEndTime:-1,shiftStartTime:-1,shiftStatus:-1};
            const exact=['考勤骑手.配送员姓名','配送班次.班次结束时间','配送班次.班次开始时间','班次状态（1：取消；0：正常）'];
            for(let i=0;i<headers.length;i++){ const h=String(headers[i]||'').trim();
                if(h===exact[0]&&m.riderName===-1) m.riderName=i; else if(h===exact[1]&&m.shiftEndTime===-1) m.shiftEndTime=i;
                else if(h===exact[2]&&m.shiftStartTime===-1) m.shiftStartTime=i; else if(h===exact[3]&&m.shiftStatus===-1) m.shiftStatus=i;
            } return m;
        }
        async function parseExcel(file) {
            return new Promise((res,rej)=>{ const reader=new FileReader(); reader.onload=e=>{ try{
                const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
                const sheet=wb.Sheets[wb.SheetNames[0]]; const json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
                if(!json.length) return rej(new Error('空文件')); const hdrs=json[0].map(v=>String(v));
                const rows=json.slice(1).filter(r=>r.some(c=>c!==''&&c!=null)); res({headers:hdrs,rows,name:file.name});
            }catch(err){rej(err);}}; reader.onerror=()=>rej(new Error('读取失败')); reader.readAsArrayBuffer(file);});
        }
        function processOrders(headers,rows) { const cols=matchOrderHeaders(headers); orderCols=cols;
            return rows.map(row=>{ const name=cols.riderName>=0?String(row[cols.riderName]||'').trim():''; if(!name) return null;
                return { riderName:name, completeTime:cols.completeTime>=0?parseDate(row[cols.completeTime]):null,
                    batchCollectTime:cols.batchCollectTime>=0?parseDate(row[cols.batchCollectTime]):null,
                    orderStatus:cols.orderStatus>=0?String(row[cols.orderStatus]||'').trim():'',
                    poiName:cols.poiName>=0?String(row[cols.poiName]||'').trim():'' };
            }).filter(Boolean);
        }
        function processAttendance(headers,rows) { const cols=matchAttendanceHeaders(headers); attCols=cols;
            return rows.map(row=>{ const name=cols.riderName>=0?String(row[cols.riderName]||'').trim():''; if(!name) return null;
                let status=0; if(cols.shiftStatus>=0){ const raw=String(row[cols.shiftStatus]||'0').trim(); const num=parseFloat(raw); status=(!isNaN(num)&&num>=1)?1:0; }
                if(status!==0) return null;
                return { riderName:name, shiftEndTime:cols.shiftEndTime>=0?parseDate(row[cols.shiftEndTime]):null,
                    shiftStartTime:cols.shiftStartTime>=0?parseDate(row[cols.shiftStartTime]):null };
            }).filter(Boolean);
        }

        function buildSummary() {
            const map={}; orderData.forEach(o=>{ const n=o.riderName; if(!map[n]) map[n]={name:n,orders:[],shiftEnd:null,latestComplete:null,latestCollect:null};
                map[n].orders.push(o); if(o.completeTime&&(!map[n].latestComplete||secOf(o.completeTime)>secOf(map[n].latestComplete))) map[n].latestComplete=o.completeTime;
                if(o.orderStatus==='已揽收'&&o.batchCollectTime){ if(!map[n].latestCollect||secOf(o.batchCollectTime)>secOf(map[n].latestCollect)) map[n].latestCollect=o.batchCollectTime; }
            });
            attendanceData.forEach(a=>{ const n=a.riderName; if(!map[n]) map[n]={name:n,orders:[],shiftEnd:null,latestComplete:null,latestCollect:null};
                if(a.shiftEndTime&&(!map[n].shiftEnd||secOf(a.shiftEndTime)>secOf(map[n].shiftEnd))) map[n].shiftEnd=a.shiftEndTime;
            });
            return Object.entries(map).map(([name,d])=>{
                let latest=null,isCollect=false,isDelivering=false; const cSec=secOf(d.latestComplete),lSec=secOf(d.latestCollect);
                if(cSec!==null&&lSec!==null){ if(lSec>cSec){ latest=d.latestCollect; isCollect=true; isDelivering=true; } else latest=d.latestComplete; }
                else if(cSec!==null) latest=d.latestComplete; else if(lSec!==null){ latest=d.latestCollect; isCollect=true; }
                let early=null; const sSec=secOf(d.shiftEnd),aSec=secOf(latest); if(!isDelivering&&sSec!==null&&aSec!==null) early=(sSec-aSec)*1000;
                const sorted=[...d.orders].sort((a,b)=>(secOf(b.completeTime)||0)-(secOf(a.completeTime)||0));
                return { riderName:name, shiftEndTime:d.shiftEnd, actualLatestTime:latest, isCollectLatest:isCollect, isDelivering, earlyLeaveMs:early, orders:sorted, orderCount:d.orders.length };
            });
        }

        function setSort(key) {
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                sortAsc = (key === 'early') ? false : true; // 早退默认降序，其他升序
            }
            updateSortHighlight();
            renderSummary();
        }

        // 移除所有高亮，仅为当前排序列添加高亮
        function updateSortHighlight() {
            document.querySelectorAll('#summaryTable th[id]').forEach(th => {
                th.classList.remove('sorted-header');
            });
            const currentTh = document.getElementById('sort-' + sortKey);
            if (currentTh) {
                currentTh.classList.add('sorted-header');
            }
        }

        function sortSummary(list) {
            const getValue = (rider, key) => {
                switch(key) {
                    case 'shiftEnd': return rider.shiftEndTime ? secOf(rider.shiftEndTime) : -1;
                    case 'latest': return rider.actualLatestTime ? secOf(rider.actualLatestTime) : -1;
                    case 'early': if (rider.isDelivering) return 86400000; return rider.earlyLeaveMs !== null ? rider.earlyLeaveMs : -Infinity;
                    case 'name': return rider.riderName;
                    default: return 0;
                }
            };
            return [...list].sort((a, b) => {
                const va = getValue(a, sortKey), vb = getValue(b, sortKey);
                if (va === vb) return 0;
                return sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
            });
        }

        function updateStatusIndicator() { const hasO=orderData.length>0,hasA=attendanceData.length>0; if(!hasO&&!hasA){statusIndicator.style.display='none';return;} statusIndicator.style.display='inline-flex'; const oOk=orderCols.riderName>=0&&orderCols.completeTime>=0&&orderCols.orderStatus>=0&&orderCols.batchCollectTime>=0; const aOk=attCols.riderName>=0&&attCols.shiftEndTime>=0&&attCols.shiftStartTime>=0&&attCols.shiftStatus>=0; globalDot.className='status-dot'+(oOk&&aOk?' all-ok':' partial'); }
        function updateUploadCards() { orderStatusDisplay.querySelector('.status-light').style.background=orderData.length?'var(--success)':'#c0c8d4'; orderStatusDisplay.querySelector('span:last-child').textContent=orderData.length?`已加载 (${orderData.length}条)`:'未加载'; attStatusDisplay.querySelector('.status-light').style.background=attendanceData.length?'var(--success)':'#c0c8d4'; attStatusDisplay.querySelector('span:last-child').textContent=attendanceData.length?`已加载 (${attendanceData.length}条)`:'未加载'; }

        window.openModal = function() { /* ... 状态弹窗代码保持不变 ... */ };
        window.closeStatusModal = function(e) { if(e.target===statusModalOverlay) statusModalOverlay.style.display='none'; };
        window.closeStatusModalDirect = function() { statusModalOverlay.style.display='none'; };

        function showOrderDetail(riderName) {
            const rider = summaryList.find(r => r.riderName === riderName);
            if (!rider) return;

            detailModalTitleText.textContent = `📋 ${riderName} 订单明细`;

            const sortedAsc = [...rider.orders].sort((a,b)=>(secOf(a.completeTime)??Number.MAX_SAFE_INTEGER)-(secOf(b.completeTime)??Number.MAX_SAFE_INTEGER));
            const intMap = new Map();
            sortedAsc.forEach((o,i)=>{ if(i===0) intMap.set(o,null); else { const cur=secOf(o.completeTime),prev=secOf(sortedAsc[i-1].completeTime); intMap.set(o,(cur!=null&&prev!=null)?(cur-prev)*1000:null); } });
            const display = [...rider.orders].sort((a,b)=>(secOf(b.completeTime)||0)-(secOf(a.completeTime)||0));

            detailTableBody.innerHTML = display.map(o => {
                const iv = intMap.get(o);
                const deli = o.orderStatus === '已揽收' ? '<span class="tag-delivering">派送中</span>' : (o.completeTime ? fmtTime(o.completeTime) : '<span class="na-text">-</span>');
                return `<tr>
                    <td>${o.batchCollectTime ? fmtTime(o.batchCollectTime) : '<span class="na-text">-</span>'}</td>
                    <td>${deli}</td>
                    <td>${iv===null ? '<span class="na-text">首单</span>' : iv!==undefined ? fmtDuration(iv) : '<span class="na-text">-</span>'}</td>
                    <td>${o.poiName || '<span class="na-text">-</span>'}</td>
                </tr>`;
            }).join('');

            detailModalOverlay.style.display = 'flex';
        }
        window.closeDetailModal = function(e) { if(e.target===detailModalOverlay) detailModalOverlay.style.display='none'; };
        window.closeDetailModalDirect = function() { detailModalOverlay.style.display='none'; };

        function renderSummary() {
            const allRiders = buildSummary(); const sorted = sortSummary(allRiders); summaryList = sorted; summaryBody.innerHTML = '';
            if(sorted.length===0){ summaryCard.style.display='block'; emptyState.style.display='block'; riderCount.textContent='0'; actionBtns.style.display='none'; return; }
            summaryCard.style.display='block'; emptyState.style.display='none'; riderCount.textContent=`${sorted.length} 位`; actionBtns.style.display='flex';
            sorted.forEach(r => { const tr=document.createElement('tr');
                tr.innerHTML = `<td>${r.shiftEndTime?fmtTime(r.shiftEndTime):'<span class="na-text">-</span>'}</td>
                    <td>${r.actualLatestTime?(r.isCollectLatest?`<span class="tag-collect">${fmtTime(r.actualLatestTime)}</span>`:fmtTime(r.actualLatestTime)):'<span class="na-text">-</span>'}</td>
                    <td>${r.isDelivering?'<span class="tag-delivering">🚚 派送中</span>':(r.earlyLeaveMs!==null?`<span class="${r.earlyLeaveMs>60000?'tag-positive':r.earlyLeaveMs<-60000?'tag-negative':'tag-zero'}">${fmtDuration(r.earlyLeaveMs)}</span>`:'<span class="na-text">-</span>')}</td>
                    <td><strong style="color:var(--primary);">${r.riderName}</strong> <small style="color:#8a99ae;">(${r.orderCount}单)</small></td>`;
                tr.addEventListener('click', () => showOrderDetail(r.riderName));
                summaryBody.appendChild(tr);
            });
            updateSortHighlight();
        }

        function refresh() { updateStatusIndicator(); updateUploadCards(); renderSummary(); }
        async function handleOrder(f) { if(!f) return; try{ const {headers,rows,name}=await parseExcel(f); orderData=processOrders(headers,rows); orderCard.classList.add('loaded'); toast(`订单加载完成 (${orderData.length}条)`); refresh(); }catch(e){toast(e.message,'error');clearOrder();} }
        async function handleAtt(f) { if(!f) return; try{ const {headers,rows,name}=await parseExcel(f); attendanceData=processAttendance(headers,rows); attCard.classList.add('loaded'); toast(`考勤加载完成 (${attendanceData.length}条)`); refresh(); }catch(e){toast(e.message,'error');clearAtt();} }
        function clearOrder(){ orderData=[]; orderFile.value=''; orderCard.classList.remove('loaded'); }
        function clearAtt(){ attendanceData=[]; attFile.value=''; attCard.classList.remove('loaded'); }

        orderFile.addEventListener('change', ()=>handleOrder(orderFile.files[0]));
        attFile.addEventListener('change', ()=>handleAtt(attFile.files[0]));
        orderRemoveBtn.addEventListener('click',(e)=>{ e.stopPropagation(); clearOrder(); refresh(); toast('订单已移除','warning'); });
        attRemoveBtn.addEventListener('click',(e)=>{ e.stopPropagation(); clearAtt(); refresh(); toast('考勤已移除','warning'); });
        clearAllBtn.addEventListener('click',()=>{ clearOrder(); clearAtt(); summaryList=[]; refresh(); summaryCard.style.display='none'; actionBtns.style.display='none'; statusIndicator.style.display='none'; toast('已清除全部数据','warning'); });
        exportBtn.addEventListener('click',()=>{ if(!summaryList.length) return toast('无数据可导出','error'); const rows=[['姓名','下班时间','最晚送达','早退状态','订单数量']]; summaryList.forEach(r=>rows.push([r.riderName,r.shiftEndTime?fmtTime(r.shiftEndTime):'',r.actualLatestTime?fmtTime(r.actualLatestTime):'',r.isDelivering?'派送中':(r.earlyLeaveMs!==null?fmtDuration(r.earlyLeaveMs):'-'),r.orderCount])); const ws=XLSX.utils.aoa_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'汇总'); XLSX.writeFile(wb,`骑手早退_${new Date().toISOString().slice(0,10)}.xlsx`); toast('导出成功'); });

        [orderCard,attCard].forEach(card=>{ card.addEventListener('dragover',e=>{ e.preventDefault(); card.style.borderColor='var(--primary)'; }); card.addEventListener('dragleave',e=>{ if(!card.classList.contains('loaded')) card.style.borderColor=''; }); card.addEventListener('drop',e=>{ e.preventDefault(); if(!card.classList.contains('loaded')) card.style.borderColor=''; const file=e.dataTransfer.files[0]; if(!file) return; const input=card.querySelector('input[type="file"]'); const dt=new DataTransfer(); dt.items.add(file); input.files=dt.files; input.dispatchEvent(new Event('change')); }); });

        summaryCard.style.display='none'; actionBtns.style.display='none';
    })();
</script>
</body>
</html>
