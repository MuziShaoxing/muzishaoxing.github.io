<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Excel通讯录转换 · 电脑手机通用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px 8px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 24px 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header .subtitle {
            font-size: 22px;
            opacity: 0.95;
            margin-bottom: 16px;
        }

        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            background: rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 24px;
            white-space: nowrap;
        }

        .content {
            padding: 16px;
        }

        .top-three-panels {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .panel {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #e9ecef;
        }

        .panel-upload {
            flex: 1.56;
            min-width: 260px;
        }

        .panel-files {
            flex: 0.54;
            min-width: 150px;
        }

        .panel-mapping {
            flex: 1;
            min-width: 260px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-title .badge {
            background: #4a90e2;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            background: white;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .upload-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 14px;
            color: #999;
            margin-bottom: 16px;
        }

        .upload-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .file-count {
            color: #4a90e2;
            font-weight: 600;
            font-size: 13px;
        }

        .file-items-container {
            max-height: 250px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: white;
            -webkit-overflow-scrolling: touch;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-name {
            color: #333;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .file-remove {
            color: #dc3545;
            font-size: 14px;
            padding: 2px 4px;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 6px;
        }

        .empty-files-msg {
            text-align: center;
            padding: 20px 8px;
            color: #999;
            font-size: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .mapping-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .mapping-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mapping-item label {
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .mapping-item input {
            width: 56px;
            padding: 6px 4px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            text-transform: uppercase;
            text-align: center;
            font-weight: 500;
            -webkit-appearance: none;
        }

        .mapping-item input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .default-hint-left {
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .divider {
            border-top: 1px solid #e9ecef;
            margin: 10px 0;
        }

        .checkbox-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-row-3 {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #f0f4f8;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1.5px solid transparent;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            user-select: none;
            flex: 0 1 auto;
        }

        .chip-checkbox:hover {
            background: #e4ecf5;
        }

        .chip-checkbox input {
            display: none;
        }

        .chip-checkbox .check-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .chip-checkbox input:checked + .check-icon {
            background: #4a90e2;
            border-color: #4a90e2;
        }

        .chip-checkbox input:checked + .check-icon::after {
            content: "✓";
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .chip-checkbox input:checked ~ span:last-child {
            color: #4a90e2;
        }

        .separator-ghost {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: transparent;
            border-radius: 8px;
        }

        .separator-ghost label {
            font-size: 14px;
            font-weight: 500;
            color: #666;
        }

        .separator-ghost input {
            width: 45px;
            padding: 6px 4px;
            border: none;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
            text-align: center;
            background: transparent;
            transition: border-color 0.2s;
        }

        .separator-ghost input:focus {
            outline: none;
            border-bottom-color: #4a90e2;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-appearance: none;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            box-shadow: 0 2px 6px rgba(74, 144, 226, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20a038 100%);
            color: white;
            box-shadow: 0 2px 6px rgba(40, 167, 69, 0.3);
        }

        .btn-success:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
        }

        .btn-outline {
            background: white;
            color: #555;
            border: 1px solid #ddd;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-folder {
            background: white;
            color: #4a90e2;
            border: 1px solid #4a90e2;
        }

        .btn-block {
            width: 100%;
        }

        .preview-section {
            margin-top: 10px;
        }

        .preview-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .preview-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
        }

        .preview-stats-center {
            padding: 6px 12px;
            font-size: 15px;
            color: #4a90e2;
            flex: 1;
            text-align: center;
            min-width: 200px;
            font-weight: 500;
        }

        .table-container {
            max-height: 350px;
            overflow: auto;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            background: white;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: auto;
        }

        th {
            background: #f8f9fa;
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
            font-size: 13px;
        }

        td {
            padding: 9px 8px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 13px;
            text-align: center;
        }

        th:first-child, td:first-child {
            width: 50px;
            min-width: 50px;
            max-width: 100px;
            white-space: nowrap;
        }

        th:nth-child(2), td:nth-child(2) {
            width: 80px;
            min-width: 80px;
            max-width: 150px;
            white-space: nowrap;
        }

        th:nth-child(3), td:nth-child(3) {
            min-width: 120px;
            max-width: 200px;
            word-break: break-word;
            white-space: normal;
        }

        th:nth-child(4), td:nth-child(4) {
            min-width: 100px;
        }

        .empty-table-msg {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 14px;
        }

        .status-bar {
            margin-top: 12px;
            padding: 8px 14px;
            background: #f8f9fa;
            border-radius: 24px;
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e9ecef;
            border-top-color: #4a90e2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 手机端 */
        @media (max-width: 768px) {
            .btn-folder {
                display: none !important;
            }

            .feature-item:nth-child(3) {
                display: none !important;
            }

            .upload-buttons {
                justify-content: center;
            }

            .top-three-panels {
                flex-direction: column;
                gap: 10px;
            }

            .panel-upload, .panel-files, .panel-mapping {
                min-width: auto;
            }

            .file-items-container {
                max-height: 250px;
                overflow-x: hidden;
            }

            .checkbox-row-3 {
                gap: 6px;
            }

            .chip-checkbox {
                padding: 6px 10px;
                font-size: 12px;
                gap: 4px;
            }

            .chip-checkbox .check-icon {
                width: 16px;
                height: 16px;
            }

            .chip-checkbox input:checked + .check-icon::after {
                font-size: 10px;
            }

            .separator-ghost {
                padding: 4px 6px;
            }

            .separator-ghost label {
                font-size: 12px;
            }

            .separator-ghost input {
                width: 40px;
                padding: 4px 2px;
                font-size: 12px;
            }

            .default-hint-left {
                font-size: 10px;
            }

            .preview-header {
                flex-direction: column;
                align-items: stretch;
            }

            .preview-stats-center {
                text-align: center;
                font-size: 13px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header .subtitle {
                font-size: 16px;
            }

            .feature-item {
                font-size: 12px;
                padding: 3px 10px;
            }

            .table-container {
                max-height: 300px;
                border-radius: 6px;
            }

            table {
                font-size: 11px;
            }

            th {
                padding: 6px 3px;
                font-size: 11px;
            }

            td {
                padding: 5px 3px;
                font-size: 11px;
            }

            th:first-child, td:first-child {
                width: 32px;
                min-width: 32px;
                max-width: 32px;
                white-space: nowrap;
            }

            th:nth-child(2), td:nth-child(2) {
                width: 50px;
                min-width: 50px;
                max-width: 70px;
                white-space: nowrap;
            }

            th:nth-child(3), td:nth-child(3) {
                min-width: 90px;
                max-width: 120px;
                word-break: break-all;
                white-space: normal;
            }

            th:nth-child(4), td:nth-child(4) {
                min-width: 60px;
                white-space: nowrap;
            }

            .mapping-row {
                gap: 8px;
            }

            .mapping-item label {
                font-size: 12px;
            }

            .mapping-item input {
                width: 45px;
                padding: 4px 2px;
                font-size: 12px;
            }

            .panel-title {
                font-size: 14px;
            }

            .panel-title .badge {
                width: 20px;
                height: 20px;
                font-size: 11px;
            }

            .upload-icon {
                font-size: 36px;
            }

            .upload-text {
                font-size: 14px;
            }

            .upload-hint {
                font-size: 11px;
            }

            .btn {
                padding: 8px 14px;
                font-size: 14px;
            }
        }

        /* 电脑端 */
        @media (min-width: 769px) {
            body {
                padding: 16px;
            }

            .header {
                padding: 28px 36px 22px;
            }

            .header h1 {
                font-size: 52px;
            }

            .header .subtitle {
                font-size: 30px;
            }

            .feature-item {
                font-size: 22px;
                padding: 10px 26px;
            }

            .content {
                padding: 20px;
            }

            .panel {
                padding: 18px;
            }

            .panel-mapping {
                min-width: 300px;
            }

            .panel-title {
                font-size: 20px;
            }

            .panel-title .badge {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .upload-icon {
                font-size: 64px;
            }

            .upload-text {
                font-size: 24px;
            }

            .upload-hint {
                font-size: 18px;
            }

            .btn {
                padding: 14px 28px;
                font-size: 20px;
            }

            .file-items-container {
                max-height: 250px;
            }

            .file-name {
                font-size: 15px;
            }

            .file-count {
                font-size: 16px;
            }

            .mapping-item label {
                font-size: 18px;
            }

            .mapping-item input {
                width: 72px;
                padding: 8px 6px;
                font-size: 18px;
            }

            .default-hint-left {
                font-size: 14px;
            }

            .checkbox-row-3 {
                gap: 12px;
            }

            .chip-checkbox {
                padding: 10px 18px;
                font-size: 18px;
                gap: 8px;
            }

            .chip-checkbox .check-icon {
                width: 24px;
                height: 24px;
            }

            .chip-checkbox input:checked + .check-icon::after {
                font-size: 16px;
            }

            .separator-ghost {
                padding: 6px 8px;
            }

            .separator-ghost label {
                font-size: 18px;
            }

            .separator-ghost input {
                width: 50px;
                padding: 6px 4px;
                font-size: 16px;
            }

            .table-container {
                max-height: 450px;
            }

            table {
                font-size: 20px;
            }

            th {
                padding: 14px 12px;
                font-size: 20px;
            }

            td {
                padding: 12px 12px;
                font-size: 20px;
            }

            th:first-child, td:first-child {
                min-width: 60px;
                max-width: 100px;
            }

            th:nth-child(2), td:nth-child(2) {
                min-width: 100px;
                max-width: 150px;
            }

            th:nth-child(3), td:nth-child(3) {
                min-width: 140px;
                max-width: 200px;
            }

            .preview-title {
                font-size: 20px;
            }

            .preview-stats-center {
                font-size: 20px;
                padding: 10px 18px;
            }

            .status-bar {
                font-size: 16px;
                padding: 10px 18px;
            }

            .empty-table-msg {
                font-size: 18px;
                padding: 40px;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>📇</span>
                Excel转通讯录
                <span>📇</span>
            </h1>
            <div class="subtitle">Excel 秒变 vCard · 电脑手机通用</div>
            <div class="features">
                <span class="feature-item">🔒 本地处理</span>
                <span class="feature-item">⚡ 无限数量</span>
                <span class="feature-item">📂 支持文件夹</span>
                <span class="feature-item">🆓 免费</span>
            </div>
        </div>

        <div class="content">
            <div class="top-three-panels">
                <div class="panel panel-upload">
                    <div class="panel-title">
                        <span class="badge">1</span>
                        选择文件
                    </div>
                    <div class="upload-area">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">点击按钮选择文件或文件夹</div>
                        <div class="upload-hint">支持 .xlsx / .xls 格式，可多选</div>
                        <div class="upload-buttons">
                            <button class="btn btn-outline" id="selectFilesBtn">
                                <span>📄</span>
                                选择文件
                            </button>
                            <button class="btn btn-folder" id="selectFolderBtn">
                                <span>📂</span>
                                选择文件夹
                            </button>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" multiple style="display: none;">
                    <input type="file" id="folderInput" webkitdirectory multiple style="display: none;">
                </div>

                <div class="panel panel-files">
                    <div class="panel-title">
                        <span class="badge">📋</span>
                        已选
                        <span class="file-count" id="fileCount">(0)</span>
                        <button class="btn btn-outline btn-small" id="clearFilesBtn" style="margin-left: auto; padding:4px 8px; font-size:11px;">🗑️</button>
                    </div>
                    <div class="file-items-container" id="fileItems">
                        <div id="emptyFilesMsg" class="empty-files-msg" style="border: none; padding: 25px 8px;">
                            暂无
                        </div>
                    </div>
                </div>

                <div class="panel panel-mapping">
                    <div class="panel-title">
                        <span class="badge">2</span>
                        列映射
                    </div>
                    
                    <div class="mapping-row">
                        <div class="mapping-item">
                            <label>姓名</label>
                            <input type="text" id="nameCol" value="AD" maxlength="3">
                        </div>
                        <div class="mapping-item">
                            <label>电话</label>
                            <input type="text" id="phoneCol" value="AE" maxlength="3">
                        </div>
                        <div class="mapping-item">
                            <label>公司</label>
                            <input type="text" id="companyCol" value="AF" maxlength="3">
                        </div>
                    </div>
                    <div class="default-hint-left">默认 AD / AE / AF</div>

                    <div class="divider"></div>

                    <div class="checkbox-grid">
                        <div class="checkbox-row-3">
                            <label class="chip-checkbox">
                                <input type="checkbox" id="skipFirstRow" checked>
                                <span class="check-icon"></span>
                                <span>跳过标题</span>
                            </label>
                            <label class="chip-checkbox">
                                <input type="checkbox" id="phoneMustBeNumber" checked>
                                <span class="check-icon"></span>
                                <span>数字电话</span>
                            </label>
                            <label class="chip-checkbox">
                                <input type="checkbox" id="filterEmptyName" checked>
                                <span class="check-icon"></span>
                                <span>非空姓名</span>
                            </label>
                        </div>
                        <div class="checkbox-row-3">
                            <label class="chip-checkbox">
                                <input type="checkbox" id="phoneLengthCheck" checked>
                                <span class="check-icon"></span>
                                <span>号码检测</span>
                            </label>
                            <label class="chip-checkbox">
                                <input type="checkbox" id="mergeDuplicates" checked>
                                <span class="check-icon"></span>
                                <span>合并同名</span>
                            </label>
                            <div class="separator-ghost">
                                <label>分隔：</label>
                                <input type="text" id="separator" value="; " maxlength="3">
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block" id="loadBtn" disabled>
                        <span>📂</span>
                        加载并预览
                    </button>
                </div>
            </div>

            <!-- 预览区域 -->
            <div class="preview-section">
                <div class="preview-header">
                    <div class="preview-title">
                        <span class="badge" style="display: inline-flex; margin-right: 8px; width:24px; height:24px; font-size:13px; background:#4a90e2; color:white; border-radius:50%; align-items:center; justify-content:center;">3</span>
                        数据预览
                    </div>
                    <div class="preview-stats-center" id="previewStats">未加载数据</div>
                    <button class="btn btn-success" id="exportBtn" disabled>
                        <span>⬇️</span>
                        导出 vCard
                    </button>
                </div>

                <div class="table-container">
                    <table id="previewTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>公司</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 状态栏 -->
            <div class="status-bar">
                <span id="statusIcon">💡</span>
                <span id="statusText">等待选择文件...</span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span>处理中</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script>
        (function() {
            'use strict';

            const fileInput = document.getElementById('fileInput');
            const folderInput = document.getElementById('folderInput');
            const selectFilesBtn = document.getElementById('selectFilesBtn');
            const selectFolderBtn = document.getElementById('selectFolderBtn');
            const fileItems = document.getElementById('fileItems');
            const fileCount = document.getElementById('fileCount');
            const clearFilesBtn = document.getElementById('clearFilesBtn');
            const loadBtn = document.getElementById('loadBtn');
            const exportBtn = document.getElementById('exportBtn');
            const tableBody = document.getElementById('tableBody');
            const previewStats = document.getElementById('previewStats');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const loading = document.getElementById('loading');

            const nameColInput = document.getElementById('nameCol');
            const phoneColInput = document.getElementById('phoneCol');
            const companyColInput = document.getElementById('companyCol');
            const skipFirstRow = document.getElementById('skipFirstRow');
            const phoneMustBeNumber = document.getElementById('phoneMustBeNumber');
            const filterEmptyName = document.getElementById('filterEmptyName');
            const phoneLengthCheck = document.getElementById('phoneLengthCheck');
            const mergeDuplicates = document.getElementById('mergeDuplicates');
            const separatorInput = document.getElementById('separator');

            let selectedFiles = [];
            let processedContacts = [];
            let skippedRowsCount = 0;
            let nonNumericPhoneCount = 0;
            let invalidLengthCount = 0;

            function truncateFileName(fileName, maxLen = 25) {
                if (fileName.length <= maxLen) return fileName;
                const lastDot = fileName.lastIndexOf('.');
                if (lastDot === -1) return fileName.slice(0, maxLen - 3) + '...';
                const name = fileName.slice(0, lastDot);
                const ext = fileName.slice(lastDot);
                const availableForName = maxLen - ext.length;
                if (availableForName <= 5) return name.slice(0, availableForName - 3) + '...' + ext;
                const headLen = Math.floor(availableForName * 0.5);
                const tailLen = 3;
                return name.slice(0, headLen) + '*' + name.slice(-tailLen) + ext;
            }

            function initEvents() {
                selectFilesBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.value = ''; fileInput.click(); });
                selectFolderBtn.addEventListener('click', (e) => { e.stopPropagation(); folderInput.value = ''; folderInput.click(); });
                fileInput.addEventListener('change', function() { if (this.files.length) addFiles(Array.from(this.files)); });
                folderInput.addEventListener('change', function() {
                    const files = Array.from(this.files).filter(f => f.name.toLowerCase().match(/\.(xlsx|xls)$/));
                    files.length ? addFiles(files) : updateStatus('⚠️', '文件夹中无 Excel 文件');
                });
                clearFilesBtn.addEventListener('click', clearFiles);
                loadBtn.addEventListener('click', loadAndPreview);
                exportBtn.addEventListener('click', exportVCard);
                [nameColInput, phoneColInput, companyColInput].forEach(i => i.addEventListener('input', e => e.target.value = e.target.value.toUpperCase()));
            }

            function addFiles(files) {
                let added = 0;
                files.forEach(f => { if (!selectedFiles.some(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified)) { selectedFiles.push(f); added++; } });
                if (added) { renderFileList(); updateStatus('📁', `已添加 ${added} 个文件`); }
                updateButtonStates();
            }

            function renderFileList() {
                fileCount.textContent = `(${selectedFiles.length})`;
                if (!selectedFiles.length) { fileItems.innerHTML = '<div class="empty-files-msg" style="border: none; padding: 25px 8px;">暂无</div>'; return; }
                let html = '';
                [...selectedFiles].sort((a,b) => a.name.localeCompare(b.name, 'zh-CN')).forEach(f => {
                    const idx = selectedFiles.findIndex(sf => sf.name === f.name && sf.size === f.size && sf.lastModified === f.lastModified);
                    html += `<div class="file-item"><span class="file-name" title="${f.name}">📄 ${truncateFileName(f.name, 25)}</span><span class="file-remove" data-index="${idx}">✕</span></div>`;
                });
                fileItems.innerHTML = html;
                fileItems.querySelectorAll('.file-remove').forEach(btn => btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx)) { selectedFiles.splice(idx, 1); renderFileList(); updateButtonStates(); updateStatus(selectedFiles.length ? '📁' : '💡', selectedFiles.length ? `已选择 ${selectedFiles.length} 个文件` : '等待选择文件...'); }
                }));
            }

            function clearFiles() { selectedFiles = []; processedContacts = []; renderFileList(); renderEmptyTable(); previewStats.textContent = '未加载数据'; updateStatus('💡', '等待选择文件...'); updateButtonStates(); }
            function updateButtonStates() { loadBtn.disabled = !selectedFiles.length; exportBtn.disabled = !processedContacts.length; }
            function updateStatus(icon, text) { statusIcon.textContent = icon; statusText.textContent = text; }
            function setLoading(l) { loading.classList.toggle('show', l); }
            function renderEmptyTable() { tableBody.innerHTML = '<tr><td colspan="4" class="empty-table-msg">点击"加载并预览"查看</td></tr>'; }

            function colToIdx(letter) { let r = 0; for (let c of letter.toUpperCase()) r = r * 26 + (c.charCodeAt(0) - 64); return r - 1; }
            
            // 检查是否为纯数字（允许空格）
            function isNumeric(s) { return s && /^\d+$/.test(String(s).replace(/\s+/g, '')); }
            
            // 检查是否为11位数字（允许空格）
            function isValidPhoneLength(phone) {
                if (!phone) return false;
                const digits = String(phone).replace(/\s+/g, '');
                return digits.length === 11;
            }

            function cleanPhone(v) {
                if (v == null || v === '') return '';
                const s = String(v).trim();
                if (s === 'nan' || s === 'NaN') return '';
                if (s.includes('.')) { const n = parseFloat(s); if (!isNaN(n) && Number.isInteger(n)) return String(Math.floor(n)); }
                return s;
            }
            
            function cleanText(v) { if (v == null || v === '') return ''; const s = String(v).trim(); return (s === 'nan' || s === 'NaN') ? '' : s; }

            async function loadAndPreview() {
                if (!selectedFiles.length) return updateStatus('⚠️', '请先选择文件');
                const nameL = nameColInput.value.trim().toUpperCase();
                const phoneL = phoneColInput.value.trim().toUpperCase();
                if (!nameL || !phoneL) return updateStatus('⚠️', '请设置姓名和电话列');
                
                setLoading(true); updateStatus('📂', '读取中...');
                skippedRowsCount = 0; nonNumericPhoneCount = 0; invalidLengthCount = 0;
                
                try {
                    const nIdx = colToIdx(nameL), pIdx = colToIdx(phoneL), cIdx = companyColInput.value.trim() ? colToIdx(companyColInput.value.trim().toUpperCase()) : -1;
                    let raw = [], skippedFiles = 0;
                    
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const f = selectedFiles[i];
                        updateStatus('📂', `${i+1}/${selectedFiles.length} ${f.name}`);
                        try {
                            const data = await readExcel(f);
                            if (!data.length || nIdx >= data[0].length || pIdx >= data[0].length) { skippedFiles++; continue; }
                            const start = skipFirstRow.checked ? 1 : 0;
                            for (let r = start; r < data.length; r++) {
                                const row = data[r];
                                const name = cleanText(row[nIdx]);
                                let phone = cleanPhone(row[pIdx]);
                                const company = cIdx >= 0 && cIdx < row.length ? cleanText(row[cIdx]) : '';
                                
                                // 过滤空姓名
                                if (filterEmptyName.checked && !name) { skippedRowsCount++; continue; }
                                
                                // 号码检测：必须为11位数字
                                if (phoneLengthCheck.checked) {
                                    if (!phone) { skippedRowsCount++; continue; }
                                    const digits = phone.replace(/\s+/g, '');
                                    if (!/^\d+$/.test(digits)) {
                                        nonNumericPhoneCount++;
                                        continue;
                                    }
                                    if (digits.length !== 11) {
                                        invalidLengthCount++;
                                        continue;
                                    }
                                }
                                
                                // 数字电话检测（仅当号码检测未勾选时生效）
                                if (!phoneLengthCheck.checked && phoneMustBeNumber.checked && phone && !isNumeric(phone)) {
                                    nonNumericPhoneCount++;
                                    continue;
                                }
                                
                                if (name) raw.push({ name, phone, company });
                            }
                        } catch { skippedFiles++; }
                    }
                    
                    if (!raw.length) {
                        updateStatus('⚠️', '无有效数据'); previewStats.textContent = '未读取到数据';
                        renderEmptyTable(); processedContacts = []; setLoading(false); updateButtonStates(); return;
                    }
                    
                    updateStatus('🔄', '合并中...');
                    processedContacts = mergeDuplicates.checked ? mergeContacts(raw) : raw;
                    
                    const cnt = processedContacts.length;
                    let statsText = `📊 有效 ${raw.length} 条`;
                    const details = [];
                    if (skipFirstRow.checked) details.push('跳过标题');
                    if (phoneLengthCheck.checked) {
                        if (skippedRowsCount) details.push(`空号${skippedRowsCount}`);
                        if (nonNumericPhoneCount) details.push(`非数字${nonNumericPhoneCount}`);
                        if (invalidLengthCount) details.push(`位数异常${invalidLengthCount}`);
                    } else {
                        if (skippedRowsCount) details.push(`空值${skippedRowsCount}`);
                        if (nonNumericPhoneCount) details.push(`非数字${nonNumericPhoneCount}`);
                    }
                    if (details.length) statsText += ` (${details.join('·')})`;
                    statsText += mergeDuplicates.checked ? ` → ${cnt}人` : ` → ${cnt}人`;
                    if (skippedFiles) statsText += ` · 跳过${skippedFiles}文件`;
                    previewStats.textContent = statsText;
                    
                    renderPreview();
                    updateStatus('✅', `完成，共 ${cnt} 人`);
                    setLoading(false); updateButtonStates();
                } catch (e) {
                    updateStatus('❌', '加载失败'); setLoading(false); processedContacts = []; renderEmptyTable(); updateButtonStates();
                }
            }

            function readExcel(f) {
                return new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = e => { try { const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'}); res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1})); } catch(er) { rej(er); } };
                    r.onerror = rej;
                    r.readAsArrayBuffer(f);
                });
            }

            function mergeContacts(data) {
                const m = new Map(), sep = separatorInput.value || '; ';
                data.forEach(({name, phone, company}) => {
                    if (!m.has(name)) m.set(name, {phones: new Set(), company: ''});
                    const d = m.get(name);
                    if (phone) d.phones.add(phone);
                    if (company && !d.company) d.company = company;
                });
                return Array.from(m, ([name, {phones, company}]) => ({ name, phone: [...phones].sort().join(sep), company }));
            }

            function renderPreview() {
                if (!processedContacts.length) return renderEmptyTable();
                const preview = processedContacts.slice(0, 500);
                let html = '';
                preview.forEach((c, i) => html += `<tr><td>${i+1}</td><td>${escapeHtml(c.name)||'-'}</td><td>${escapeHtml(c.phone)||'-'}</td><td>${escapeHtml(c.company)||'-'}</td></tr>`);
                tableBody.innerHTML = html;
                if (processedContacts.length > 500) updateStatus('📋', `预览前500条，共${processedContacts.length}条`);
            }

            function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

            function exportVCard() {
                if (!processedContacts.length) return updateStatus('⚠️', '无数据');
                const sep = separatorInput.value || '; ';
                let content = '';
                processedContacts.forEach((c, i) => {
                    let card = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
                    card += `FN:${c.name.trim()}\r\nN:;${c.name.trim()};;;\r\n`;
                    if (c.company) card += `ORG:${c.company.trim()}\r\n`;
                    if (c.phone) c.phone.split(sep).map(p => p.trim()).filter(p=>p).forEach(p => card += `TEL:${p}\r\n`);
                    content += card + 'END:VCARD' + (i < processedContacts.length-1 ? '\r\n' : '');
                });
                
                // 生成时间格式：20250201-1430
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const timeStr = `${year}${month}${day}-${hours}${minutes}`;
                const name = `通讯录导出_${timeStr}.vcf`;
                
                const blob = new Blob([content], {type:'text/vcard;charset=utf-8'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = name;
                a.click(); 
                setTimeout(() => URL.revokeObjectURL(a.href), 100);
                updateStatus('✅', `导出成功！${processedContacts.length}人`);
            }

            initEvents();
        })();
    </script>
</body>
</html>
