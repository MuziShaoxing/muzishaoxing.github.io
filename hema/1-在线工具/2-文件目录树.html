<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地目录树生成器 - 纯本地运行</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4a6fa5;
      --primary-light: #7da3e6;
      --secondary-color: #6c8dcd;
      --background-color: #f9fbff;
      --surface-color: #ffffff;
      --error-color: #d32f2f;
      --text-primary: #1d2430;
      --text-secondary: #4a5a7a;
      --border-color: #e0ebff;
      --hover-color: #f3f8ff;
      --shadow-color: rgba(108, 141, 205, 0.15);
      --success-color: #388e3c;
      --border-radius: 12px;
      --spacing: 20px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--background-color);
      color: var(--text-primary);
      padding: 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      height: 90vh;
      width: 900px;
      max-width: 95%;
      padding: var(--spacing);
      background-color: var(--surface-color);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 20px var(--shadow-color);
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--spacing);
      padding-bottom: var(--spacing);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background-color: var(--primary-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-hint {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.4;
      max-width: 90%;
    }

    .action-area {
      margin-bottom: var(--spacing);
    }

    .folder-selector {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: var(--spacing);
    }

    .btn {
      padding: 16px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      width: 100%;
    }

    .btn:hover {
      background-color: var(--secondary-color);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px var(--shadow-color);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-secondary {
      background-color: white;
      color: var(--primary-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--hover-color);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: var(--spacing);
      padding: 18px;
      background-color: var(--hover-color);
      border-radius: var(--border-radius);
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-item label {
      font-size: 16px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .setting-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .preview-area {
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      background-color: var(--surface-color);
      margin-bottom: var(--spacing);
      position: relative;
    }

    .preview-content {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .tree-preview {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre;
    }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-secondary);
      font-size: 17px;
    }

    .drag-over {
      background-color: var(--hover-color);
      border-color: var(--primary-color);
    }

    footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status {
      font-size: 15px;
      color: var(--text-secondary);
      text-align: center;
      padding: 12px;
      border-radius: var(--border-radius);
      background-color: var(--hover-color);
    }

    .status.success {
      color: var(--success-color);
      background-color: rgba(56, 142, 60, 0.1);
    }

    .status.error {
      color: var(--error-color);
      background-color: rgba(211, 47, 47, 0.1);
    }

    .preview-content::-webkit-scrollbar {
      width: 10px;
    }

    .preview-content::-webkit-scrollbar-track {
      background: rgba(108, 141, 205, 0.05);
      border-radius: 4px;
    }

    .preview-content::-webkit-scrollbar-thumb {
      background: rgba(108, 141, 205, 0.2);
      border-radius: 4px;
    }

    .preview-content::-webkit-scrollbar-thumb:hover {
      background: rgba(108, 141, 205, 0.3);
    }

    .loader {
      display: none;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(108, 141, 205, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      :root {
        --spacing: 12px;
      }
      .btn, .setting-item label, .tree-preview {
        font-size: 14px;
      }
      .logo-text {
        font-size: 20px;
      }
      .header-hint {
        font-size: 13px;
      }
      main {
        height: auto;
        min-height: 80vh;
      }
    }
  </style>
</head>
<body>
<main class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <span class="material-icons">folder</span>
      </div>
      <div class="logo-text">本地文件夹目录树生成器</div>
    </div>
    <div class="header-hint">
      将HTML文件置于目标文件夹根目录，通过浏览器打开可直观展示文件夹结构，便捷高效管理文件，提升工作效率。
    </div>
    <div class="header-hint">
      本页面纯本地运行，网页不联网收集传输任何内容
    </div>
  </header>

  <section class="action-area">
    <div class="folder-selector">
      <button id="selectFolderBtn" class="btn" aria-label="选择要生成目录树的文件夹">
        <span class="material-icons">folder_open</span>
        选择文件夹
      </button>
      <button id="generateBtn" class="btn btn-secondary" disabled aria-label="生成目录树HTML文件">
        <span class="material-icons">download</span>
        生成HTML文件
      </button>
    </div>

    <div class="settings">
      <div class="setting-item">
        <input type="checkbox" id="includeHidden">
        <label for="includeHidden">包含"隐藏"文件/文件夹（以.开头的）</label>
      </div>
    </div>
  </section>

  <section class="preview-area" id="dropArea">
    <div class="preview-content">
      <div id="treePreview" class="tree-preview"></div>
      <div id="emptyState" class="empty-state">
        <span class="material-icons" style="font-size: 70px; color: #e0ebff;">folder_open</span>
        <p>请选择一个文件夹开始</p>
        <p class="drag-hint" style="margin-top: 10px; color: var(--text-secondary);">或拖拽文件夹至此处</p>
      </div>
    </div>
  </section>

  <footer>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="loader" class="loader"></div>
  </footer>
</main>

<script>
  (function() {
    const selectFolderBtn = document.getElementById('selectFolderBtn');
    const generateBtn = document.getElementById('generateBtn');
    const includeHiddenCheckbox = document.getElementById('includeHidden');
    const treePreview = document.getElementById('treePreview');
    const emptyState = document.getElementById('emptyState');
    const statusDiv = document.getElementById('status');
    const loader = document.getElementById('loader');
    const dropArea = document.getElementById('dropArea');

    let selectedFolderHandle = null;
    let treeStructure = null;

    function showLoading(show) {
      loader.style.display = show ? 'block' : 'none';
      selectFolderBtn.disabled = show;
      generateBtn.disabled = show || !selectedFolderHandle;
      includeHiddenCheckbox.disabled = show;
    }

    function setStatus(text, type) {
      statusDiv.textContent = text;
      statusDiv.className = 'status';
      if (type === 'success') statusDiv.classList.add('success');
      if (type === 'error') statusDiv.classList.add('error');
    }

    async function generateDirectoryTree(directoryHandle, path = '', level = 0) {
      const tree = {
        name: directoryHandle.name,
        path: path,
        type: 'directory',
        level: level,
        children: []
      };
      for await (const entry of directoryHandle.values()) {
        if (!includeHiddenCheckbox.checked && entry.name.startsWith('.')) {
          continue;
        }
        try {
          if (entry.kind === 'directory') {
            const childTree = await generateDirectoryTree(
              entry,
              path ? path + '/' + entry.name : entry.name,
              level + 1
            );
            tree.children.push(childTree);
          } else if (entry.kind === 'file') {
            tree.children.push({
              name: entry.name,
              path: path ? path + '/' + entry.name : entry.name,
              type: 'file',
              level: level + 1
            });
          }
        } catch (e) {
          console.warn('无法访问', entry.name, e);
        }
      }
      tree.children.sort(function(a, b) {
        if (a.type === 'directory' && b.type !== 'directory') return -1;
        if (a.type !== 'directory' && b.type === 'directory') return 1;
        return a.name.localeCompare(b.name);
      });
      return tree;
    }

    function displayTreePreview(tree) {
      let previewText = '📁 ' + tree.name + '\n';
      
      function buildPreview(node, prefix, isLast) {
        var connector = prefix + (isLast ? '└── ' : '├── ');
        var icon = node.type === 'directory' ? '📂' : '📄';
        previewText += connector + icon + ' ' + node.name + '\n';
        if (node.children && node.children.length) {
          var newPrefix = prefix + (isLast ? '    ' : '│   ');
          for (var i = 0; i < node.children.length; i++) {
            var child = node.children[i];
            var childIsLast = i === node.children.length - 1;
            buildPreview(child, newPrefix, childIsLast);
          }
        }
      }
      
      if (tree.children && tree.children.length) {
        for (var i = 0; i < tree.children.length; i++) {
          var child = tree.children[i];
          var childIsLast = i === tree.children.length - 1;
          buildPreview(child, '', childIsLast);
        }
      }
      treePreview.textContent = previewText;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function buildTreeHTML(node) {
      var html = '<li>' +
        '<div class="directory-wrapper">' +
        '<span class="toggle"><span class="material-icons">chevron_right</span></span>' +
        '<span class="directory">' + escapeHtml(node.name) + '</span>' +
        '</div><ul>';
      
      for (var i = 0; i < node.children.length; i++) {
        var child = node.children[i];
        if (child.type === 'file') {
          var filePath = child.path.replace(/\\/g, '/');
          html += '<li><div class="file"><a href="./' + escapeHtml(filePath) + '" target="_blank">' + escapeHtml(child.name) + '</a></div></li>';
        } else if (child.type === 'directory') {
          html += buildTreeHTML(child);
        }
      }
      html += '</ul></li>';
      return html;
    }

    function createHTMLFromTree(tree, folderName) {
      var generationTime = new Date().toLocaleString();
      var treeHTML = buildTreeHTML(tree);
      
      return '<!DOCTYPE html>\n' +
'<html lang="zh-CN">\n' +

'        <button id="reset-search" style="display:none;"><span class="material-icons">refresh</span></button>\n' +

'    <ul class="tree">' + treeHTML + '</ul>\n' +
'    <div class="generation-info"><span class="material-icons">schedule</span><span>生成时间: ' + generationTime + '</span></div>\n' +
'</div>\n' +
'<script>\n' +
'  (function() {\n' +
'    document.querySelectorAll(".tree .directory-wrapper").forEach(function(wrapper) {\n' +
'      wrapper.addEventListener("click", function(e) {\n' +
'        e.stopPropagation();\n' +
'        var parentLi = wrapper.parentElement;\n' +
'        parentLi.classList.toggle("open");\n' +
'        var iconSpan = wrapper.querySelector(".toggle .material-icons");\n' +
'        if (parentLi.classList.contains("open")) iconSpan.textContent = "expand_more";\n' +
'        else iconSpan.textContent = "chevron_right";\n' +
'      });\n' +
'    });\n' +
'    function expandAll(node) {\n' +
'      node.querySelectorAll(".directory-wrapper").forEach(function(w) {\n' +
'        var li = w.parentElement;\n' +
'        li.classList.add("open");\n' +
'        var icon = w.querySelector(".toggle .material-icons");\n' +
'        if (icon) icon.textContent = "expand_more";\n' +
'      });\n' +
'    }\n' +
'    function collapseAll(node) {\n' +
'      node.querySelectorAll(".directory-wrapper").forEach(function(w) {\n' +
'        var li = w.parentElement;\n' +
'        li.classList.remove("open");\n' +
'        var icon = w.querySelector(".toggle .material-icons");\n' +
'        if (icon) icon.textContent = "chevron_right";\n' +
'      });\n' +
'    }\n' +
'    var treeContainer = document.querySelector(".tree");\n' +
'    expandAll(treeContainer);\n' +
'    var toggleAllBtn = document.getElementById("toggle-all");\n' +
'    toggleAllBtn.addEventListener("click", function() {\n' +
'      var icon = toggleAllBtn.querySelector(".material-icons");\n' +
'      if (icon.textContent === "unfold_more") {\n' +
'        collapseAll(treeContainer);\n' +
'        icon.textContent = "unfold_less";\n' +
'      } else {\n' +
'        expandAll(treeContainer);\n' +
'        icon.textContent = "unfold_more";\n' +
'      }\n' +
'    });\n' +
'    var themeBtn = document.getElementById("toggle-theme");\n' +
'    if (localStorage.getItem("theme") === "dark") {\n' +
'      document.body.classList.add("dark");\n' +
'      themeBtn.querySelector(".material-icons").textContent = "dark_mode";\n' +
'    }\n' +
'    themeBtn.addEventListener("click", function() {\n' +
'      document.body.classList.toggle("dark");\n' +
'      var isDark = document.body.classList.contains("dark");\n' +
'      themeBtn.querySelector(".material-icons").textContent = isDark ? "dark_mode" : "light_mode";\n' +
'      localStorage.setItem("theme", isDark ? "dark" : "light");\n' +
'    });\n' +
'    var searchInput = document.getElementById("search-input");\n' +
'    var resetBtn = document.getElementById("reset-search");\n' +
'    function filterTree() {\n' +
'      var term = searchInput.value.trim().toLowerCase();\n' +
'      var allItems = document.querySelectorAll(".tree li");\n' +
'      allItems.forEach(function(item) { item.classList.remove("match-highlight"); });\n' +
'      if (term === "") {\n' +
'        allItems.forEach(function(item) { item.style.display = ""; });\n' +
'        resetBtn.style.display = "none";\n' +
'        return;\n' +
'      }\n' +
'      resetBtn.style.display = "flex";\n' +
'      var hasMatch = false;\n' +
'      allItems.forEach(function(item) {\n' +
'        var text = item.textContent.toLowerCase();\n' +
'        if (text.indexOf(term) !== -1) {\n' +
'          hasMatch = true;\n' +
'          item.classList.add("match-highlight");\n' +
'          var parent = item.parentElement;\n' +
'          while (parent && !parent.classList.contains("tree")) {\n' +
'            if (parent.tagName === "UL") parent.style.display = "block";\n' +
'            var parentLi = parent.parentElement;\n' +
'            if (parentLi && parentLi.tagName === "LI") {\n' +
'              parentLi.classList.add("open");\n' +
'              var toggleIcon = parentLi.querySelector(".directory-wrapper .toggle .material-icons");\n' +
'              if (toggleIcon) toggleIcon.textContent = "expand_more";\n' +

'          item.style.display = "none";\n' +

'        var noMsg = document.createElement("div");\n' +
'        noMsg.textContent = "未找到匹配项";\n' +
'        noMsg.style.padding = "20px";\n' +
'        noMsg.style.textAlign = "center";\n' +
'        noMsg.style.color = "#999";\n' +

'      searchInput.value = "";\n' +

    }

    function downloadHTML(content, filename) {
      var blob = new Blob([content], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    }

    selectFolderBtn.addEventListener('click', async function() {
      try {
        showLoading(true);
        setStatus('正在访问文件夹...');
        if (!('showDirectoryPicker' in window)) {
          throw new Error('您的浏览器不支持文件夹选择功能，请使用最新版Chrome或Edge');
        }
        selectedFolderHandle = await window.showDirectoryPicker();
        setStatus('正在生成目录树...');
        treeStructure = await generateDirectoryTree(selectedFolderHandle);
        displayTreePreview(treeStructure);
        emptyState.style.display = 'none';
        generateBtn.disabled = false;
        setStatus('已选择: ' + selectedFolderHandle.name, 'success');
      } catch (err) {
        console.error(err);
        setStatus('错误: ' + err.message, 'error');
        if (err.name !== 'AbortError') {
          emptyState.style.display = 'flex';
          treePreview.textContent = '';
          generateBtn.disabled = true;
          selectedFolderHandle = null;
          treeStructure = null;
        }
      } finally {
        showLoading(false);
      }
    });

    generateBtn.addEventListener('click', async function() {
      if (!selectedFolderHandle || !treeStructure) {
        setStatus('请先选择文件夹并生成目录树', 'error');
        return;
      }
      try {
        showLoading(true);
        setStatus('正在生成HTML文件...');
        var htmlContent = createHTMLFromTree(treeStructure, selectedFolderHandle.name);
        downloadHTML(htmlContent, selectedFolderHandle.name + '_目录树.html');
        setStatus('HTML文件生成成功!', 'success');
      } catch (err) {
        console.error(err);
        setStatus('生成失败: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function(ev) {
      dropArea.addEventListener(ev, preventDefaults);
      document.body.addEventListener(ev, preventDefaults);
    });
    
    ['dragenter', 'dragover'].forEach(function(ev) {
      dropArea.addEventListener(ev, function() { dropArea.classList.add('drag-over'); });
    });
    
    ['dragleave', 'drop'].forEach(function(ev) {
      dropArea.addEventListener(ev, function() { dropArea.classList.remove('drag-over'); });
    });
    
    dropArea.addEventListener('drop', async function(e) {
      var items = e.dataTransfer.items;
      if (!items || items.length === 0) return;
      try {
        showLoading(true);
        setStatus('处理拖放的文件夹...');
        if (!('getAsFileSystemHandle' in items[0])) {
          throw new Error('您的浏览器不支持拖放文件夹功能，请使用最新版Chrome或Edge');
        }
        var handle = await items[0].getAsFileSystemHandle();
        if (handle.kind !== 'directory') throw new Error('请拖放文件夹而非文件');
        selectedFolderHandle = handle;
        setStatus('正在生成目录树...');
        treeStructure = await generateDirectoryTree(selectedFolderHandle);
        displayTreePreview(treeStructure);
        emptyState.style.display = 'none';
        generateBtn.disabled = false;
        setStatus('已选择: ' + selectedFolderHandle.name, 'success');
      } catch (err) {
        setStatus('拖放错误: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    });

    includeHiddenCheckbox.addEventListener('change', async function() {
      if (selectedFolderHandle) {
        try {
          showLoading(true);
          setStatus('正在更新目录树...');
          treeStructure = await generateDirectoryTree(selectedFolderHandle);
          displayTreePreview(treeStructure);
          setStatus('已更新: ' + selectedFolderHandle.name, 'success');
        } catch (err) {
          setStatus('更新失败: ' + err.message, 'error');
        } finally {
          showLoading(false);
        }
      }
    });
  })();
</script>
</body>
</html>
