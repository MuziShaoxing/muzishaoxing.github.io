            }

            function updateBubbles() {
                if (currentView !== 'default') { $('#bubbleContainer').innerHTML = '<span class="no-bubbles">当前视图不支持筛选</span>'; return; }
                let data = allData.filter(r => r && (getColValue(r,'问题原因名称')||'').trim() !== '冷链商品化冻');
                if (selectedStore) data = data.filter(r => String(getColValue(r,'门店名称')).trim() === selectedStore);
                const counts = new Map();
                data.forEach(r => { const k = (getColValue(r,'问题原因名称')||'').trim(); if (k) counts.set(k, (counts.get(k)||0)+1); });
                const reasons = [...counts.keys()].sort((a,b) => (counts.get(b)||0) - (counts.get(a)||0));
                
                const hasSelection = selectedReasons.size > 0;
                const allLabel = hasSelection ? '✕ 清空筛选' : '📋 全部';
                const allClass = hasSelection ? 'bubble-all has-selection' : 'bubble-all';
                
                let html = `<span class="bubble-tag ${allClass} ${!hasSelection?'active':''}" id="bubbleAll">${allLabel} <span class="bubble-count-inline">${data.length}条</span></span>`;
                reasons.forEach(r => html += `<span class="bubble-tag ${selectedReasons.has(r)?'active':''}" data-reason="${escapeHTML(r)}">${escapeHTML(r)} <span class="bubble-count-inline">${counts.get(r)}|${data.length?((counts.get(r)/data.length)*100).toFixed(1):0}%</span></span>`);
                $('#bubbleContainer').innerHTML = html;
                const ba = $('#bubbleAll');
                if (ba) ba.addEventListener('click', () => { selectedReasons.clear(); setCurrentPage(1); updateBubbles(); applyFilters(); });
                document.querySelectorAll('.bubble-tag[data-reason]').forEach(b => b.addEventListener('click', function() {
                    const r = this.dataset.reason;
                    selectedReasons.has(r) ? selectedReasons.delete(r) : selectedReasons.add(r);
                    setCurrentPage(1); updateBubbles(); applyFilters();
                }));
            }

            function applyFilters() {
                let data = currentView === 'default' ? [...allData] : (currentView === 'badReview' ? [...badReviewData] : [...coldThawData]);

                // 片区筛选：获取当前片区对应的门店集合
                let areaStoreSet = null;
                if (selectedArea) {
                    const areaStores = getAreaStores(selectedArea);
                    areaStoreSet = new Set(areaStores);
                }

                // 门店筛选：优先单门店，其次片区
                if (selectedStore) {
                    data = data.filter(r => String(getColValue(r, currentView==='badReview'?'门店':'门店名称')).trim() === selectedStore);
                } else if (areaStoreSet) {
                    data = data.filter(r => {
                        const storeName = String(getColValue(r, currentView==='badReview'?'门店':'门店名称')).trim();
                        return areaStoreSet.has(storeName);
                    });
                }
                if (currentView === 'default') {
                    data = data.filter(r => (getColValue(r,'问题原因名称')||'').trim() !== '冷链商品化冻');
                    if (selectedReasons.size) data = data.filter(r => selectedReasons.has((getColValue(r,'问题原因名称')||'').trim()));
                }

                // 全局后置排序：先生鲜店，后前置仓
                data.sort((a, b) => {
                    // 门店类型排序：生鲜店(0) < 前置仓(1)
                    const aStoreName = String(getColValue(a, currentView==='badReview'?'门店':'门店名称') || '').trim();
                    const bStoreName = String(getColValue(b, currentView==='badReview'?'门店':'门店名称') || '').trim();
                    const aIsQZC = aStoreName.includes('前置仓') ? 1 : 0;
                    const bIsQZC = bStoreName.includes('前置仓') ? 1 : 0;
                    if (aIsQZC !== bIsQZC) return aIsQZC - bIsQZC;

                    if (currentView === 'default' || currentView === 'coldThaw') {
                        // 物流损置顶
                        const aIsLogistics = (getColValue(a, '问题原因名称') || '').trim() === '物流损';
                        const bIsLogistics = (getColValue(b, '问题原因名称') || '').trim() === '物流损';
                        if (aIsLogistics && !bIsLogistics) return -1;
                        if (!aIsLogistics && bIsLogistics) return 1;

                        const aReason = (getColValue(a, 'app退款原因') || getColValue(a, 'APP退款原因') || '').trim();
                        const bReason = (getColValue(b, 'app退款原因') || getColValue(b, 'APP退款原因') || '').trim();
                        const aDesc = (getColValue(a, 'app退款描述') || getColValue(a, 'APP退款描述') || '').trim();
                        const bDesc = (getColValue(b, 'app退款描述') || getColValue(b, 'APP退款描述') || '').trim();
                        const aDoubleDash = aReason === '-' && aDesc === '-';
                        const bDoubleDash = bReason === '-' && bDesc === '-';
                        const aDescDash = aDesc === '-' && !aDoubleDash;
                        const bDescDash = bDesc === '-' && !bDoubleDash;
                        // 双"-"排最后，仅描述"-"排中间，其余排最前
                        const aPri = aDoubleDash ? 2 : (aDescDash ? 1 : 0);
                        const bPri = bDoubleDash ? 2 : (bDescDash ? 1 : 0);
                        if (aPri !== bPri) return aPri - bPri;
                    } else if (currentView === 'badReview') {
                        const aDash = (getColValue(a, '评价文本') || '').trim() === '-';
                        const bDash = (getColValue(b, '评价文本') || '').trim() === '-';
                        if (aDash && !bDash) return 1;
                        if (!aDash && bDash) return -1;
                    }
                    // 默认按批次号排序（仅限问单视图）
                    if (currentView === 'default') {
                        const aBatch = String(getColValue(a, '批次号') || '').trim();
                        const bBatch = String(getColValue(b, '批次号') || '').trim();
                        return aBatch.localeCompare(bBatch);
                    }
                    return 0;
                });

                // 计算重复批次（仅问单视图）
                if (currentView === 'default') {
                    duplicateBatchSet.clear();
                    const batchCounts = new Map();
                    data.forEach(r => { const b = String(getColValue(r,'批次号')||'').trim(); if (b) batchCounts.set(b, (batchCounts.get(b)||0)+1); });
                    batchCounts.forEach((v,k) => { if (v > 1) duplicateBatchSet.add(k); });
                }

                if (currentView === 'default') filteredData = data;
                else if (currentView === 'badReview') filteredBadReviewData = data;
                else filteredColdThawData = data;

                const cfd = currentView === 'default' ? filteredData : (currentView === 'badReview' ? filteredBadReviewData : filteredColdThawData);
                const totalPages = Math.ceil(cfd.length / pageSize) || 1;
                if (getCurrentPage() > totalPages) setCurrentPage(totalPages);
                renderTable();
            }

            function getCurrentPage() { return viewCurrentPages[currentView] || 1; }
            function setCurrentPage(p) { viewCurrentPages[currentView] = p; }

            function updateCurrentStoreLabel() {
                const el = $('#currentStoreName');
                if (selectedArea) {
                    const storeCount = getAreaStores(selectedArea).length;
                    el.innerHTML = `🗺️ 当前片区：${escapeHTML(selectedArea)}<span class="store-type-tag" style="background:#e0f2fe;color:#0369a1;">${storeCount}家门店</span>`;
                    return;
                }
                if (!selectedStore) {
                    el.textContent = '📍 当前门店：全部门店';
                    return;
                }
                
                const storeType = getStoreType(selectedStore);
                const typeLabel = getStoreTypeLabel(storeType);
                const typeClass = getStoreTypeClass(storeType);
                
                // 单行结构：📍 当前门店：店名 [类型标签]
                el.innerHTML = `📍 当前门店：${escapeHTML(selectedStore)}<span class="store-type-tag ${typeClass}">${typeLabel}</span>`;
            }

            function renderTable() {
                const cfd = currentView === 'default' ? filteredData : (currentView === 'badReview' ? filteredBadReviewData : filteredColdThawData);
                const start = (getCurrentPage()-1) * pageSize, end = Math.min(start + pageSize, cfd.length);
                const pageData = cfd.slice(start, end);
                const thead = $('#tableHead'), tbody = $('#tableBody');

                if (currentView === 'default')
                    thead.innerHTML = '<tr><th>门店</th><th>问题原因名称</th><th>SKU名称</th><th>APP退款原因</th><th>APP退款描述</th><th>退款凭证</th><th>单号</th><th>责任人</th></tr>';
                else if (currentView === 'badReview')
                    thead.innerHTML = '<tr><th>门店</th><th>交易日期</th><th>配送员名称</th><th>单号</th><th>评价文本</th><th>评价标签</th><th>评价星级</th></tr>';
                else
                    thead.innerHTML = '<tr><th>门店</th><th>问题原因名称</th><th>SKU名称</th><th>APP退款原因</th><th>APP退款描述</th><th>退款凭证</th><th>单号</th><th>责任人</th></tr>';

                tbody.innerHTML = '';
                $('#emptyState').style.display = pageData.length ? 'none' : 'block';
                if (!pageData.length) { $('#paginationBar').innerHTML = ''; return; }

                const fragment = document.createDocumentFragment();
                pageData.forEach(row => {
                    const tr = document.createElement('tr');
                    if (currentView === 'default' && duplicateBatchSet.has(String(getColValue(row,'批次号')||'').trim())) tr.classList.add('duplicate-batch');
                    if (currentView === 'default') {
                        tr.appendChild(createCell(getColValue(row,'门店名称')));
                        tr.appendChild(createClickableCell(getColValue(row,'问题原因名称')));
                        tr.appendChild(createClickableCell(getColValue(row,'sku名称')||getColValue(row,'SKU名称')));
                        tr.appendChild(createClickableCell(getColValue(row,'app退款原因')||getColValue(row,'APP退款原因')));
                        tr.appendChild(createLimitedWidthCell(getColValue(row,'app退款描述')||getColValue(row,'APP退款描述')));
                        tr.appendChild(createVoucherCell(row));
                        tr.appendChild(createOrderCell(row, ['淘系主订单id','批次号','配送单号']));
                        tr.appendChild(createPersonCell(row));
                    } else if (currentView === 'badReview') {
                        tr.appendChild(createCell(getColValue(row,'门店')));
                        tr.appendChild(createCell(getColValue(row,'交易日期')));
                        tr.appendChild(createCell(getColValue(row,'配送员名称')));
                        tr.appendChild(createOrderCell(row, ['评价父订单','盒马主订单','外部主订单','履约单号']));
                        tr.appendChild(createLimitedWidthCell(getColValue(row,'评价文本')));
                        tr.appendChild(createCell(getColValue(row,'评价标签')));
                        tr.appendChild(createStarCell(row));
                    } else {
                        tr.appendChild(createCell(getColValue(row,'门店名称')));
                        tr.appendChild(createCell('冷链商品化冻'));
                        tr.appendChild(createClickableCell(getColValue(row,'sku名称')||getColValue(row,'SKU名称')));
                        tr.appendChild(createClickableCell(getColValue(row,'app退款原因')||getColValue(row,'APP退款原因')));
                        tr.appendChild(createLimitedWidthCell(getColValue(row,'app退款描述')||getColValue(row,'APP退款描述')));
                        tr.appendChild(createVoucherCell(row));
                        tr.appendChild(createOrderCell(row, ['淘系主订单id','批次号','配送单号']));
                        tr.appendChild(createPersonCell(row));
                    }
                    fragment.appendChild(tr);
                });
                tbody.appendChild(fragment);
                renderPagination(cfd);
            }

            function createCell(text) { const td = document.createElement('td'); td.textContent = text || '-'; return td; }
            function createLimitedWidthCell(fullText) {
                const td = document.createElement('td');
                const span = document.createElement('span');
                span.className = 'cell-clickable';
                span.style.cssText = 'max-width:12.5em;display:inline-block;white-space:normal;word-break:break-all;line-height:1.4;vertical-align:middle;';
                span.textContent = fullText || '-';
                span.addEventListener('click', function(e) { e.stopPropagation(); showDetailPopup(span, fullText || '-', true); });
                td.appendChild(span);
                return td;
            }
            function createClickableCell(fullText) {
                const td = document.createElement('td');
                const span = document.createElement('span'); span.className = 'cell-clickable'; span.textContent = fullText || '-';
                span.addEventListener('click', function(e) { e.stopPropagation(); showDetailPopup(span, fullText || '-', true); });
                td.appendChild(span); return td;
            }
            function createVoucherCell(row) {
                const td = document.createElement('td');
                const urls = parseImageUrls(getColValue(row,'退款凭证')||'');
                if (urls.length) {
                    const img = document.createElement('img');
                    img.src = urls[0];
                    img.style.cssText = 'width:80px;height:80px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #e6e8f0;';
                    img.title = '点击查看全部' + urls.length + '张图片';
                    img.addEventListener('click', function(e) { e.stopPropagation(); openImagePreview(urls); });
                    td.appendChild(img);
                } else {
                    const btn = document.createElement('span'); btn.className='cell-view-btn no-image'; btn.textContent='无凭证'; td.appendChild(btn);
                }
                return td;
            }
            function createOrderCell(row, fields) {
                const td = document.createElement('td');
                const values = fields.map(f => getColValue(row,f)||'');
                if (values.some(v => String(v).trim())) {
                    const btn = document.createElement('span'); btn.className='cell-btn'; btn.textContent='📋 查看';
                    btn.addEventListener('click', e => { e.stopPropagation(); showDetailPopup(btn, fields.map((f,i) => makePopupRow(f, values[i])).join('')); });
                    td.appendChild(btn);
                } else {
                    const btn = document.createElement('span'); btn.className='cell-btn no-data'; btn.textContent='无数据'; td.appendChild(btn);
                }
                return td;
            }
            function createPersonCell(row) {
                const td = document.createElement('td');
                const delivery = String(getColValue(row,'配送员名')||'').trim();
                td.textContent = delivery && delivery !== '-' ? delivery : '-';
                return td;
            }
            function createTimeCell(row) {
                const td = document.createElement('td');
                const fields = ['批次生成时间','拣货完成时间','打包完成时间','揽收时间','最晚送达时间','签收时间'];
                const values = fields.map(f => formatTime(getColValue(row,f)||''));
                if (values.some(v => String(v).trim())) {
                    const btn = document.createElement('span'); btn.className='cell-btn'; btn.textContent='🕐 查看';
                    btn.addEventListener('click', e => { e.stopPropagation(); showDetailPopup(btn, fields.map((f,i) => makePopupRow(f, values[i]||'-')).join('')); });
                    td.appendChild(btn);
                } else {
                    const btn = document.createElement('span'); btn.className='cell-btn no-data'; btn.textContent='无数据'; td.appendChild(btn);
                }
                return td;
            }
            function formatTime(str) {
                if (!str) return '';
                const s = String(str).trim();
                if (/^\d+$/.test(s) && parseInt(s) > 40000 && parseInt(s) < 60000) {
                    const d = new Date((parseInt(s) - 25569) * 86400 * 1000);
                    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                }
                const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})[\sT]?(\d{1,2})?:(\d{1,2})?:(\d{1,2})?/);
                if (m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')+' '+(m[4]||'00').padStart(2,'0')+':'+(m[5]||'00').padStart(2,'0')+':'+(m[6]||'00').padStart(2,'0');
                const d = new Date(s);
                if (!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
                return s;
            }
            function createStarCell(row) {
                const td = document.createElement('td');
                const v = parseInt(getColValue(row,'评价星级'));
                if (!isNaN(v) && v > 0) td.innerHTML = '<span class="star-rating">'+'★'.repeat(v)+'☆'.repeat(5-v)+'</span>';
                else td.textContent = getColValue(row,'评价星级')||'-';
                return td;
            }
            function createSelectCell(row, key, options, map) {
                const td = document.createElement('td');
                const sel = document.createElement('select'); sel.className='cell-select';
                options.forEach(o => { const opt = document.createElement('option'); opt.value=o; opt.textContent=o; sel.appendChild(opt); });
                const saved = map.get(row._rowId) || {};
                sel.value = saved[key] || options[0];
                sel.addEventListener('change', () => { saved[key] = sel.value; map.set(row._rowId, saved); });
                td.appendChild(sel); return td;
            }
            function createInputCell(row, key, map) {
                const td = document.createElement('td');
                const inp = document.createElement('input'); inp.type='text'; inp.className='cell-input';
                const saved = map.get(row._rowId) || {};
                inp.value = saved[key] || '';
                inp.addEventListener('input', () => { saved[key] = inp.value; map.set(row._rowId, saved); });
                td.appendChild(inp); return td;
            }
            function parseImageUrls(v) {
                if (!v) return [];
                return String(v).trim().split(/[,，]+/).map(s => s.trim()).filter(s => s && s.length > 3 && !['无','空','none','null'].includes(s.toLowerCase()));
            }

            function openImagePreview(urls, startIdx = 0) {
                if (!urls || !urls.length) return;
                previewUrls = [...urls]; previewIdx = Math.max(0, Math.min(startIdx, urls.length - 1));
                showPreviewImage();
                $('#previewBubble').style.display = 'block';
                setTimeout(() => document.addEventListener('click', closePreviewOnClickOutside), 50);
            }
            function closePreviewOnClickOutside(e) {
                const pb = $('#previewBubble');
                if (pb.style.display === 'none') { document.removeEventListener('click', closePreviewOnClickOutside); return; }
                if (pb.contains(e.target) || e.target.closest('.cell-view-btn')) return;
                closeImagePreview();
            }
            function closeImagePreview() {
                $('#previewBubble').style.display = 'none';
                previewUrls = [];
                document.removeEventListener('click', closePreviewOnClickOutside);
            }
            function showPreviewImage() {
                const pb = $('#previewBubble');
                pb.innerHTML = `
                    <button class="preview-close" id="previewClose">✕</button>
                    <img src="${previewUrls[previewIdx]}" alt="预览" onclick="event.stopPropagation();">
                    <div class="preview-controls">
                        <button id="prevPreview" ${previewIdx===0?'disabled':''}>◀</button>
                        <span class="preview-counter">${previewIdx+1}/${previewUrls.length}</span>
                        <button id="nextPreview" ${previewIdx>=previewUrls.length-1?'disabled':''}>▶</button>
                        <button id="openFullscreen">🖥 全屏</button>
                    </div>
                `;
                pb.style.top = '50%'; pb.style.left = '50%'; pb.style.transform = 'translate(-50%,-50%)';
                document.getElementById('previewClose').addEventListener('click', (e) => { e.stopPropagation(); closeImagePreview(); });
                document.getElementById('prevPreview').addEventListener('click', (e) => { e.stopPropagation(); if (previewIdx > 0) { previewIdx--; showPreviewImage(); } });
                document.getElementById('nextPreview').addEventListener('click', (e) => { e.stopPropagation(); if (previewIdx < previewUrls.length-1) { previewIdx++; showPreviewImage(); } });
                document.getElementById('openFullscreen').addEventListener('click', (e) => { e.stopPropagation(); openFullscreen(previewUrls[previewIdx]); });
            }
            function openFullscreen(url) { $('#fullscreenImage').src = url; $('#fullscreenOverlay').style.display = 'flex'; }
            $('#btnCloseFullscreen').addEventListener('click', () => $('#fullscreenOverlay').style.display = 'none');
            $('#fullscreenOverlay').addEventListener('click', e => { if (e.target === $('#fullscreenOverlay')) $('#fullscreenOverlay').style.display = 'none'; });

            // 分页
            function renderPagination(cfd) {
                const bar = $('#paginationBar');
                bar.innerHTML = '';
                const totalPages = Math.ceil(cfd.length / pageSize) || 1;
                if (totalPages <= 1 && cfd.length <= pageSize) {
                    if (cfd.length) bar.innerHTML = '<span class="page-info">显示全部 ' + cfd.length + ' 条</span>';
                    return;
                }
                const cp = getCurrentPage();

                const btnFirst = document.createElement('button'); btnFirst.textContent = '首页';
                btnFirst.disabled = cp === 1;
                btnFirst.addEventListener('click', () => { setCurrentPage(1); applyFilters(); });
                bar.appendChild(btnFirst);

                const btnPrev = document.createElement('button'); btnPrev.textContent = '上一页';
                btnPrev.disabled = cp === 1;
                btnPrev.addEventListener('click', () => { setCurrentPage(cp - 1); applyFilters(); });
                bar.appendChild(btnPrev);

                let sp = Math.max(1, cp - 3), ep = Math.min(totalPages, cp + 3);
                for (let p = sp; p <= ep; p++) {
                    const bp = document.createElement('button');
                    bp.textContent = p;
                    if (p === cp) bp.classList.add('active-page');
                    bp.addEventListener('click', () => { setCurrentPage(p); applyFilters(); });
                    bar.appendChild(bp);
                }

                const btnNext = document.createElement('button'); btnNext.textContent = '下一页';
                btnNext.disabled = cp >= totalPages;
                btnNext.addEventListener('click', () => { setCurrentPage(cp + 1); applyFilters(); });
                bar.appendChild(btnNext);

                const btnLast = document.createElement('button'); btnLast.textContent = '末页';
                btnLast.disabled = cp >= totalPages;
                btnLast.addEventListener('click', () => { setCurrentPage(totalPages); applyFilters(); });
                bar.appendChild(btnLast);

                const sel = document.createElement('select');
                [10, 20, 30, 50, 100].forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = '每页' + n + '条'; if (n === pageSize) o.selected = true; sel.appendChild(o); });
                sel.addEventListener('change', () => { pageSize = +sel.value; setCurrentPage(1); applyFilters(); });
                bar.appendChild(sel);

                const info = document.createElement('span'); info.className = 'page-info';
                info.textContent = '共 ' + totalPages + ' 页 / ' + cfd.length + ' 条';
                bar.appendChild(info);
            }

            function updateViewBubblesVisibility() {
                // 构建当前筛选的门店集合
                let filterStoreSet = null;
                if (selectedStore) {
                    filterStoreSet = new Set([selectedStore]);
                } else if (selectedArea) {
                    filterStoreSet = new Set(getAreaStores(selectedArea));
                }

                const storeFilter = (r, colName) => {
                    if (!filterStoreSet) return true;
                    return filterStoreSet.has(String(getColValue(r, colName) || '').trim());
                };

                const showBad = badReviewData.length && badReviewData.some(r => storeFilter(r, '门店'));
                $('#viewBubbleBadReview').style.display = showBad ? 'inline-flex' : 'none';
                if (showBad) $('#badReviewBadge').textContent = badReviewData.filter(r => storeFilter(r, '门店')).length;
                const showCold = coldThawData.length && coldThawData.some(r => storeFilter(r, '门店名称'));
                $('#viewBubbleColdThaw').style.display = showCold ? 'inline-flex' : 'none';
                if (showCold) $('#coldThawBadge').textContent = coldThawData.filter(r => storeFilter(r, '门店名称')).length;
                const defaultData = allData.filter(r => (getColValue(r,'问题原因名称')||'').trim() !== '冷链商品化冻');
                $('#defaultBadge').textContent = defaultData.filter(r => storeFilter(r, '门店名称')).length;
                updateViewBubbleActiveState();

            function buildWuliusunReportTables() {
                // 获取当前筛选的门店列表 - 仅导出当前选择的片区或门店数据
                let stores = [];
                if (selectedArea) {
                    stores = getAreaStores(selectedArea);
                } else if (selectedStore) {
                    stores = [selectedStore];
                } else {
                    // 未选择片区或门店时，返回空（不导出数据）
                    return '';
                }
                
                if (!stores.length) return '';
                
                // 按门店数据量降序排序，先生鲜店再前置仓分别排序
                const getStoreDataCount = (storeName) => {
                    return allData.filter(r => {
                        const rowStore = String(getColValue(r,'门店名称')||'').trim();
                        const reason = String(getColValue(r,'问题原因名称')||'').trim();
                        return rowStore === storeName && reason === '物流损';
                    }).length;
                };
                
                // 分离生鲜店和前置仓
                const sxStores = stores.filter(s => !s.includes('前置仓'));
                const qzcStores = stores.filter(s => s.includes('前置仓'));
                
                // 分别按数据量降序排序
                const sortedSxStores = [...sxStores].sort((a, b) => getStoreDataCount(b) - getStoreDataCount(a));
                const sortedQzcStores = [...qzcStores].sort((a, b) => getStoreDataCount(b) - getStoreDataCount(a));
                
                // 合并排序后的列表（先生鲜店，后前置仓）
                const sortedStores = [...sortedSxStores, ...sortedQzcStores];
                
                // 收集所有数据并排序
                let allRows = [];
                sortedStores.forEach(storeName => {
                    let storeData = allData.filter(r => {
                        const rowStore = String(getColValue(r,'门店名称')||'').trim();
                        const reason = String(getColValue(r,'问题原因名称')||'').trim();
                        return rowStore === storeName && reason === '物流损';
                    });
                    
                    if (!storeData.length) return;
                    
                    // 数据排序：APP退款原因和APP退款描述都为"-"的排后面
                    storeData.sort((a, b) => {
                        const aReason = String(getColValue(a, 'app退款原因') || getColValue(a, 'APP退款原因') || '').trim();
                        const aDesc = String(getColValue(a, 'app退款描述') || getColValue(a, 'APP退款描述') || '').trim();
                        const bReason = String(getColValue(b, 'app退款原因') || getColValue(b, 'APP退款原因') || '').trim();
                        const bDesc = String(getColValue(b, 'app退款描述') || getColValue(b, 'APP退款描述') || '').trim();
                        
                        const aIsDash = aReason === '-' && aDesc === '-';
                        const bIsDash = bReason === '-' && bDesc === '-';
                        
                        if (aIsDash && !bIsDash) return 1;
                        if (!aIsDash && bIsDash) return -1;
                        return 0;
                    });
                    
                    allRows = allRows.concat(storeData);
                });
                
                if (!allRows.length) return '<div class="no-data">暂无物流损数据</div>';
                
                const tableHeaders = ['门店', '问题原因名称', 'SKU名称', 'APP退款原因', 'APP退款描述', '退款凭证', '单号', '责任人'];
                
                let html = '<table style="width:100%;border-collapse:collapse;font-size:0.75rem;">';
                html += '<thead><tr style="background:#f8f9fd;">' + tableHeaders.map(h => `<th style="padding:8px 6px;border:1px solid #e6e8f0;font-weight:700;color:#6b6b88;">${h}</th>`).join('') + '</tr></thead>';
                html += '<tbody>';
                
                allRows.forEach(row => {
                    const storeName = String(getColValue(row,'门店名称')||'').trim();
                    const storeType = getStoreType(storeName);
                    const typeLabel = storeType === 'qianzhicang' ? '前置仓' : '生鲜店';
                    const typeClass = storeType === 'qianzhicang' ? 'qianzhicang' : 'shengxian';
                    
                    html += '<tr style="background:#fafbfd;">';
                    html += `<td style="padding:8px 6px;border:1px solid #e6e8f0;">${escapeHTML(storeName)} <span class="store-type-tag ${typeClass}">${typeLabel}</span></td>`;
                    html += `<td style="padding:8px 6px;border:1px solid #e6e8f0;">${escapeHTML(getColValue(row,'问题原因名称')||'')}</td>`;

                currentPopup = popup;
                popup.querySelectorAll('.info-copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const txt = this.dataset.copy || '';
                        if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(() => { this.classList.add('copied'); setTimeout(() => this.classList.remove('copied'), 1500); }); }
                    });
                });
            }

            function positionPopup(anchor, popup) {
                const rect = anchor.getBoundingClientRect();
                const pw = popup.offsetWidth || 200, ph = popup.offsetHeight || 150;
                let top = rect.bottom + 8, left = rect.left + rect.width/2 - pw/2;
                if (top + ph > window.innerHeight - 10) top = rect.top - ph - 8;
                if (top < 10) top = 10;
                if (left < 10) left = 10;
                else if (left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
                popup.style.top = top + 'px'; popup.style.left = left + 'px';
            }

            function makePopupRow(label, value) {
                return `<div class="info-row"><span class="info-label">${escapeHTML(label)}</span><span class="info-value">${escapeHTML(value||'-')}</span><span class="info-copy-btn" data-copy="${escapeHTML(value||'')}">📋 复制</span></div>`;
            }

            // 初始化
            ['filterBar','tableWrapper','statsPanel','achievementPanel'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display='none';
            });
            openGuideView('📂 上传问单明细', '请上传Excel文件以开始分析',
                '<div class="file-upload-area" id="initUploadArea"><span class="upload-text-lg">📁 点击选择文件</span></div><div class="upload-hint">💡 上传大文件时页面可能出现短暂卡顿，请耐心等待加载完成。<br>如页面提示"无响应"，请点击<b>「等待」</b>按钮，切勿关闭页面。</div><div class="upload-progress-wrap" id="initProgressWrap"><div class="upload-progress-bar"><div class="upload-progress-fill" id="initProgressFill"></div></div><div class="upload-progress-text" id="initProgressText">准备中...</div></div>', '');
            document.getElementById('initUploadArea').addEventListener('click', () => hiddenFileInput.click());
            hiddenFileInput.addEventListener('change', e => { if (e.target.files[0]) handleFileUpload(e.target.files[0]); });
        })();
    </script>
</body>
</html>
