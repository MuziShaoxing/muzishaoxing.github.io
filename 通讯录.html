<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>极简通讯录转换器 | TXT转CSV/VCF · 本地隐私</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f8;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 主卡片 - 现代轻盈 */
        .card {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部简洁渐变 */
        .header {
            background: linear-gradient(105deg, #0b2b44 0%, #1a4a6f 100%);
            color: white;
            padding: 1.8rem 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 0.4rem;
        }

        .header p {
            opacity: 0.85;
            font-size: 0.95rem;
        }

        /* 隐私标识行 */
        .privacy-tag {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
            align-items: center;
        }
        .badge {
            background: rgba(255,255,240,0.18);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            padding: 0.25rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .local-badge {
            background: rgba(80, 200, 120, 0.2);
            border-left: 3px solid #9bffb0;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* 主要内容区 */
        .content {
            padding: 1.8rem 2rem 2rem;
        }

        /* 上传区域 - 现代虚线 */
        .upload-zone {
            border: 2px dashed #cbdde9;
            border-radius: 1.8rem;
            background: #fafdff;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        .upload-zone:hover {
            border-color: #2c6e9e;
            background: #f4faff;
        }
        .upload-zone.drag-over {
            border-color: #1e88e5;
            background: #e9f2fe;
            box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
        }
        .upload-icon {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
        }
        .upload-text {
            font-weight: 500;
            color: #1e2f41;
            margin-bottom: 0.25rem;
        }
        .upload-hint {
            font-size: 0.75rem;
            color: #5e7a93;
            margin-top: 0.25rem;
        }
        .file-label-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a4a6f;
            color: white;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            margin-top: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-label-btn:hover {
            background: #0d3654;
        }
        input[type="file"] {
            display: none;
        }
        .file-badge {
            margin-top: 1rem;
            background: #e9f0f6;
            border-radius: 3rem;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            display: inline-block;
            color: #1f4970;
        }

        /* 预览卡片 */
        .preview-card {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 1px solid #e4edf5;
            margin: 1.5rem 0 1rem;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem 1.2rem 0.4rem 1.2rem;
            background: #fefefe;
            border-bottom: 1px solid #ecf3f9;
        }
        .preview-title {
            font-weight: 600;
            color: #1f3b5c;
        }
        .count-chip {
            background: #e5edf6;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f4a76;
        }
        .table-wrapper {
            overflow-x: auto;
            padding: 0 0.2rem 0.2rem 0.2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        th {
            text-align: left;
            padding: 0.8rem 0.8rem;
            background: #f8fafd;
            color: #2c5277;
            font-weight: 600;
            border-bottom: 1px solid #e2ecf5;
        }
        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #f0f4fa;
            color: #1f2f3e;
        }
        tr:hover td {
            background-color: #fafcff;
        }
        .warning-note {
            margin: 0.6rem 1rem 1rem 1rem;
            font-size: 0.7rem;
            color: #c07a2c;
            background: #fff5e8;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            display: inline-block;
        }

        /* 按钮区域 */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0 1rem;
        }
        .btn {
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-primary {
            background: #1a4a6f;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }
        .btn-primary:hover {
            background: #0e3a58;
            transform: translateY(-1px);
        }
        .btn-outline {
            border: 1px solid #c2d6ea;
            background: white;
            color: #1a4a6f;
        }
        .btn-outline:hover {
            background: #ecf5fc;
            border-color: #6c9bc2;
        }

        /* 状态栏 */
        .status-area {
            background: #eef3fa;
            border-radius: 2rem;
            padding: 0.7rem 1.2rem;
            margin-top: 1.2rem;
            font-size: 0.85rem;
            text-align: center;
            color: #1f4973;
        }
        .status-error {
            background: #ffe8e8;
            color: #bc2f3e;
        }
        .status-success {
            background: #e2f3e6;
            color: #146b3a;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #7f8fa0;
            margin-top: 1.8rem;
            border-top: 1px solid #eef2f8;
            padding-top: 1.2rem;
        }
        .inline-code {
            background: #eef2f5;
            border-radius: 12px;
            padding: 0.1rem 0.4rem;
            font-family: monospace;
            font-size: 0.7rem;
        }
        .hide {
            display: none;
        }
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .content {
                padding: 1.2rem;
            }
            .btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }
            th, td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>📇 通讯录转换器</h1>
        <p>TXT → CSV / VCF · 纯本地转换 · 三列模式</p>
        <div class="privacy-tag">
            <span class="badge">🔒 数据绝不上传</span>
            <span class="badge">📄 逗号/空格/制表符</span>
            <span class="badge">📱 标准vCard</span>
            <span class="local-badge">✅ 完全浏览器本地处理</span>
        </div>
    </div>

    <div class="content">
        <!-- 上传区域 -->
        <div id="dropZone" class="upload-zone">
            <div class="upload-icon">📂</div>
            <div class="upload-text">拖拽或点击上传TXT文件</div>
            <div class="upload-hint">支持 UTF-8 / GBK 编码 · 自动识别分隔符</div>
            <label class="file-label-btn">
                📁 选择文件
                <input type="file" id="fileInput" accept=".txt, .text, text/plain">
            </label>
            <div id="fileNameDisplay" class="file-badge" style="display: none;"></div>
        </div>

        <!-- 预览区 -->
        <div id="previewArea" class="hide">
            <div class="preview-card">
                <div class="preview-header">
                    <span class="preview-title">📋 数据预览</span>
                    <span id="contactCountSpan" class="count-chip">0条</span>
                </div>
                <div class="table-wrapper">
                    <table id="previewTable">
                        <thead>
                            <tr><th>姓名</th><th>电话</th><th>公司/备注</th></tr>
                        </thead>
                        <tbody id="previewTableBody"></tbody>
                    </table>
                </div>
                <div id="parseWarningMsg" class="warning-note" style="display: none;"></div>
                <div id="extraHintMsg" style="font-size:0.7rem; padding:0 1rem 0.8rem 1rem; color:#7b8c9e;"></div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div id="actionButtons" class="hide">
            <div class="button-group">
                <button id="toCsvBtn" class="btn btn-primary">📎 导出 CSV</button>
                <button id="toVcfBtn" class="btn btn-primary">📱 导出 VCF</button>
                <button id="toBothBtn" class="btn btn-outline">⚡ 同时导出 CSV + VCF</button>
            </div>
        </div>

        <!-- 动态状态栏 -->
        <div id="statusMsg" class="status-area">
            💡 选择TXT文件开始转换（数据只留在你的设备中）
        </div>
        <footer>
            🧩 格式示例：<span class="inline-code">张三,13800001111,腾讯科技</span> 或 <span class="inline-code">李四 13912345678</span>  · 最多三列，超出自动截断<br>
            ⚡ 纯本地隐私安全，无服务端交互，可放心处理敏感通讯录
        </footer>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 元素 ----------
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const previewArea = document.getElementById('previewArea');
        const actionButtons = document.getElementById('actionButtons');
        const previewTableBody = document.getElementById('previewTableBody');
        const contactCountSpan = document.getElementById('contactCountSpan');
        const parseWarningMsgDiv = document.getElementById('parseWarningMsg');
        const extraHintMsgSpan = document.getElementById('extraHintMsg');
        const statusMsgDiv = document.getElementById('statusMsg');
        const toCsvBtn = document.getElementById('toCsvBtn');
        const toVcfBtn = document.getElementById('toVcfBtn');
        const toBothBtn = document.getElementById('toBothBtn');

        // 存储联系人 [{ name, phone, company }]
        let currentContacts = [];
        let currentFileName = "";
        let currentWarnings = [];

        // ---------- UI 辅助 ----------
        function setStatus(text, isError = false, isSuccess = false) {
            statusMsgDiv.innerHTML = isError ? `❌ ${text}` : (isSuccess ? `✅ ${text}` : `ℹ️ ${text}`);
            statusMsgDiv.classList.remove('status-error', 'status-success');
            if (isError) statusMsgDiv.classList.add('status-error');
            else if (isSuccess) statusMsgDiv.classList.add('status-success');
        }

        function clearStatusStyle() {
            statusMsgDiv.classList.remove('status-error', 'status-success');
        }

        function resetUIForNewFile() {
            previewArea.classList.add('hide');
            actionButtons.classList.add('hide');
            parseWarningMsgDiv.style.display = 'none';
            parseWarningMsgDiv.innerHTML = '';
            extraHintMsgSpan.innerHTML = '';
            currentContacts = [];
            currentWarnings = [];
        }

        // 解析核心: 行->最多三列, 姓名/电话/公司
        function parseLineToContact(lineText, lineIndex) {
            let trimmed = lineText.trim();
            if (trimmed === "") return null;
            let parts = [];
            let separator = null;
            if (trimmed.includes(',')) {
                parts = trimmed.split(',').map(s => s.trim());
                separator = ',';
            } else if (trimmed.includes('，')) {
                parts = trimmed.split('，').map(s => s.trim());
                separator = '，';
            } else if (trimmed.includes('\t')) {
                parts = trimmed.split('\t').map(s => s.trim());
                separator = 'tab';
            } else if (trimmed.includes('|')) {
                parts = trimmed.split('|').map(s => s.trim());
                separator = '|';
            } else if (trimmed.includes(' ')) {
                parts = trimmed.split(' ').map(s => s.trim()).filter(s => s !== "");
                separator = 'space';
            } else {
                // 无分隔符当作整体姓名
                parts = [trimmed];
            }
            if (parts.length === 0) return null;
            
            let originalLen = parts.length;
            let warningMsg = null;
            if (parts.length > 3) {
                warningMsg = `第${lineIndex}行: 包含${parts.length}列，仅保留前3列(姓名/电话/公司)`;
                parts = parts.slice(0, 3);
            }
            
            let name = "", phone = "", company = "";
            if (parts.length >= 3) {
                name = parts[0] || "";
                phone = parts[1] || "";
                company = parts[2] || "";
            } else if (parts.length === 2) {
                name = parts[0] || "";
                phone = parts[1] || "";
                company = "";
            } else {
                name = parts[0] || "";
                phone = "";
                company = "";
                if (warningMsg) warningMsg += ` (仅单字段作为姓名)`;
                else warningMsg = `第${lineIndex}行: 仅1个字段，作为姓名，电话为空`;
            }
            
            // 姓名兜底
            if (!name && phone) {
                name = "未命名";
                warningMsg = warningMsg ? warningMsg + `；姓名为空设为"未命名"` : `第${lineIndex}行: 姓名为空，已设为"未命名"`;
            }
            if (!name && !phone) {
                return null;  // 无效联系人
            }
            // 电话为空增加温和警告但不丢弃
            if (!phone && name) {
                if (!warningMsg) warningMsg = `第${lineIndex}行: 电话为空 (姓名: ${name})`;
                else warningMsg += `；电话为空`;
            }
            
            return { name, phone, company, warning: warningMsg };
        }

        // 完整解析多行文本
        function parseTxtToContacts(content) {
            const lines = content.split(/\r?\n/);
            const contacts = [];
            const warnings = [];
            for (let i = 0; i < lines.length; i++) {
                const rawLine = lines[i];
                if (rawLine.trim() === "") continue;
                const result = parseLineToContact(rawLine, i+1);
                if (result === null) {
                    warnings.push(`第${i+1}行: 无效数据 (缺少姓名和电话)，已跳过`);
                    continue;
                }
                contacts.push({
                    name: result.name,
                    phone: result.phone,
                    company: result.company || ""
                });
                if (result.warning) warnings.push(result.warning);
            }
            return { contacts, warnings };
        }

        // 编码探测 + 文件读取
        async function readFileWithEncoding(file) {
            const encodings = ['utf-8', 'gbk', 'gb2312', 'utf-8-sig'];
            let lastError = null;
            for (let enc of encodings) {
                try {
                    const buffer = await file.arrayBuffer();
                    const decoder = new TextDecoder(enc);
                    const decoded = decoder.decode(buffer);
                    if (!decoded.includes('�') || enc === 'utf-8-sig') {
                        return { content: decoded, encoding: enc };
                    }
                } catch(e) {
                    lastError = e;
                }
            }
            throw new Error("无法解码文件，请确保UTF-8或GBK编码");
        }

        // 加载并处理文件
        async function loadAndParseFile(file) {
            if (!file) return false;
            resetUIForNewFile();
            fileNameDisplay.style.display = "inline-block";
            fileNameDisplay.innerText = `📄 ${file.name}`;
            currentFileName = file.name;
            setStatus(`正在本地解析 ${file.name} ...`, false, false);
            
            try {
                const { content, encoding } = await readFileWithEncoding(file);
                const { contacts, warnings } = parseTxtToContacts(content);
                currentContacts = contacts;
                currentWarnings = warnings;
                
                if (contacts.length === 0) {
                    setStatus("未找到有效联系人，请检查格式（姓名+电话，逗号/空格分隔）", true, false);
                    previewArea.classList.add('hide');
                    actionButtons.classList.add('hide');
                    return false;
                }
                
                // 渲染预览
                renderPreviewTable(contacts);
                // 处理警告显示
                if (warnings.length > 0) {
                    const shortWarnings = warnings.slice(0, 6);
                    let warnHtml = `⚠️ 解析提示: ${shortWarnings.join('； ')}`;
                    if (warnings.length > 6) warnHtml += ` 等${warnings.length}条提醒（数据已按三列规范处理）`;
                    parseWarningMsgDiv.innerHTML = warnHtml;
                    parseWarningMsgDiv.style.display = "block";
                    setStatus(`解析完成，共 ${contacts.length} 条联系人，有 ${warnings.length} 条辅助提醒（已按三列处理），可导出`, false, true);
                } else {
                    parseWarningMsgDiv.style.display = "none";
                    setStatus(`成功解析 ${contacts.length} 条联系人（仅保留姓名/电话/公司），可安全导出`, false, true);
                }
                previewArea.classList.remove('hide');
                actionButtons.classList.remove('hide');
                return true;
            } catch (err) {
                console.error(err);
                setStatus(`读取失败: ${err.message || "编码不支持"}`, true, false);
                previewArea.classList.add('hide');
                actionButtons.classList.add('hide');
                return false;
            }
        }

        // 渲染表格 (最多99条)
        function renderPreviewTable(contacts) {
            const limit = 99;
            const sliceContacts = contacts.slice(0, limit);
            previewTableBody.innerHTML = "";
            for (let c of sliceContacts) {
                const row = previewTableBody.insertRow();
                row.insertCell(0).textContent = c.name || "—";
                row.insertCell(1).textContent = c.phone || "—";
                row.insertCell(2).textContent = c.company || "—";
            }
            contactCountSpan.innerText = `${contacts.length} 条记录`;
            if (contacts.length > limit) {
                extraHintMsgSpan.innerHTML = `📌 仅展示前 ${limit} 条，完整共 ${contacts.length} 条记录。`;
            } else {
                extraHintMsgSpan.innerHTML = "";
            }
        }

        // ---------- 导出模块 ----------
        function escapeCsvField(str) {
            if (str === undefined || str === null) return "";
            let s = String(str);
            if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) {
                s = '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        }

        function exportToCSV(contacts, baseName = "通讯录") {
            if (!contacts.length) {
                setStatus("无联系人数据，无法导出CSV", true, false);
                return false;
            }
            const headers = ["姓名", "电话", "公司"];
            const rows = contacts.map(c => [
                escapeCsvField(c.name),
                escapeCsvField(c.phone),
                escapeCsvField(c.company)
            ]);
            const csvLines = [headers.join(","), ...rows.map(row => row.join(","))];
            const csvString = csvLines.join("\n");
            const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            let safeName = (currentFileName ? currentFileName.replace(/\.txt$/i, '') : "contacts") + "_通讯录.csv";
            a.href = url;
            a.download = safeName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus(`CSV 已导出 (${contacts.length}条，三列规范)`, false, true);
            return true;
        }

        function exportToVCF(contacts, baseName = "通讯录") {
            if (!contacts.length) {
                setStatus("无联系人数据，无法导出VCF", true, false);
                return false;
            }
            const vcardParts = [];
            for (let contact of contacts) {
                let fullName = contact.name.trim() || "未命名";
                let phoneRaw = contact.phone ? contact.phone.replace(/[\s\-\(\)]/g, '') : "";
                let companyRaw = contact.company || "";
                vcardParts.push("BEGIN:VCARD", "VERSION:3.0", `FN:${fullName}`, `N:${fullName};;;;`);
                if (phoneRaw) vcardParts.push(`TEL;TYPE=CELL:${phoneRaw}`);
                if (companyRaw) vcardParts.push(`ORG:${companyRaw}`);
                vcardParts.push("END:VCARD", "");
            }
            const vcfString = vcardParts.join("\r\n");
            const blob = new Blob([vcfString], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            let safeName = (currentFileName ? currentFileName.replace(/\.txt$/i, '') : "contacts") + "_通讯录.vcf";
            a.href = url;
            a.download = safeName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus(`VCF 已导出 (${contacts.length}条标准vCard)`, false, true);
            return true;
        }

        function exportBoth() {
            if (!currentContacts.length) {
                setStatus("没有联系人数据，请先上传TXT文件", true);
                return;
            }
            exportToCSV(currentContacts);
            exportToVCF(currentContacts);
            setStatus(`同时导出 CSV + VCF (共${currentContacts.length}条记录)`, false, true);
        }

        // ---------- 事件绑定 ----------
        toCsvBtn.addEventListener('click', () => {
            if (currentContacts.length) exportToCSV(currentContacts);
            else setStatus("请先上传文件", true);
        });
        toVcfBtn.addEventListener('click', () => {
            if (currentContacts.length) exportToVCF(currentContacts);
            else setStatus("请先上传文件", true);
        });
        toBothBtn.addEventListener('click', exportBoth);
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length) {
                loadAndParseFile(e.target.files[0]);
                fileInput.value = ''; // 允许重新上传同一文件再次触发
            }
        });
        
        // 拖拽交互
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length) {
                const file = files[0];
                if (file.name.toLowerCase().endsWith('.txt') || file.type === 'text/plain' || file.name.includes('.txt')) {
                    loadAndParseFile(file);
                } else {
                    setStatus("请拖拽 .txt 格式的通讯录文件", true);
                }
            }
        });
        dropZone.addEventListener('click', (e) => {
            if (e.target === dropZone || e.target.closest('.upload-zone') && !e.target.closest('.file-label-btn')) {
                fileInput.click();
            }
        });
        
        // 初始重置
        resetUIForNewFile();
        setStatus("💡 点击或拖拽TXT文件开始转换（数据纯本地，隐私无忧）", false, false);
    })();
</script>
</body>
</html>
